}

  --good:#52c985; --good-soft:#173d28; --bad:#f08a55; --bad-soft:#44241a; --coffee:#d9a77e; --coffee-soft:#3a2a1f; --zr-ink:#e3e5e8; --zr-muted:#a3a8ae;
  --road:#2b3638; --road-edge:#1b2425; --lane:#c9c4ae; --ground-a:#12282a; --ground-b:#163033; --bldg:#24403f; --bldg-2:#2c4d4b; --wall:#3a4746; --wall-2:#314040; --roof:#7f5a4a; --leaf:#4d6c58; --leaf-2:#5d7d68; --water:#21434b; --win:#d8c48a; --ink-1:#a9b8b4; --ink-2:#6c7e7a; --mist:#0f2426; --seal:#c4553d; --brick:#7e5a4e; --lotus:#b98583; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1b1c; --card:#152a2c; --ink:#e6f1ef; --muted:#9bb3b1; --line:#27403f;
  --teal:#3cc4b4; --teal-soft:#16413f; --gold:#f2b83a; --gold-soft:#463816;
  --good:#52c985; --good-soft:#173d28; --bad:#f08a55; --bad-soft:#44241a; --coffee:#d9a77e; --coffee-soft:#3a2a1f; --zr-ink:#e3e5e8; --zr-muted:#a3a8ae;
  --road:#2b3638; --road-edge:#1b2425; --lane:#c9c4ae; --ground-a:#12282a; --ground-b:#163033; --bldg:#24403f; --bldg-2:#2c4d4b; --wall:#3a4746; --wall-2:#314040; --roof:#7f5a4a; --leaf:#4d6c58; --leaf-2:#5d7d68; --water:#21434b; --win:#d8c48a; --ink-1:#a9b8b4; --ink-2:#6c7e7a; --mist:#0f2426; --seal:#c4553d; --brick:#7e5a4e; --lotus:#b98583; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;
  padding-block:0 170px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.wrap{max-width:560px;margin:0 auto}

@media (prefers-reduced-motion:no-preference){
 #avatar .av-body,#avatar .av-head{animation:breathe 2.6s ease-in-out infinite}

 .av-aura{animation:pulse 2.2s ease-in-out infinite}

@keyframes breathe{50%{transform:translateY(-.8px)}} @keyframes hop{50%{transform:translateY(-3px)}}

.pill.xp{border-color:var(--gold);background:var(--gold-soft)} .pill.cap{border-color:var(--good);background:var(--good-soft)} .pill.rank{border-color:var(--teal);background:var(--teal-soft)}
.pill.lives{border-color:var(--bad);background:var(--bad-soft)}
.map{margin-top:10px;border-radius:18px;overflow:hidden;border:1.5px solid var(--line);background:var(--ground-b)}
svg#road{display:block;width:100%;height:auto}
svg text{font-family:var(--font)}
.node,.npc{cursor:pointer}
@media (prefers-reduced-motion:no-preference){.npc .bob{animation:bob 1.6s ease-in-out infinite}.cur-ring{animation:pulse 1.4s ease-in-out infinite}
  .lm .smoke{animation:smoke 3s ease-in-out infinite}.spin{animation:spin 6s linear infinite}}
@keyframes smoke{0%,100%{opacity:.5;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}@keyframes spin{to{transform:rotate(360deg)}}
.lm-name{paint-order:stroke;stroke:var(--ground-a);stroke-width:2.5px;stroke-linejoin:round}
@keyframes bob{50%{transform:translateY(-4px)}} @keyframes pulse{50%{opacity:.35}}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1.5px solid var(--line);
  padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.bar h2{font-size:18px;margin:2px 0 8px;line-height:1.3;text-wrap:balance}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-width:0;font:700 15px var(--font);border-radius:12px;border:2px solid var(--teal);background:var(--teal);color:#fff;padding:11px 14px;cursor:pointer;text-align:center}
.btn.ghost{background:none;color:var(--teal);flex:0 0 auto}
.acts .btn{min-width:max-content}
.btn:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:13px}
/* play view */
.play{position:fixed;inset:0;z-index:8;background:var(--bg);overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.play header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.stack{display:grid;gap:12px}
h1{font-size:24px;line-height:1.2;margin:4px 0 8px;letter-spacing:-.02em;text-wrap:balance}

p{margin:0 0 10px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:2px 9px;background:var(--teal-soft);color:var(--teal);margin-bottom:10px}
.tag.vi{background:var(--gold-soft);color:var(--ink);margin-left:6px}
.dots{display:flex;gap:6px;margin:0 0 12px} .dots i{flex:1;height:7px;border-radius:4px;background:var(--line)}
.dots i.done{background:var(--teal)} .dots i.cur{background:var(--gold)}
.opt{display:block;width:100%;text-align:left;font:600 15px/1.45 var(--font);color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px;cursor:pointer}
.opt:hover{border-color:var(--teal)} .opt.sel{border-color:var(--teal);background:var(--teal-soft)}
.opt.ok{border-color:var(--good);background:var(--good-soft)} .opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.gone{opacity:.3;text-decoration:line-through;pointer-events:none}
.tfrow{border-top:1px solid var(--line);padding:12px 0;display:grid;gap:8px} .tfrow:first-of-type{border-top:0;padding-top:0}
.tfbtns{display:flex;gap:8px} .tfbtns .opt{margin:0;text-align:center;padding:8px}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pairs .opt{margin:0;font-size:14px;padding:10px}
.pairs .opt.paired{border-style:dashed}
.fb{border-radius:12px;padding:12px 14px;margin-top:12px;font-size:15px}
.fb.good{background:var(--good-soft);border:1.5px solid var(--good)} .fb.bad{background:var(--bad-soft);border:1.5px solid var(--bad)} .fb.hint{background:var(--gold-soft);border:1.5px solid var(--gold)}
.fb b{display:block;margin-bottom:2px}
.stars{display:flex;justify-content:center;gap:8px;margin:6px 0 10px} .stars svg{width:48px;height:48px}
.stars .on{fill:var(--gold);stroke:var(--gold)} .stars .off{fill:none;stroke:var(--line)}
.center{text-align:center}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.kpi{border:1.5px solid var(--line);border-radius:12px;padding:8px;text-align:center;min-width:0} .kpi span{display:block;font-size:12px;color:var(--muted)} .kpi b{font-size:20px;font-variant-numeric:tabular-nums}
.rows{display:grid;gap:6px;margin-top:10px} .rowline{display:flex;justify-content:space-between;gap:10px;font-size:14px;border-top:1px solid var(--line);padding-top:6px}
.scene{background:var(--coffee-soft);border:1.5px solid var(--coffee);border-radius:14px;padding:14px;margin-bottom:12px}
.picker{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin:8px 0 4px}
.step{width:48px;height:48px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:800 22px var(--font);cursor:pointer}
.big{text-align:center;font-size:36px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.big small{font-size:15px;font-weight:600;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--teal)}
.tbl-wrap{overflow-x:auto} table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap} th{font-size:12px;color:var(--muted);text-transform:uppercase} th:first-child,td:first-child{text-align:left}
tr.best td{font-weight:800;color:var(--good)}
svg.chart{width:100%;height:auto;display:block} svg.chart text{fill:var(--muted);font:600 11px var(--font)} svg.chart text.strong{fill:var(--ink);font-weight:800}
.timer{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:-4px 0 12px} .timer i{display:block;height:100%;background:var(--gold);transition:width 1s linear}
/* sheets */
.overlay{position:fixed;inset:0;z-index:10;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:18px;width:100%;max-width:528px;max-height:85vh;overflow:auto}
.who{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.who .face{font-size:32px;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--gold-soft);border:2px solid var(--gold);flex:0 0 auto}
.who b{display:block}
.frame{position:fixed;inset:0;z-index:9;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.frame .fbar{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px max(16px,env(safe-area-inset-left,0px));border-bottom:1.5px solid var(--line)}
.frame iframe{flex:1;border:0;width:100%;background:var(--bg)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 110px);transform:translateX(-50%);z-index:12;background:var(--ink);color:var(--bg);font-weight:700;border-radius:12px;padding:10px 16px;max-width:calc(100% - 32px);text-align:center;font-size:15px}
.loading{padding:40px 0;text-align:center}
.login{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.lg-card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:22px;width:100%;max-width:400px;display:grid;gap:8px}
.lg-card label{font-size:13px;font-weight:700;color:var(--muted);margin-top:6px}

.lg-card .btn{margin-top:8px}
/* Version 3: battle map */
.hexwrap{background:var(--ground-a);padding:4px}
svg.hexmap{display:block;width:100%;height:auto;max-width:520px;margin:0 auto}
svg.hexmap .hex{cursor:pointer} svg.hexmap .hex.locked{opacity:.45}

.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin:6px 2px 0;color:var(--muted)}
.tabs{display:flex;gap:6px;margin:4px 0 8px} .tabs button{flex:1;font:700 14px var(--font);border:1.5px solid var(--line);background:var(--card);color:var(--muted);border-radius:10px;padding:8px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.mini{padding:3px 9px;font-size:13px;border-width:1.5px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px} .form label{display:grid;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
.form select{font:600 15px var(--font);color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:8px}
.evbanner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--gold-soft);border:1.5px solid var(--gold);border-radius:12px;padding:8px 10px;margin:0 0 8px;font-size:14px;font-weight:600}
.evbanner .btn{flex:0 0 auto;padding:7px 12px;font-size:14px}
.rowline.me{font-weight:800;color:var(--good)}
td.who-cell{white-space:nowrap;line-height:1.25} .card td,.card th{padding:6px 4px} .arcard{padding:14px}
@media (max-width:370px){.arcard{padding:10px} .arcard td,.arcard th{padding:5px 2px} td.who-cell .nm{max-width:5.6em} .btn.mini{padding:3px 6px}} td.who-cell .nm{display:inline-block;max-width:8em;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom} .lv{font-size:11px;color:var(--gold);font-weight:800}

/* ===== Version 4.0 ===== */
.react{display:flex;gap:10px;align-items:center;margin-top:10px;padding:10px 12px;border-radius:12px;font-weight:700;font-size:15px;border:1.5px dashed var(--line)}

@keyframes rePop{0%{transform:scale(.2) rotate(-20deg)}100%{transform:none}} @keyframes reShake{0%,100%{transform:none}25%{transform:translateX(-6px) rotate(-8deg)}75%{transform:translateX(6px) rotate(8deg)}}
.bossbar{display:flex;align-items:center;gap:10px;margin:-4px 0 6px;position:relative}
.bossbar .bmeta{flex:1;min-width:0;font-size:13px;color:var(--muted)} .bossbar .bmeta b{display:block;color:var(--ink);font-size:15px}
.bossfig{flex:0 0 auto;overflow:visible} .bossfig .bf-sweat{opacity:0} .bossfig .bf-all{transform-origin:60px 112px}

@keyframes bfPunch{40%{transform:translate(-30px,6px) scale(1.5)}100%{transform:none}} @keyframes bfLunge{40%{transform:translateX(-8px) rotate(-5deg)}100%{transform:none}}
.bossfig.hurt .bf-all{animation:bfHurt .5s} .bossfig.hurt .bf-sweat{opacity:1} .bossfig.hurt .bf-mouth{d:path("M52 57 Q60 52 68 57")}
@keyframes bfHurt{0%,100%{transform:none}20%{transform:translateX(7px) rotate(4deg)}60%{transform:translateX(-5px) rotate(-3deg)}}
.xpf{position:absolute;right:4px;top:4px;font-weight:800;font-size:20px;animation:xpUp 1.3s ease-out forwards}
.xpf.up{color:var(--good)} .xpf.down{color:var(--bad);animation-name:xpDown}

function normalize(x){var f=fresh();if(!x||typeof x!=='object'||typeof x.pos!=='number'||x.pos>=N||x.pos<0)return f;
  Object.keys(f).forEach(function(k){if(x[k]===undefined||x[k]===null)x[k]=f[k];});if(!x.inv.hint)x.inv.hint=x.inv.hint||0;if(!x.inv.retry)x.inv.retry=x.inv.retry||0;if(!x.inv.again)x.inv.again=0;return x;}
try{S=normalize(JSON.parse(localStorage.getItem(KEY)||'null'));}catch(e){S=fresh();}
function localSave(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function persist(){S.updated=Date.now();localSave();cloudSoon();}
// attempt log: every finished play of a landmark, replays included (best never goes down)
function logAttempt(id,score,stars){var a=S.att[id]||{n:0,best:0,last:0,stars:0};a.n++;a.last=score;a.best=Math.max(a.best,score);a.stars=Math.max(a.stars,stars);S.att[id]=a;
  S.hist.unshift({id:id,s:score,st:stars,t:Date.now()});if(S.hist.length>60)S.hist.length=60;}
function cleared(id){return (S.best[id]||0)>=1;}
function rankIndex(){var r=-1;WORLDS.forEach(function(_,i){if(cleared((i+1)+'.★'))r=i;});return r;}
function cafeStars(){try{var c=JSON.parse(localStorage.getItem('arena-cafe')||'{}')||{};if(c.r1>=1&&c.r2>=1)return Math.min(c.r1,c.r2);}catch(e){}return 0;}

var cloud={mode:'local',db:null,user:null,uid:null,ref:null,owner:false,players:[],board:[],saving:false,again:false,timer:null,
  runtime:!!(window.claude&&typeof window.claude.use==='function')};
var asStudent=false;try{asStudent=localStorage.getItem('arena-as-student')==='1';}catch(e){}
// teacher tools: the artifact owner (or a local copy with no claude.ai runtime), unless previewing as a student
// a local copy with no runtime counts as the teacher's, except the public web release (ARENA_RELEASE)
function teacherAllowed(){return (cloud.owner||(!cloud.runtime&&!window.ARENA_RELEASE))&&!asStudent;}
function canPreview(){return cloud.owner||(!cloud.runtime&&!window.ARENA_RELEASE);}
function boardOpen(){return teacherAllowed()||!!(cloud.cfg&&cloud.cfg.showBoard);}
function summary(){var stars=0,cl=0;Object.keys(S.best).forEach(function(k){stars+=S.best[k];if(S.best[k]>=1)cl++;});return {stars:stars,cleared:cl};}
function cloudSoon(){if(cloud.mode!=='on')return;clearTimeout(cloud.timer);cloud.timer=setTimeout(cloudPush,1200);}
function cloudPush(){
  if(cloud.mode!=='on')return;if(cloud.saving){cloud.again=true;return;}cloud.saving=true;
  var sm=summary(),body={nt:topTitle(),xp:S.xp,cap:S.cap,stars:sm.stars,cleared:sm.cleared,pos:S.pos,rank:rankIndex(),updated:S.updated,hide:!!S.hide,teacher:cloud.owner,
    missed:S.review.slice(-60),state:JSON.parse(JSON.stringify(S))};
  if(SHEETS){sheetsPush(body);return;}
  cloud.ref.set(body).then(function(){return cloud.db.doc('board/'+cloud.uid).set({nt:body.nt,xp:body.xp,stars:body.stars,cleared:body.cleared,hide:body.hide,teacher:body.teacher,updated:body.updated});}).then(function(){cloud.saving=false;cloud.last=Date.now();hud();if(cloud.again){cloud.again=false;cloudPush();}},
    function(e){cloud.saving=false;if(e&&e.code==='invalid_argument'){cloud.mode='readonly';}else if(e&&e.code==='quota_exceeded'){cloud.mode='readonly';toast(L('Bộ nhớ lớp đã đầy. Tiến độ chỉ lưu trên máy này.','The class storage is full. Progress is saved on this device only.'));}
      else if(e&&e.code==='unavailable'){setTimeout(cloudPush,2500+Math.random()*2000);}hud();});
}
function initCloud(){
  if(!window.claude||typeof window.claude.use!=='function')return;
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    var db=r[0],user=r[1];cloud.user=user;if(!user){hud();return;}
    return Promise.all([user.isOwner(),user.id()]).then(function(v){
      cloud.owner=v[0];cloud.uid=v[1];if(!db||!cloud.uid){hud();panel();return;}
      cloud.db=db;cloud.ref=db.doc('players/'+cloud.uid);EVDB=db;arSubscribe(db);
      db.collection('players').onSnapshot(function(snap){cloud.players=snap.docs.map(function(d){var x=d.data()||{};return {id:d.id,nt:x.nt||0,xp:x.xp||0,stars:x.stars||0,cleared:x.cleared||0,pos:x.pos||0,rank:x.rank,updated:x.updated||0,hide:!!x.hide,teacher:!!x.teacher,test:!!x.test,label:typeof x.label==='string'?x.label:'',missed:x.missed||[],att:(x.state&&x.state.att)||{},fin:(x.state&&x.state.fin)||{},hist:(x.state&&x.state.hist)||[],best:(x.state&&x.state.best)||{},cst:(x.state&&x.state.cst)||{},clo:(x.state&&x.state.clo)||{}};});
        if(sheetMode==='board')renderBoard();if(P&&P.kind==='dash')renderDash();hud();},function(){});
      db.collection('board').onSnapshot(function(snap){cloud.board=snap.docs.map(function(d){var x=d.data()||{};return {id:d.id,nt:x.nt||0,xp:x.xp||0,stars:x.stars||0,cleared:x.cleared||0,hide:!!x.hide,teacher:!!x.teacher,test:!!x.test,label:typeof x.label==='string'?x.label:''};});
        if(sheetMode==='board')renderBoard();},function(){});
      try{db.doc('class/config').onSnapshot(function(snap){cloud.cfg=snap.exists?(snap.data()||{}):{};applyConfig();panel();if(sheetMode==='board')renderBoard();if(P&&P.kind==='dash')renderDash();},function(){});}catch(e){}
      return db.doc('class/config').get().then(function(c){cloud.cfg=c.exists?(c.data()||{}):{};applyConfig();return cloud.ref.get();}).then(function(mine){
        if(mine.exists){var d=mine.data();cloud.mode='on';
          if(d.state&&(d.state.updated||0)>(S.updated||0)){S=normalize(JSON.parse(JSON.stringify(d.state)));localSave();toast(L('Đã tải tiến độ của bạn từ lớp.','Loaded your progress from the class.'));}
          else cloudPush();
        }else{
          return db.collection('board').get().then(function(all){
            var seats=all.docs.filter(function(x){var b=x.data()||{};return !b.teacher&&!b.test;}).length;
            if(!cloud.owner&&seats>=SEATS){cloud.mode='full';toast(L('Lớp demo đã đủ '+SEATS+' chỗ. Bạn vẫn chơi được, tiến độ lưu trên máy này.','The demo class is full ('+SEATS+' seats). You can still play; progress stays on this device.'));}
            else{cloud.mode='on';cloudPush();}
          });
        }
      }).then(function(){renderMap();});
    });
  }).catch(function(){hud();});
}
// RESET: the owner writes class/config {epoch, resets:{uid:time}} and deletes the player docs.
// Every device compares it with its own save, so old local progress cannot come back.
function needsReset(){var c=cloud.cfg||{},mine=(c.resets||{})[cloud.uid]||0;return !cloud.owner&&((c.epoch||0)>(S.epoch||0)||mine>(S.resetSeen||0));}
function applyConfig(){if(!needsReset())return;if(P){cloud.pendingReset=true;return;}doReset();}
function doReset(){var c=cloud.cfg||{};S=fresh();S.epoch=c.epoch||0;S.resetSeen=(c.resets||{})[cloud.uid]||0;S.updated=Date.now();localSave();cloud.pendingReset=false;
  if(cloud.mode==='on')cloudPush();renderMap();follow(0);toast(L('Giáo viên đã đặt lại tiến độ. Bắt đầu lại từ xe đẩy cà phê!','Your teacher reset the progress. Back to the coffee cart!'));}
function writeConfig(patch){if(SHEETS)return api('setConfig',{patch:patch}).then(function(res){if(res.ok)cloud.cfg=res.cfg;});var cfg=Object.assign({},cloud.cfg||{},patch);cloud.cfg=cfg;return cloud.db.doc('class/config').set(cfg);}
function deleteSeq(ids){return ids.reduce(function(pr,id){return pr.then(function(){return cloud.db.doc('players/'+id).delete();}).then(function(){return cloud.db.doc('board/'+id).delete();});},Promise.resolve());}
function resetPlayer(uid){if(FAST)fastCall('cloReset',{id:uid}).then(function(){cloud.cloSrv=null;},function(){});if(SHEETS)return api('reset',{id:uid}).then(function(res){if(res.ok){cloud.cfg=res.cfg;toast(L('Đã đặt lại người chơi.','Player reset.'));}return sheetsDash();});var c=cloud.cfg||{},r=Object.assign({},c.resets||{});r[uid]=Date.now();
  return writeConfig({resets:r}).then(function(){return deleteSeq([uid]);}).then(function(){toast(L('Đã đặt lại người chơi.','Player reset.'));},function(){toast(L('Không đặt lại được. Thử lại sau.','Could not reset. Try again later.'));});}
function resetAll(){if(FAST)fastCall('cloReset',{all:true}).then(function(){cloud.cloSrv=null;},function(){});if(SHEETS)return api('reset',{all:true}).then(function(res){if(res.ok){cloud.cfg=res.cfg;toast(L('Đã đặt lại toàn bộ lớp.','The whole class was reset.'));}return sheetsDash();});var c=cloud.cfg||{},ids=cloud.players.concat(cloud.board).filter(function(p){return !p.teacher;}).map(function(p){return p.id;}).filter(function(id,i,a){return a.indexOf(id)===i;});
  return writeConfig({epoch:(c.epoch||0)+1,resets:{}}).then(function(){return deleteSeq(ids);}).then(function(){toast(L('Đã đặt lại toàn bộ lớp.','The whole class was reset.'));},function(){toast(L('Không đặt lại được. Thử lại sau.','Could not reset. Try again later.'));});}

function cloudPill(){
  if(cloud.mode==='on')return '☁ '+L('Đã lưu vào lớp','Saved to class');
  if(cloud.mode==='offline')return L('Mất kết nối · lưu trên máy','Offline · saved on device');
  if(cloud.mode==='full')return L('Lớp đủ chỗ · lưu trên máy','Class full · saved on device');
  if(cloud.mode==='readonly'||(cloud.user&&!cloud.db))return L('Chỉ xem · lưu trên máy','View only · saved on device');
  return L('Lưu trên máy này','Saved on this device');
}
function ago(t){if(!t)return '—';var m=Math.round((Date.now()-t)/60000);return m<1?L('vừa xong','just now'):m<60?m+L(' phút trước',' min ago'):m<1440?Math.round(m/60)+L(' giờ trước',' h ago'):Math.round(m/1440)+L(' ngày trước',' d ago');}
function names(ids,cb){if(SHEETS){var m={};ids.forEach(function(id){m[id]={name:cloud.nameMap[id]||''};});cb(m);return;}if(!cloud.user||!ids.length){cb({});return;}cloud.user.profiles(ids).then(cb,function(){cb({});});}

function fillNames(){var cells=[].slice.call(el('sheet').querySelectorAll('[data-name]')),ids=cells.map(function(c){return c.dataset.name;});
  names(ids,function(ps){cells.forEach(function(c){var id=c.dataset.name;if(id===cloud.uid&&!teacherAllowed()){c.textContent=L('Bạn','You');return;}

    c.textContent=c.dataset.hide==='1'?L('Ẩn danh','Anonymous'):((pl&&pl.label)||(ps[id]&&ps[id].name)||L('Học viên','Student'))+(pl&&pl.test?' · TEST':'');});});}
function exportCsv(){
  var list=cloud.players.filter(function(p){return !p.teacher;}),ids=list.map(function(p){return p.id;});
  names(ids,function(ps){
    var cols=['student','xp','stars','stops_cleared','current_stop','nghich_thien','chal_sent','chal_accepted','chal_won','chal_lost','chal_declined','team_cases','team_part_acc','clo1_pct','clo2_pct','clo3_pct','clo4_pct'].concat(NODES.map(function(n){return 'stars_'+n.id;})).concat(NODES.map(function(n){return 'tries_'+n.id;})),rows=[cols.join(',')];   // 4.3: tries per stop for tools/balance_report.py
    list.forEach(function(p){var r=[pname(p,ps)+(p.test?' (TEST)':''),p.xp,p.stars,p.cleared,NODES[p.pos]?NODES[p.pos].id:'',p.nt?titleName(p.nt):''].concat((function(c){c=c||{};return [c.sent||0,c.acc||0,c.won||0,c.lost||0,c.dec||0,c.team||0,c.tpn?Math.round(100*(c.tpr||0)/c.tpn)+'%':''];})(p.cst)).concat((function(o){return CLOS.map(function(c){return o[c.k][0]?cloPct(o[c.k])+'%':'';});})(cloOf(p)));
      NODES.forEach(function(n){r.push(p.att[n.id]?p.att[n.id].stars:0);});
      NODES.forEach(function(n){r.push(p.att[n.id]?p.att[n.id].n:0);});
      rows.push(r.map(function(v){v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(','));});
    saveFile('economics-arena-class.csv','\ufeff'+rows.join('\n'));

/* ================= BANK HELPERS ================= */
/* ================= QUESTION SOURCE =================
   Local: bank.js + bankcore.js in the page (claude.ai build); answer keys kept in this closure.
   Remote: the web release — no bank in the page; the Google server picks questions and checks answers.
   Fast (Release 2): config.js also sets window.ARENA_FAST to a Cloudflare Worker that picks and checks in ~0.2 s.
   The Worker returns each answer key sealed (unreadable here); this closure keeps the sealed keys per play. */
var FAST=SHEETS?String(window.ARENA_FAST||'').trim():'';
function fastCall(action,data,again){
  return fetch(FAST,{method:'POST',body:JSON.stringify(Object.assign({action:action,wt:sess&&sess.wt},data||{}))}).then(function(r){return r.json();}).then(function(res){
    // pass expired or position out of date (a save still in flight) → fetch a fresh pass from the Sheet once, then retry
    if(!again&&sess&&(res.error==='wauth'||res.error==='locked'))return api('hello').then(function(h){
      if(h.ok&&h.wt){takeWt(h);return fastCall(action,data,true);}return h.error==='auth'?{ok:false,error:'auth'}:res;},function(){return res;});
    if(res.error==='wauth')res.error='auth';return res;});
}
var Bank=(function(){
  if(window.ARENA_BANK&&window.BankCore&&!SHEETS){
    var keys={},seq=0,items=window.ARENA_BANK.items;
    var put=function(k){var id='p'+(++seq);keys[id]=k;return id;};
    var done=function(x){return Promise.resolve(x.error?{ok:false,error:x.error}:Object.assign({ok:true},x));};
    var byId={};items.forEach(function(q){byId[q.id]=q;});
    if(window.__ARENA_TEST)window.__ARENA_TEST.caseKey=function(play){return keys[play];};   // tests answer cases from the local key
    return {local:true,
      stage:function(node){var s=BankCore.stage(items,[],node);return done({play:put(s.key),tasks:s.pub});},
      submit:function(play,ans,mode){return done(keys[play]?BankCore.submit(keys[play],ans,mode):{error:'expired'});},
      hint:function(play,i){return done(keys[play]&&keys[play][i]?BankCore.hint(keys[play][i],2):{error:'expired'});},
      boss:function(node){var s=BankCore.boss(items,node);return done({play:put(s.key),qs:s.pub});},
      npc:function(o){var s=BankCore.npc(items,o);return done({play:put(s.key),q:s.pub});},
      duel:function(maxCh){var s=BankCore.duel(items,{maxCh:maxCh,n:5});return done({play:put(s.key),qs:s.pub});},
      case:function(cid,team){if(!window.CaseCore)return done({error:'no_cases'});var seed='L'+Math.random(),s=CaseCore.make(cid,seed);s.key.used=[];if(team)s.key.team={lead:cloud.uid,roles:team.roles};return done({play:put(s.key),pub:s.pub,share:seed});},
      caseJoin:function(share,cid,team){if(!window.CaseCore)return done({error:'no_cases'});var s=CaseCore.make(cid,share);s.key.used=[];s.key.team=team;return done({play:put(s.key),pub:s.pub});},
      caseSubmit:function(play,ans){var k=keys[play];if(!k||!k.parts)return done({error:'expired'});var own={r:0,n:0},team={r:0,n:0},pr={},t=[];
        Object.keys(ans||{}).forEach(function(x){var i=+x;if(!(i>=0&&i<k.parts.length)||k.used.indexOf(i)>=0)return;
          if(k.team){var ro=k.parts[i].role;if(ro==='team'?k.team.lead!==cloud.uid:(k.team.roles[ro]||[]).indexOf(cloud.uid)<0)return;}
          k.used.push(i);var rt=!!CaseCore.grade(k,i,ans[x]).right,b=k.parts[i].role==='team'?team:own;b.n++;if(rt)b.r++;pr[i]=rt?1:0;if(CaseCore.tally)t=t.concat(CaseCore.tally(k,i,rt)||[]);});
        if(!Object.keys(pr).length)return done({error:'done'});
        return done({right:own.r+team.r,n:own.n+team.n,own:own,team:team,pr:pr,t:t.reduce(function(m,x){var o=m.filter(function(y){return y[0]===x[0];})[0];if(o){o[1]+=x[1];o[2]+=x[2];}else m.push(x.slice());return m;},[])});},

      caseSol:function(share,cid){if(!window.CaseCore)return done({error:'no_cases'});var s=CaseCore.make(cid,share);return done({cid:cid,title:s.pub.title,story:s.pub.story,parts:s.pub.parts.map(function(q){return q.q;}),sol:CaseCore.solution(cid,share)});},
      npcHint:function(play){return done(keys[play]?BankCore.hint(keys[play],1):{error:'expired'});},
      npcCheck:function(play,ans,ex){return done(keys[play]?BankCore.single(keys[play],ans,ex):{error:'expired'});},
      // 4.8 claude.ai test copy: the Final bank is finalbank.js; one attempt per opening is kept in this player's progress
      finStart:function(t){var F=window.ARENA_FINAL||{mc:[],ex:[]},it=t==='F1'?F.mc:F.ex,rd=finRound(t);if(!it||!it.length)return done({error:'no_final'});
        if(!teacherAllowed()){if(!rd)return done({error:'locked'});var me=finMine(t);if(me&&me.rd===rd)return done({error:'done',right:me.right,n:me.n,score:me.score});}
        var s=t==='F1'?BankCore.final1(it):BankCore.final2(it),now=Date.now();return done({pub:s.pub,play:put(s.key),t0:now,sec:BankCore.FIN[t].sec,now:now,rd:rd});},
      finSubmit:function(t,play,ans){if(!keys[play])return done({error:'expired'});var r=BankCore.submit(keys[play],ans,'check');if(!r.error)r.score=BankCore.score10(r.right,r.n);return done(r);},
      info:function(){return {n:items.length,news:items.filter(function(q){return q.src==='v1_new';}).length};},
      text:function(id){return byId[id]||null;}};
  }
  if(FAST){
    var fk={},fseq=0,fput=function(ks){var id='f'+(++fseq);fk[id]=ks;return id;};
    var start=function(action,data,one){return fastCall(action,data).then(function(res){if(res.ok){res.play=fput(one?[res.key]:res.keys);delete res.keys;delete res.key;}return res;});};
    var use=function(play,i,action,data){var ks=fk[play];if(!ks||!ks[i])return Promise.resolve({ok:false,error:'expired'});
      return fastCall(action,Object.assign({key:ks[i]},data)).then(function(res){if(res.key){ks[i]=res.key;delete res.key;}return res;});};
    return {local:false,fast:true,
      stage:function(node){return start('stage',{node:node});},
      submit:function(play,ans,mode){return fk[play]?fastCall('submit',{keys:fk[play],answers:ans,mode:mode}):api('submit',{play:play,answers:ans,mode:mode});},   // not ours = a duel the Sheet dealt
      hint:function(play,i){return use(play,i,'hint',{});},
      boss:function(node){return start('boss',{node:node});},
      npc:function(o){return start('npc',o,true);},
      // a Worker still on Release 2 has no duel → ask the Sheet instead
      duel:function(maxCh){return start('duel',{maxCh:maxCh}).then(function(res){return res.error==='bad_request'?api('duel',{maxCh:maxCh}):res;});},
      case:function(cid,team){return start('case',{cid:cid,team:team||null},true).then(function(res){if(res.error==='bad_request'&&!team)res.error='no_cases';if(res.ok)res.share=fk[res.play][0];return res;});},   // a Worker before 4.1 has no cases
      caseJoin:function(share){return Promise.resolve({ok:true,play:fput([share])});},
      caseSol:function(share){return fastCall('caseSol',{key:share});},
      caseSubmit:function(play,ans){return use(play,0,'caseSubmit',{answers:ans});},
      caseDebrief:function(since){return fastCall('caseDebrief',{since:since});},
      npcHint:function(play){return use(play,0,'npcHint',{});},
      npcCheck:function(play,ans,ex){return use(play,0,'npcCheck',{answer:ans,extra:!!ex});},
      // 4.8: the Final gate on the Worker (D1 keeps one attempt per opening); a Worker without D1 or before 4.8 → the Sheet does it
      finStart:function(t){return fastCall('finStart',{test:t}).then(function(res){
        if(res.error==='no_db'||res.error==='bad_request')return api('finStart',{test:t}).then(function(r2){r2.via='sheet';return r2;});
        if(res.ok){res.via='fast';if(res.keys){res.play=fput(res.keys);delete res.keys;}}return res;});},
      finSubmit:function(t,play,ans,rd,via){if(via==='sheet')return api('finSubmit',{test:t,play:play,answers:ans,rd:rd});
        return fastCall('finSubmit',{test:t,rd:rd,answers:ans,keys:play&&fk[play]?fk[play]:undefined});},
      info:function(){return cloud.bankInfo||null;},
      text:function(id){return (cloud.missedText||{})[id]||null;}};
  }
  if(SHEETS)return {local:false,
    stage:function(node){return api('stage',{node:node});},
    submit:function(play,ans,mode){return api('submit',{play:play,answers:ans,mode:mode});},
    hint:function(play,i){return api('hint',{play:play,task:i});},
    boss:function(node){return api('boss',{node:node});},
    npc:function(o){return api('npc',o);},
    duel:function(maxCh){return api('duel',{maxCh:maxCh});},
    case:function(){return Promise.resolve({ok:false,error:'no_cases'});},caseSubmit:function(){return Promise.resolve({ok:false,error:'no_cases'});},caseDebrief:function(){return Promise.resolve({ok:false,error:'no_cases'});},caseJoin:function(){return Promise.resolve({ok:false,error:'no_cases'});},caseSol:function(){return Promise.resolve({ok:false,error:'no_cases'});},
    npcHint:function(play){return api('npcHint',{play:play});},
    npcCheck:function(play,ans,ex){return api('npcCheck',{play:play,answer:ans,extra:!!ex});},
    finStart:function(t){return api('finStart',{test:t});},
    finSubmit:function(t,play,ans,rd){return api('finSubmit',{test:t,play:play,answers:ans,rd:rd});},
    info:function(){return cloud.bankInfo||null;},
    text:function(id){return (cloud.missedText||{})[id]||null;}};
  return null;
})();
function bankError(res){
  var e=res&&res.error;
  if(e==='no_final')return L('Giáo viên chưa nhập ngân hàng Final.','Your teacher has not imported the Final bank yet.');
  if(e==='done')return L('Bài này đã nộp.','This paper was already handed in.');

  return e==='locked'?L('Mốc này chưa mở cho bạn.','This stop is not open for you yet.'):e==='rate'?L('Bạn đã chơi rất nhiều trong giờ này. Nghỉ một chút rồi quay lại nhé.','You have played a lot this hour. Take a short break and come back.')
    :e==='no_bank'?L('Giáo viên chưa nhập ngân hàng câu hỏi vào Google Sheet.','Your teacher has not imported the question bank into the Google Sheet yet.')
    :e==='expired'?L('Lượt chơi đã hết hạn. Hãy chơi lại.','This play has expired. Please start again.'):e==='auth'?L('Phiên đăng nhập đã hết. Đăng nhập lại.','Your session ended. Please sign in again.')
    :L('Không kết nối được máy chủ. Kiểm tra mạng và thử lại.','Cannot reach the server. Check your connection and try again.');
}

  var hcmAt={};
  // a tall landmark needs the next stop's building on the other side; a low one (≤ 70) fits either way
  WORLDS.forEach(function(_,w){var c=[],keys=HCM_BY_CH[w].slice(),used=[];for(var i=w*6;i<w*6+5;i++){var os=-sideOf(i,W),e=roadEdge(i-0.3,i+0.4,os)+os*gap(i),rm=os>0?W-4-e:e-4;c.push({i:i,rm:rm,e:e,os:os,sw:sideOf(i+1,W)!==sideOf(i,W)});}
    c.sort(function(a,b){return (a.sw-b.sw)||(b.rm-a.rm);});
    c.forEach(function(x){if(x.rm<44||used.some(function(u){return Math.abs(u-x.i)<2;}))return;
      var fit=keys.filter(function(k){return !x.sw||HCM[k].h<=70;}).sort(function(a,b){return HCM[b].h-HCM[a].h;}).map(function(k){   // free space over the landmark's whole height
        var e=roadEdge(x.i-0.3,x.i+0.1+HCM[k].h/GAP,x.os)+x.os*gap(x.i),rm=x.os>0?W-4-e:e-4;return {k:k,e:e,rm:rm};}).filter(function(f){return f.rm>=34;})[0];
      if(!fit)return;keys.splice(keys.indexOf(fit.k),1);used.push(x.i);hcmAt[x.i]={k:fit.k,e:fit.e,os:x.os,rm:fit.rm};});});
  NODES.forEach(function(nd,i){

    var h=hcmAt[i];
    if(h){var H=HCM[h.k],hs=Math.min(1,(h.rm-4)/H.w),hx=h.e+h.os*(Math.max(H.w*hs/2,Math.min(h.rm/2,H.w*hs/2+10)));
      var nm=tx(H.n),half=(nm.length>14?Math.ceil(nm.length/2)+1:nm.length)*2.35,cl=Math.min(Math.max(hx,half+3),W-3-half);if(Math.abs(cl-h.e)>=H.w*hs/2)hx=cl;   // keep the label on screen
      s+='<g class="hcm" data-mg="'+h.k+'" role="button" tabindex="0" aria-label="'+esc(tx(H.n)+' · '+(MG[h.k]?tx(MG[h.k].n):''))+'" transform="translate('+hx.toFixed(1)+' '+(cy(i)+6).toFixed(1)+')"><title>'+esc(tx(H.n))+'</title><g transform="scale('+hs.toFixed(2)+')">'+H.d()+seal(H.w/2-6,-9)+'</g>'+hcmLabel(H.n,11)+'</g>';

    if(oroom>26)s+=filler(nd.w,oe+os*Math.min(oroom-14,16+rng(i*5)*Math.max(0,oroom-34)),cy(i)+6,i*13+1);

      if(rm>30)s+=filler(nd.w,e+sd*Math.min(rm-16,14+rng(i*7+sd)*Math.max(0,rm-34)),cy(t)+8,i*17+sd+3);}
  });
  // soft mist drifting across each chapter

  return s;

function spawnAhead(){
  var w=worldNow(),lanes=WORLDS[w].lanes,max=lanes+1+(has('sign')?1:0),p=0.35+0.04*w+(has('sign')?0.15:0);
  for(var k=0;k<lanes+(has('sign')?1:0);k++){
    if(S.npcs.length>=max)break;if(Math.random()>p)continue;
    var type,r=Math.random();
    if(S.review.length&&r<0.35)type='professor';
    else if(w>=NPC.investor.from&&r>=0.94)type='investor';
    else{var ts=Object.keys(NPC).filter(function(k){return NPC[k].from<=w&&!NPC[k].rare;});type=ts[Math.floor(Math.random()*ts.length)];}
    var t=Math.min(N-1,S.pos+0.2+Math.random()*1.8),Ln=lanesAt(t),rw=roadW(Ln),lane=Math.floor(Math.random()*Ln),dx=-rw/2+rw*(lane+0.5)/Ln;
    if(Ln===1)dx=(Math.random()<0.5?-1:1)*(rw/2+16);
    S.npcs.push({id:S.nid++,type:type,t:t,dx:dx});
  }
}

var walking=false;
function walk(){
  if(walking||S.pos>=N-1||!cleared(NODES[S.pos].id))return;walking=true;
  var from=S.pos,to=S.pos+1,start=null,dur=matchMedia('(prefers-reduced-motion: reduce)').matches?1:900,av=el('avatar');av.classList.add('walking');
  function step(ts){if(start===null)start=ts;var k=Math.min(1,(ts-start)/dur),t=from+(to-from)*(k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2);
    av.setAttribute('transform','translate('+cx(t).toFixed(1)+' '+(cy(t)-AVY).toFixed(1)+')');follow(t);
    if(k<1)requestAnimationFrame(step);else{S.pos=to;walking=false;S.npcs=S.npcs.filter(function(n){return n.t>=S.pos-0.5;});spawnAhead();persist();renderMap();}}
  requestAnimationFrame(step);
}

/* ---------- boss: every question answered, then handed in once; wrong answers ≥ lives = the deal falls through ---------- */
var timerH=null;
function stopTimer(){if(timerH){clearInterval(timerH);timerH=null;}}
function startBoss(node,useTicket){
  var lives=2;if(useTicket&&S.inv.retry>0){S.inv.retry--;lives=3;persist();}   // v3.1: the boss gives 2 lives (ticket: 3); 4.3: a life = one wrong answer allowed − 1
  P={node:node,kind:'boss',qs:null,i:0,lives:lives,right:0,xp:0,ans:[],busy:false,confirm:false,err:''};
  openPlay();playLoading(node.id+' · '+tx(node.name));
  var me=P;Bank.boss(node.id).then(function(res){if(P!==me)return;if(!res.ok){playFail(res);return;}if(!res.qs||!res.qs.length){playFail({ok:false,error:'no_bank'});return;}P.play=res.play;P.qs=res.qs;P.ans=P.qs.map(function(){return null;});
    P.total=bossSec()*P.qs.length;P.left=P.total;stopTimer();
    timerH=setInterval(function(){if(!P||P.kind!=='boss'||P.res){stopTimer();return;}P.left--;var bar=el('tbar'),c=el('tclock');if(bar)bar.style.width=Math.max(0,P.left/P.total*100)+'%';if(c)c.textContent=mmss(P.left*1000);
      if(P.left<=0&&!P.busy){stopTimer();bossSubmit(true);}},1000);renderBoss();},function(){if(P===me)playFail(netFail());});
}
function renderBoss(){
  var q=P.qs[P.i],h='';

  h+='<div class="bossbar">'+bossFig('idle')+'<div class="bmeta"><b>'+L('Trùm Chương ','Chapter boss ')+(P.node.w+1)+'</b>'+L('Đúng +'+BAL.bossRight+' XP · Sai −'+BAL.bossWrong+' XP · '+P.lives+' mạng: sai từ '+P.lives+' câu là thua','Right +'+BAL.bossRight+' XP · Wrong −'+BAL.bossWrong+' XP · '+P.lives+' lives: '+P.lives+' wrong answers lose')+'</div></div>';
  h+=qsDots(P.qs.length,P.ans,P.i,'bsgo');

  h+='<div class="card"><span class="tag">'+L('Câu ','Question ')+(P.i+1)+'/'+P.qs.length+' · '+L('Chương ','Chapter ')+q.ch+'</span>'+viBadge()+'<h3 class="q">'+esc(q.q)+'</h3>';
  q.opts.forEach(function(o,i){h+='<button class="opt'+(P.ans[P.i]===i?' sel':'')+'" data-act="bossans" data-i="'+i+'"'+(P.busy?' disabled':'')+'>'+esc(o)+'</button>';});

}
function bossGo(i){if(!P||P.kind!=='boss'||P.busy||P.res||!P.qs||i<0||i>=P.qs.length)return;P.i=i;P.confirm=false;renderBoss();el('play').scrollTop=0;}
function bossSubmit(force){
  if(!P||P.kind!=='boss'||P.busy||P.res||!P.qs)return;if(qsLeft(P.ans)&&!P.confirm&&!force){P.confirm=true;renderBoss();return;}
  P.busy=true;P.err='';renderBoss();var me=P;
  Bank.submit(P.play,qsAns(P.ans),'single').then(function(res){if(P!==me)return;P.busy=false;
    if(!res.ok){P.err=bankError(res);P.confirm=false;renderBoss();return;}
    stopTimer();P.right=res.right;P.wrong=res.n-res.right;P.xp=P.right*BAL.bossRight-P.wrong*BAL.bossWrong;bossResult();
  },function(){if(P!==me)return;P.busy=false;P.confirm=false;P.err=bankError(netFail());renderBoss();});
}
function bossResult(){
  stopTimer();var pct=Math.round(P.right/P.qs.length*100),won=P.wrong<P.lives&&pct>=60,st=won?starsPct(pct):0;
  if(won)P.xp+=100;S.xp=Math.max(0,S.xp+P.xp);P.res={pct:pct,won:won,st:st,first:award(P.node,st,500,pct)};renderBossResult();showMeme(won);
}

/* ---------- decision missions ---------- */
function startMission(node){
  var m=MISSIONS[node.id];
  if(m.kind==='cafe'){openCafe();return;}
  if(m.kind==='rounds'){P={node:node,kind:'rounds',m:m,hist:[],xp:0};openPlay();renderRounds();return;}
  P={node:node,kind:'decide',m:m,x:m.start,tries:[],xp:0,done:false,best:bestOf(m)};openPlay();renderDecide();
}
function decideChart(m,tries,showBest){
  var W=320,Hh=180,x0=46,y0=150,top=28,vals=[],b=P.best;
  for(var x=m.min;x<=m.max;x++)vals.push(m.f(x));
  var lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals);if(m.lower)hi=Math.min(hi,b.v*2.2);lo=Math.min(lo,0);if(hi===lo)hi=lo+1;
  var X=function(x){return x0+(x-m.min)/(m.max-m.min)*(W-x0-10);},Y=function(v){return y0-(Math.max(lo,Math.min(hi,v))-lo)/(hi-lo)*(y0-top);};
  var s='<svg class="chart" viewBox="0 0 '+W+' '+(Hh+10)+'" role="img" aria-label="'+tx(m.vlabel)+'">';
  [lo,(lo+hi)/2,hi].forEach(function(v){s+='<line x1="'+x0+'" x2="'+(W-10)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)"/><text x="'+(x0-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+fmt(v)+'</text>';});
  if(lo<0)s+='<line x1="'+x0+'" x2="'+(W-10)+'" y1="'+Y(0)+'" y2="'+Y(0)+'" stroke="var(--muted)" stroke-dasharray="3 3"/>';
  [m.min,Math.round((m.min+m.max)/2),m.max].forEach(function(x){s+='<text x="'+X(x)+'" y="'+(y0+16)+'" text-anchor="middle">'+x+'</text>';});
  s+='<text x="'+(W-10)+'" y="'+(y0+32)+'" text-anchor="end">'+esc(tx(m.label))+'</text>';
  if(showBest){var d='';for(var x2=m.min;x2<=m.max;x2++)d+=(x2===m.min?'M':'L')+X(x2).toFixed(1)+' '+Y(m.f(x2)).toFixed(1);s+='<path d="'+d+'" fill="none" stroke="var(--teal)" stroke-width="2.5"/>';
    s+='<circle cx="'+X(b.x)+'" cy="'+Y(b.v)+'" r="6" fill="var(--teal)"/><text x="'+X(b.x)+'" y="'+(Y(b.v)-10)+'" text-anchor="middle" class="strong">'+L('Tốt nhất','Best')+' '+b.x+'</text>';}
  tries.forEach(function(tr,i){s+='<circle cx="'+X(tr.x)+'" cy="'+Y(tr.v)+'" r="6" fill="var(--coffee)" stroke="var(--card)" stroke-width="2"/><text x="'+X(tr.x)+'" y="'+(Y(tr.v)+20)+'" text-anchor="middle">'+(i+1)+'</text>';});
  return s+'</svg>';
}
function renderDecide(){
  var m=P.m,h='',x=P.x;el('play-title').innerHTML=esc(P.node.id+' · '+tx(m.name));playHud();
  h+='<div class="card"><span class="tag">'+L('Nhiệm vụ nhập vai','Role-play mission')+'</span><div class="scene">'+tx(m.story)+'</div>';

  }
  h+='</div>';
  if(P.tries.length){h+='<div class="card">'+decideChart(m,P.tries,P.done&&starsRatio(P.ratio)>=3)+'<div class="tbl-wrap"><table><thead><tr><th>#</th><th>'+esc(tx(m.label))+'</th>'+m.rows(P.tries[0].x).map(function(r){return '<th>'+esc(r[0])+'</th>';}).join('')+'<th>'+esc(tx(m.vlabel))+'</th></tr></thead><tbody>';
    var bt=P.tries.reduce(function(a,t){return a===null||(m.lower?t.v<a.v:t.v>a.v)?t:a;},null);

}
function dTry(){var m=P.m;P.tries.push({x:P.x,v:m.f(P.x)});if(P.tries.length>=4)dFinish();else renderDecide();}
function dFinish(){var m=P.m,b=P.best;P.bestTry=P.tries.reduce(function(a,t){return a===null||(m.lower?t.v<a.v:t.v>a.v)?t:a;},null);

/* ---------- website: live-event documents in the Worker's D1 store (same calls as the claude.ai db) ----------
   One poll carries every subscribed document with the version this page has; the Worker returns only what changed.
   Poll every 2 s while hosting, 4 s in the arena during an event, 8 s on the road during an event, 10 s otherwise (4.3). */
function WebEv(){
  var subs={},ver={},msubs=[],mver=0,csubs=[],cver=0,mcache={},ccache={},timer=null,stopped=false,busy=false,again=false;
  function merge(cache,res){if(res.full!==false)Object.keys(cache).forEach(function(k){delete cache[k];});res.docs.forEach(function(d){cache[d.id]=d.body;});   // 4.3: the Worker sends only changed docs
    return Object.keys(cache).map(function(id){var b=cache[id];return {id:id,data:function(){return b;}};});}
  function soon(ms){if(stopped)return;if(busy){again=true;return;}clearTimeout(timer);timer=setTimeout(poll,ms);}
  function snap(body){return {exists:body!==null&&body!==undefined,data:function(){return body;}};}
  function delay(){var live=arClassLive();return !live?10000:arHosting()?1500:(P&&P.kind==='arena')?2500:6000;}   // 4.2 timings; class of 25 = 38% of Workers free requests (tools/loadtest.mjs)
  function poll(){
    if(stopped||busy)return;busy=true;clearTimeout(timer);
    var want={};Object.keys(subs).forEach(function(p){want[p]=ver[p]||0;});
    var req={docs:want};if(msubs.length)req.moves=mver;if(csubs.length)req.chal=cver;
    fastCall('evpoll',req).then(function(res){
      if(!res||!res.ok){if(res&&(res.error==='no_db'||res.error==='bad_request')){EVDB=null;stopped=true;if(P&&P.kind==='arena')renderArena();}return;}
      if(!EVDB){EVDB=api0;if(P&&P.kind==='arena')renderArena();panel();}
      Object.keys(res.docs||{}).forEach(function(p){var d=res.docs[p];ver[p]=d.t;(subs[p]||[]).forEach(function(fn){fn(snap(d.body));});});
      if(res.chal){cver=res.chal.t;var cd=merge(ccache,res.chal);csubs.forEach(function(fn){fn({docs:cd});});}
      if(res.moves){mver=res.moves.t;var docs=merge(mcache,res.moves);msubs.forEach(function(fn){fn({docs:docs});});}
    },function(){}).then(function(){busy=false;if(!stopped)timer=setTimeout(poll,again?300:delay());again=false;});
  }
  var api0={
    doc:function(path){return {
      set:function(body){return fastCall('evset',{path:path,body:body}).then(function(res){if(!res||!res.ok)throw new Error(res&&res.error||'evset');soon(300);});},
      onSnapshot:function(fn){(subs[path]=subs[path]||[]).push(fn);soon(50);}};},
    collection:function(name){return {onSnapshot:function(fn){(name==='chal'?csubs:msubs).push(fn);soon(50);}};},
    stop:function(){stopped=true;clearTimeout(timer);}
  };
  return api0;
}

function startTrial(ch){if(S.trial[ch]||!trialOpen(ch)||walking)return;closeSheet();

  var me=P;Bank.duel(ch).then(function(res){if(P!==me)return;if(!res.ok){playFail(res);return;}
    S.trial[ch]='fail';persist();          // one chance: once the questions are dealt, leaving counts as a lost attempt
    P.play=res.play;P.qs=res.qs.slice(0,TRIAL_N);P.ans=P.qs.map(function(){return null;});P.ord=P.qs.map(function(q){return q.opts.map(function(_,i){return i;});});P.swapped=false;
    P.total=((ARTEST&&ARTEST.trialSec)||TRIAL_SEC)*P.qs.length;P.left=P.total;stopTimer();
    timerH=setInterval(function(){if(!P||P.kind!=='trial'||P.res){stopTimer();return;}P.left--;var bar=el('tbar');if(bar)bar.style.width=Math.max(0,P.left/P.total*100)+'%';

      if(P.left<=0&&!P.busy){stopTimer();trialSubmit(true);}},1000);renderTrial();},function(){if(P===me)playFail(netFail());});

  P.ord[P.i].forEach(function(i){h+='<button class="opt'+(P.ans[P.i]===i?' sel':'')+'" data-act="trialans" data-i="'+i+'"'+(P.busy?' disabled':'')+'>'+esc(q.opts[i])+'</button>';});

    if(!opts.length){st.pop();continue;}var d=pickOf(opts),r2=cur[0]+d[1],c2=cur[1]+d[2];W[cur[0]][cur[1]][d[0]]=0;W[r2][c2][d[3]]=0;seen[r2][c2]=true;st.push([r2,c2]);}

var CH_INV=30000,CH_ON=45000,CH_GAME=BAL.chSec*1000,CH_REST=60000,CH_DEC=BAL.chDeclines,CH_PAIR=BAL.chPair;

  m.out={id:cloud.uid+'-'+Date.now(),to:tgt,cid:cs.id,t:Date.now()};m.sent=(m.sent||0)+1;S.cst=S.cst||{};S.cst.sent=(S.cst.sent||0)+1;persist();chSend();

  if(ok){m.reply={id:v.id,from:v.from,ok:true,t:Date.now()};S.cst.acc=(S.cst.acc||0)+1;persist();chSend();chStart(v.id,v.from,v.cid);return;}
  if((m.dec||0)>=CH_DEC){m.fft=(m.fft||[]).concat([{id:v.id,to:v.from}]);m.reply={id:v.id,from:v.from,ok:false,fft:true,t:Date.now()};S.cst.lost=(S.cst.lost||0)+1;toast(L('Từ chối lần 3: tính là thua.','Third refusal: counted as a loss.'));}

// called on every chal snapshot and every second while an event is live
function chScan(){if(!chOn())return;var m=chMy(),now=Date.now(),me=cloud.uid,changed=false;
  // an invite to me
  if(!AR.inv&&!AR.cg&&!m.out){chOnline().forEach(function(id){var d=chDoc(id);if(AR.inv||!d.out||d.out.to!==me||now-d.out.t>=CH_INV)return;
    if(m.reply&&m.reply.id===d.out.id)return;AR.inv={id:d.out.id,from:id,cid:d.out.cid,t:d.out.t};changed=true;});}
  if(AR.inv&&(now-AR.inv.t>=CH_INV||!chDoc(AR.inv.from)||!chDoc(AR.inv.from).out||chDoc(AR.inv.from).out.id!==AR.inv.id)){AR.inv=null;changed=true;}
  // my invite answered?
  if(m.out){var t=chDoc(m.out.to),r=t&&t.reply;
    if(r&&r.id===m.out.id){var o=m.out;m.out=null;chSend();
      if(r.ok)chStart(o.id,o.to,o.cid);else{toast(chName(o.to)+(r.fft?L(' từ chối lần 3: bạn thắng!',' refused a third time: you win!'):L(' đã từ chối.',' declined.')));if(r.fft){S.cst=S.cst||{};S.cst.won=(S.cst.won||0)+1;S.xp+=BAL.chWinXP;persist();hud();}}
      changed=true;}
    else if(now-m.out.t>=CH_INV){toast(chName(m.out.to)+L(' không trả lời.',' did not answer.'));m.out=null;chSend();changed=true;}}
  // result of my game
  if(AR.cg&&AR.cg.done&&!AR.cg.out){var od=chDoc(AR.cg.opp),orr=od&&(od.res||[]).filter(function(x){return x.id===AR.cg.id;})[0];
    if(orr){var g=AR.cg,win=g.pct!==orr.pct?g.pct>orr.pct:g.ms!==orr.ms?g.ms<orr.ms:null;g.out=win===null?'draw':win?'win':'lose';g.opct=orr.pct;g.oms=orr.ms;
      S.chx=S.chx||{};if(!S.chx[g.id]){S.chx[g.id]=1;S.cst=S.cst||{};if(win)S.cst.won=(S.cst.won||0)+1;else if(win===false)S.cst.lost=(S.cst.lost||0)+1;S.xp+=win?BAL.chWinXP:BAL.chPlayXP;persist();hud();}changed=true;}}
  if(changed&&P&&P.kind==='arena')renderArena();if(changed&&!P)panel();
  tmScan();
}
function chStart(id,opp,cid){var m=chMy();AR.inv=null;
  AR.cg={id:id,opp:opp,cid:cid,pub:null,play:null,ans:{},busy:false,done:false,t0:0,draft:{},confirm:false};m.play={id:id,opp:opp,until:Date.now()+CH_GAME+15000};chSend();
  if(!(P&&P.kind==='arena'))openArena();AR.tab='chal';renderArena();var g=AR.cg;
  Bank.case(cid).then(function(res){if(AR.cg!==g)return;if(!res.ok){g.err=bankError(res);renderArena();return;}g.pub=res.pub;g.play=res.play;g.share=res.share;g.t0=Date.now();g.lim=(ARTEST&&ARTEST.chSec?ARTEST.chSec*1000:CH_GAME);renderArena();},
    function(){if(AR.cg===g){g.err=bankError(netFail());renderArena();}});}
function caseCollect(g,mine){[].slice.call(document.querySelectorAll('#play-body input.cin')).forEach(function(inp){g.draft[inp.dataset.i]=inp.value;});
  var out={};g.pub.parts.forEach(function(q,i){if(mine&&!mine(i))return;if(q.type==='num'){var v=String(g.draft[i]||'').trim();if(v)out[i]=v;}else if(g.ans[i]!==undefined)out[i]=g.ans[i];});return out;}
function chSubmit(force){var g=AR.cg;if(!g||g.done||g.busy||!g.pub)return;var a=caseCollect(g),n=g.pub.parts.length,k=Object.keys(a).length;
  if(k<n&&!g.confirm&&!force){g.confirm=true;renderArena();return;}
  if(!k){g.right=0;chFinish();return;}
  g.busy=true;g.err='';renderArena();
  Bank.caseSubmit(g.play,a).then(function(res){if(AR.cg!==g)return;g.busy=false;if(!res.ok){if(res.error==='done'){g.right=0;chFinish();return;}g.err=bankError(res);g.confirm=false;renderArena();return;}
    g.right=res.right;g.pr=res.pr||null;chFinish();},function(){if(AR.cg===g){g.busy=false;g.confirm=false;g.err=bankError(netFail());renderArena();}});}

/* ================= Version 4.2: Hợp tác (team cases), teacher debrief, participation CSV ================= */
/* The leader's chal doc: tinv {id, to:[ids], t} → teammates answer with treply {id, from, ok} → the leader starts:
   team {id, cid, members, roles:{A:[id],B:[id],C:[id]}, pub, share, t0, lim, done?}. Each member answers only the parts of
   the roles they hold (the server enforces it) and posts tres {id, rt:{part:right}}; only the leader enters the team decision.
   Score = own parts 40% + team parts 60%; ≥ 60% → every member +15% profit for 2 market rounds (Market.applyTeams). */
var TM_INV=30000,TM_GAME=BAL.tmSec*1000;
var TM_LIST=[{id:'1T3',ch:1},{id:'1T4',ch:1},{id:'2T3',ch:2},{id:'2T4',ch:2},{id:'3T3',ch:3},{id:'3T4',ch:3},{id:'4T3',ch:4},{id:'4T4',ch:4},{id:'5T3',ch:5},{id:'5T4',ch:5},{id:'6T3',ch:6},{id:'6T4',ch:6},{id:'7T3',ch:7},{id:'7T4',ch:7}];
function tmPickCase(minCh){var all=TM_LIST.filter(function(c){return c.ch<=minCh;}),top=all.filter(function(c){return c.ch===minCh;});return pickOf(top.length?top:all);}
function tmMine(i){var t=AR.tm,q=t&&t.pub&&t.pub.parts[i];if(!q)return false;return q.role==='team'?t.lead===cloud.uid:(t.roles[q.role]||[]).indexOf(cloud.uid)>=0;}
function tmRoleOf(id){var t=AR.tm,out=[];['A','B','C'].forEach(function(r){if((t.roles[r]||[]).indexOf(id)>=0)out.push(r);});return out;}
function tmSubs(){var t=AR.tm,m={};if(!t)return m;t.members.forEach(function(id){var d=id===cloud.uid?{tres:t.sub?{id:t.id,own:t.sub.own,team:t.sub.team}:null}:chDoc(id);if(d&&d.tres&&d.tres.id===t.id)m[id]={own:d.tres.own||{r:0,n:0},team:d.tres.team||{r:0,n:0}};});return m;}   // who has handed in, with their totals only
function tmScore(subs,pub){var on=0,tn=0,or=0,tr=0;pub.parts.forEach(function(q){if(q.role==='team')tn++;else on++;});Object.keys(subs).forEach(function(id){or+=subs[id].own.r;tr+=subs[id].team.r;});   // a part nobody handed in counts as wrong
  var fo=on?Math.min(1,or/on):0,ft=tn?Math.min(1,tr/tn):0;return {pct:Math.round(40*fo+60*ft),own:Math.round(100*fo),team:Math.round(100*ft)};}
function tmInvite(){var m=chMy(),ids=Object.keys(AR.tpick||{}).filter(function(id){return AR.tpick[id]&&!chWhy(id);}).slice(0,2);if(!ids.length||m.tinv||AR.tm)return;
  m.tinv={id:'T'+cloud.uid+'-'+Date.now(),to:ids,t:Date.now()};AR.tpick={};chSend();toast(L('Đã mời ','Invited ')+ids.map(chName).join(', '));renderArena();}

function tmReplies(){var m=chMy(),v=m.tinv,out={};if(!v)return out;v.to.forEach(function(id){var d=chDoc(id),r=d&&d.treply;out[id]=r&&r.id===v.id?(r.ok?'yes':'no'):'wait';});return out;}

function tmStart(){var m=chMy(),v=m.tinv;if(!v||AR.tm)return;m.play={id:v.id,until:Date.now()+((ARTEST&&ARTEST.tmSec?ARTEST.tmSec*1000:TM_GAME))+20000};var rp=tmReplies(),acc=v.to.filter(function(id){return rp[id]==='yes';});if(!acc.length)return;
  var ms=[cloud.uid].concat(acc),n=ms.length,roles={A:[ms[0]],B:[ms[1]],C:[n===3?ms[2]:ms[0]]};
  var minCh=Math.max(1,Math.min.apply(null,[m.ch||1].concat(acc.map(function(id){var d=chDoc(id);return (d&&d.ch)||1;})))),cs=tmPickCase(minCh);
  var g={id:v.id,lead:cloud.uid,cid:cs.id,members:ms,roles:roles,pub:null,play:null,ans:{},t0:0,lim:(ARTEST&&ARTEST.tmSec?ARTEST.tmSec*1000:TM_GAME),done:false,draft:{}};AR.tm=g;m.tinv=null;
  if(!(P&&P.kind==='arena'))openArena();AR.tab='chal';renderArena();
  Bank.case(cs.id,{members:acc,roles:roles}).then(function(res){if(AR.tm!==g)return;if(!res.ok){g.err=bankError(res);renderArena();return;}
    g.pub=res.pub;g.play=res.play;g.share=res.share;g.t0=Date.now();m.team={id:g.id,cid:g.cid,members:ms,roles:roles,pub:res.pub,share:res.share,t0:g.t0,lim:g.lim};chSend();renderArena();},
    function(){if(AR.tm===g){g.err=bankError(netFail());renderArena();}});}
function tmJoin(lead,t){var m0=chMy();m0.play={id:t.id,until:(t.t0||Date.now())+(t.lim||TM_GAME)+20000};chSend();var g={id:t.id,lead:lead,cid:t.cid,members:t.members,roles:t.roles,pub:t.pub,play:null,ans:{},t0:t.t0,lim:t.lim,done:false,draft:{}};AR.tm=g;AR.twait=null;
  if(!(P&&P.kind==='arena'))openArena();AR.tab='chal';
  Bank.caseJoin(t.share,t.cid,{lead:lead,roles:t.roles}).then(function(res){if(AR.tm!==g)return;if(!res.ok){g.err=bankError(res);renderArena();return;}g.play=res.play;renderArena();},function(){if(AR.tm===g){g.err=bankError(netFail());renderArena();}});
  renderArena();}
function tmSubmit(force){var g=AR.tm;if(!g||g.done||g.busy||g.sub||!g.play||!g.pub)return;var a=caseCollect(g,tmMine),mine=g.pub.parts.filter(function(_,i){return tmMine(i);}).length,k=Object.keys(a).length;
  if(k<mine&&!g.confirm&&!force){g.confirm=true;renderArena();return;}
  var fin=function(res){g.sub={own:res.own||{r:0,n:0},team:res.team||{r:0,n:0}};var m=chMy();m.tres={id:g.id,own:g.sub.own,team:g.sub.team,cid:g.cid,sh:g.share,pr:res.pr||undefined};chSend();tmCheckEnd();renderArena();};
  if(!k){fin({});return;}
  g.busy=true;g.err='';renderArena();
  Bank.caseSubmit(g.play,a).then(function(res){if(AR.tm!==g)return;g.busy=false;if(!res.ok&&res.error!=='done'){g.err=res.error==='not_yours'?L('Phần này không thuộc vai của bạn.','This part is not your role\'s.'):bankError(res);g.confirm=false;renderArena();return;}fin(res.ok?res:{});},
    function(){if(AR.tm===g){g.busy=false;g.confirm=false;g.err=bankError(netFail());renderArena();}});}
function tmNote(){var g=AR.tm,e=el('tmnote');if(!g||!e)return;var m=chMy();m.note={id:g.id,txt:String(e.value).slice(0,200)};g.myNote=m.note.txt;chSend();toast(L('Đã gửi ghi chú cho đội.','Note sent to your team.'));renderArena();}
function tmCheckEnd(force){var g=AR.tm;if(!g||g.done||!g.pub||g.lead!==cloud.uid)return;var subs=tmSubs(),all=Object.keys(subs).length>=g.members.length,late=g.t0&&Date.now()-g.t0>=g.lim+6000;
  if(!(all||late||force))return;var sc=tmScore(subs,g.pub),m=chMy();g.done=sc;m.team=Object.assign({},m.team,{done:{pct:sc.pct,own:sc.own,team:sc.team,t:Date.now()}});chSend();tmReward(sc);}
function tmReward(sc){var g=AR.tm;if(!g)return;S.chx=S.chx||{};if(S.chx[g.id])return;S.chx[g.id]=1;S.cst=S.cst||{};
  var own=g.pub.parts.filter(function(q,i){return q.role!=='team'&&tmMine(i);}).length,ok=g.sub?g.sub.own.r:0;
  S.cst.team=(S.cst.team||0)+1;S.cst.tpn=(S.cst.tpn||0)+own;S.cst.tpr=(S.cst.tpr||0)+Math.min(own,ok);
  S.xp+=sc.pct>=MK.TEAM_PASS?BAL.tmPassXP:BAL.tmPlayXP;persist();hud();achCheck();}
function tmScan(){if(!chOn())return;var m=chMy(),now=Date.now(),me=cloud.uid,changed=false;
  if(!AR.tinv&&!AR.tm&&!AR.cg&&!m.tinv&&!AR.twait){chOnline().forEach(function(id){var d=chDoc(id);if(AR.tinv||!d.tinv||d.tinv.to.indexOf(me)<0||now-d.tinv.t>=TM_INV)return;if(m.treply&&m.treply.id===d.tinv.id)return;AR.tinv={id:d.tinv.id,from:id,t:d.tinv.t};changed=true;});}
  if(AR.tinv&&(now-AR.tinv.t>=TM_INV||!chDoc(AR.tinv.from)||!chDoc(AR.tinv.from).tinv||chDoc(AR.tinv.from).tinv.id!==AR.tinv.id)){AR.tinv=null;changed=true;}
  if(!AR.tm){Object.keys(AR.chd||{}).forEach(function(id){var d=chDoc(id),t=d&&d.team;if(AR.tm||!t||!t.pub||t.done||t.members.indexOf(me)<0||id===me)return;if(!(m.treply&&m.treply.id===t.id))return;tmJoin(id,t);changed=true;});}
  if(AR.twait&&!AR.tm&&now-AR.twait.t>TM_INV+60000){AR.twait=null;changed=true;}
  if(m.tinv&&now-m.tinv.t>=TM_INV+30000&&!AR.tm){m.tinv=null;chSend();changed=true;}
  var g=AR.tm;if(g&&!g.done){if(g.lead===me)tmCheckEnd();else{var ld=chDoc(g.lead),dn=ld&&ld.team&&ld.team.id===g.id&&ld.team.done;if(dn){g.done={pct:dn.pct,own:dn.own,team:dn.team};tmReward(g.done);changed=true;}}}
  if(g&&!g.done){var e=el('tm-left');if(e&&g.t0)e.textContent=mmss(g.lim-(now-g.t0));if(g.t0&&now-g.t0>=g.lim&&!g.sub&&!g.busy)tmSubmit(true);if(g.t0&&now-g.t0>=g.lim+6000&&g.lead===me)tmCheckEnd(true);}
  if(changed&&P&&P.kind==='arena')renderArena();else if(changed&&!P)panel();
  if(g&&!g.done&&P&&P.kind==='arena'&&AR.tab==='chal'&&!document.activeElement.matches('input,textarea')&&JSON.stringify(tmSubs())!==g.lastRts){g.lastRts=JSON.stringify(tmSubs());renderArena();}
}

/* ---------- 4.3: course learning outcomes (CLO) of BEE1037 Kinh tế vi mô — measured separately per course (v5 Macro = 'ma') ----------
 * CLO1–CLO4: every graded first answer reports [course+clo, answered, right] (BankCore / CaseCore `t`); the page adds them to S.clo and,
 * on the web release with D1, the Worker stores the same counts server-side (the dashboard prefers those). CLO5 (data) is not measured in the game. */
var COURSE='mi',CLO_PASS=50,CLO_MIN=5;   // reached = ≥ 50% right with ≥ 5 answers
var CLOS=[
  {k:'1',n:V('Khái niệm và nguyên lý','Concepts and principles')},
  {k:'2',n:V('Giải thích và ứng dụng mô hình','Explain and apply models')},
  {k:'3',n:V('Tính toán, phân tích chính sách','Calculation and policy analysis')},
  {k:'4',n:V('Đồ thị kinh tế vi mô','Microeconomic graphs')}];
function cloAdd(t){if(!t||!t.length)return;S.clo=S.clo||{};
  t.forEach(function(x){var k=String(x[0]);if(!/^[a-z]{2}[1-5]$/.test(k))return;var c=S.clo[k]||[0,0];c[0]+=Number(x[1])||0;c[1]+=Number(x[2])||0;S.clo[k]=c;});persist();}

function cloRow(clo){var o={};CLOS.forEach(function(c){o[c.k]=(clo||{})[COURSE+c.k]||[0,0];});return o;}
function cloState(c){return c[0]<CLO_MIN?'na':100*c[1]/c[0]>=CLO_PASS?'ok':'no';}
function cloPct(c){return c[0]?Math.round(100*c[1]/c[0]):0;}
function renderClo(){var mine=cloRow(S.clo),h='<div class="who"><div class="face" aria-hidden="true">📈</div><div><b>'+L('Chuẩn đầu ra của bạn','Your learning outcomes')+'</b><span class="muted small">'+L('Kinh tế vi mô · đạt khi đúng ≥ '+CLO_PASS+'% (ít nhất '+CLO_MIN+' câu).','Microeconomics · reached at ≥ '+CLO_PASS+'% right (at least '+CLO_MIN+' answers).')+'</span></div></div><div class="clolist">';

function dashFinHtml(list,ps){var real=list.filter(function(p){return !p.test&&!p.waiting;}),tb=finTable(real),h='';

  h+='<div class="kpis" style="grid-template-columns:repeat(2,1fr)">';['F1','F2'].forEach(function(t){var xs=real.map(function(p){return tb[p.id][t];}).filter(function(x){return x&&x.done&&x.rd===finLast(t);}),av=xs.length?xs.reduce(function(a,x){return a+(x.score||0);},0)/xs.length:0;
    h+='<div class="kpi"><span>'+FINT[t].short+' · '+L('lượt ','opening ')+(finLast(t)||'—')+'</span><b>'+xs.length+'/'+real.length+'</b><span class="small muted">'+L('đã nộp · TB ','handed in · avg ')+(xs.length?fmtScore(av):'—')+'</span></div>';});
  h+='</div><div class="card" style="margin-top:12px;padding:12px"><div class="tbl-wrap"><table><thead><tr><th>'+L('Học viên','Student')+'</th><th>Thăng Tiên Trì</th><th>Hoả Chí</th></tr></thead><tbody>';
  real.forEach(function(p){h+='<tr><td>'+esc(pname(p,ps))+'</td>'+['F1','F2'].map(function(t){var x=tb[p.id][t];if(!x)return '<td class="muted">—</td>';
    return '<td>'+(x.done?'<b>'+fmtScore(x.score)+'</b> <span class="small muted">'+x.right+'/'+x.n+' · L'+x.rd+(x.late?' · '+L('trễ','late'):'')+'</span>':'<span class="small muted">'+L('đang làm · L','in progress · O')+x.rd+'</span>')+
      (x.rd===finLast(t)?' <button class="btn ghost" style="padding:2px 6px;font-size:12px" data-act="finredo" data-id="'+esc(p.id)+'" data-t="'+t+'" data-rd="'+x.rd+'">'+(P.confirm==='fr'+p.id+t?L('Chắc chắn?','Sure?'):L('Cho làm lại','Allow retake'))+'</button>':'')+'</td>';}).join('')+'</tr>';});
  return h+'</tbody></table></div></div>';}
function finRedo(id,t,rd){var done=function(){toast(L('Học viên này được làm lại trong lượt hiện tại.','This student may take the test again in this opening.'));cloud.finSrv=null;finSrvLoad();if(SHEETS)sheetsDash();};
  if(FAST)return fastCall('finReset',{id:id,test:t,rd:rd}).then(function(res){if(res.ok)done();else if(res.error==='no_db')api('finReset',{id:id,test:t,rd:rd}).then(done);});
  if(SHEETS)return api('finReset',{id:id,test:t,rd:rd}).then(done);
  var r=Object.assign({},(cloud.cfg&&cloud.cfg.finRetake)||{});r[id+'|'+t]=Date.now();return writeConfig({finRetake:r}).then(done);}
function exportFin(){var list=cloud.players.filter(function(p){return !p.teacher&&!p.test&&!p.waiting;}),ids=list.map(function(p){return p.id;}),tb=finTable(list);
  names(ids,function(ps){var rows=[csvLine(['student','F1_opening','F1_right','F1_n','F1_score10','F1_late','F2_opening','F2_right','F2_n','F2_score10','F2_late'])];
    list.forEach(function(p){var r=[pname(p,ps)];['F1','F2'].forEach(function(t){var x=tb[p.id][t];r.push(x?x.rd:'',x&&x.done?x.right:'',x&&x.done?x.n:'',x&&x.done?x.score:'',x&&x.late?'1':'');});rows.push(csvLine(r));});
    rows.push(csvLine(['F1 = Final Test 1 Thăng Tiên Trì (20 câu trắc nghiệm); F2 = Final Test 2 Hoả Chí (4 kết quả số, đúng trong ±1%); điểm thang 10; xuất '+new Date().toLocaleString('vi-VN')]));
    saveFile('economics-arena-final.csv','﻿'+rows.join('\n'));});}

function playNode(){playAt(NODES[S.pos]);}
document.addEventListener('click',function(e){
  var lb=e.target.closest('[data-lang]');
  if(lb){lang=lb.dataset.lang;try{localStorage.setItem('arena-lang',lang);}catch(_){}renderMap();
    if(sheetMode==='final')renderFinalSheet();else if(sheetMode==='ach')renderAch();else if(sheetMode==='clo')renderClo();else if(sheetMode==='trials')renderTrials();else if(sheetMode==='talk')renderTalk();else if(sheetMode==='shop')renderShop();else if(sheetMode==='menu')renderMenu();else if(sheetMode==='board')renderBoard();
    if(P){if(P.kind==='stage')(P.res?renderStageResult:renderStage)();else if(P.kind==='boss')(P.res?renderBossResult:renderBoss)();else if(P.kind==='decide')renderDecide();else if(P.kind==='rounds')renderRounds();else if(P.kind==='bossintro')bossIntro(P.node);else if(P.kind==='trial')(P.res?renderTrialResult:renderTrial)();else if(P.kind==='mini')renderMini();else if(P.kind==='dash')renderDash();else if(P.kind==='arena')renderArena();else if(P.kind==='final'){if(P.res)renderFinalResult();else if(P.pub)renderFinal();}}
    return;}
  var hx=e.target.closest('[data-hex]');if(hx&&P&&P.kind==='arena'){AR.sel=AR.sel===hx.dataset.hex&&!hx.classList.contains('mini')?null:hx.dataset.hex;AR.tab='map';renderArena();return;}
  var npc=e.target.closest('[data-npc]');if(npc&&!walking&&!P){openNpc(+npc.dataset.npc);return;}
  var mgl=e.target.closest('[data-mg]');if(mgl&&!walking&&!P){openMini(mgl.dataset.mg);return;}
  var fg=e.target.closest('[data-final]');if(fg&&!walking&&!P){openFinalSheet();return;}
  var node=e.target.closest('[data-node]');
  if(node&&!P){var i=+node.dataset.node;if(i===S.pos)return;
    if(S.teacher&&teacherAllowed()){S.pos=i;S.npcs=[];spawnAhead();persist();renderMap();follow(i);}
    else if(gateOf(NODES[i].id)==='o')gateNodeSheet(i);
    else{if(SHEETS&&i>S.pos)sheetsHello();toast((gateOf(NODES[i].id)==='c'?L('Giáo viên đang đóng','Closed by your teacher'):i<S.pos?L('Đã đi qua','Already passed'):L('Chưa mở','Locked'))+': '+NODES[i].id+' · '+tx(NODES[i].name));}return;}
  var a=e.target.closest('[data-act]');if(!a||a.disabled)return;var act=a.dataset.act;
  switch(act){
   case 'play':if(!walking)playNode();break;
   case 'gplay':if(!walking){closeSheet();playAt(NODES[+a.dataset.i]);}break;
   case 'final':if(!walking)openFinalSheet();break;
   case 'finstart':startFinal(a.dataset.t);break;
   case 'fnans':if(P&&P.kind==='final'&&!P.busy&&!P.res){P.ans[P.i]=+a.dataset.i;P.confirm=false;renderFinal();}break;
   case 'fngo':finGo(+a.dataset.i);break;case 'fnprev':finGo(P.i-1);break;case 'fnnext':finGo(P.i+1);break;case 'fnsub':finSubmit(false);break;
   case 'gcell':if(teacherAllowed())gateSet(a.dataset.id,gateCycle(gateOf(a.dataset.id)));break;
   case 'grow':if(teacherAllowed())gateRow(+a.dataset.w);break;
   case 'gall':if(teacherAllowed())gateAll(a.dataset.g);break;
   case 'fincsv':if(teacherAllowed())exportFin();break;
   case 'finredo':if(teacherAllowed()){var fk='fr'+a.dataset.id+a.dataset.t;if(P.confirm===fk){P.confirm=null;finRedo(a.dataset.id,a.dataset.t,+a.dataset.rd);}else{P.confirm=fk;renderDash();}}break;
   case 'walk':walk();break;
   case 'shop':shopMsg='';renderShop();openSheet('shop');break;
   case 'menu':renderMenu();openSheet('menu');break;
   case 'buy':buy(a.dataset.id);break;
   case 'closesheet':closeSheet();break;
   case 'teacher':if(teacherAllowed()){S.teacher=!S.teacher;persist();renderMenu();renderMap();}break;
   case 'board':if(boardOpen()){if(SHEETS)sheetsBoard();else{renderBoard();openSheet('board');}}break;
   case 'drefresh':if(SHEETS)sheetsDash().then(function(){if(P&&P.dtab==='fin')finSrvLoad();});if(P&&P.dtab==='clo')cloSrvLoad();break;
   case 'logout':logout(false);break;
   case 'teacherboard':case 'dash':if(teacherAllowed())openDash();break;
   case 'asstudent':if(canPreview()){asStudent=!asStudent;try{localStorage.setItem('arena-as-student',asStudent?'1':'0');}catch(_){}if(asStudent)S.teacher=false;renderMenu();renderMap();}break;
   case 'dsel':P.sel=P.sel===a.dataset.id?null:a.dataset.id;P.confirm=null;renderDash();break;
   case 'dreset':if(P.confirm===a.dataset.id){P.confirm=null;if(P.sel===a.dataset.id)P.sel=null;resetPlayer(a.dataset.id);}else{P.confirm=a.dataset.id;renderDash();}break;
   case 'dresetall':if(P.confirm==='all'){P.confirm=null;P.sel=null;resetAll();}else{P.confirm='all';renderDash();}break;
   case 'csv':if(teacherAllowed())exportCsv();break;
   case 'reset':if(a.dataset.c){S=fresh();persist();closeSheet();renderMap();follow(0);}else{a.dataset.c='1';renderMenu(true);el('sheet').querySelector('[data-act="reset"]').dataset.c='1';}break;
   case 'npcans':npcAnswer(+a.dataset.i);break;
   case 'usehint':npcHint();break;
   case 'quit':trialQuit();if(P&&P.kind==='arena'){AR.duel=null;clearInterval(AR.dt);AR.confirmStop=false;}closePlay();break;
   case 'arena':if(!walking)openArena();break;
   case 'arpractice':arStartPractice();break;
   case 'artab':AR.tab=a.dataset.t;renderArena();break;
   case 'arjoin':arJoin(a.dataset.d);break;
   case 'arleave':arLeave(a.dataset.d);break;
   case 'arstep':var sd=a.dataset.d,st0=MK.TYPES[MK.BY[sd].type],rg=el('arr'),nv=Math.max(st0.min,Math.min(st0.max,(+rg.value)+(+a.dataset.v)));rg.value=nv;arSlide(sd,nv);break;
   case 'arduel':arStartDuel(a.dataset.d,a.dataset.t);break;
   case 'duelans':if(AR.duel&&!AR.duel.busy&&!AR.duel.done){AR.duel.ans[AR.duel.i]=+a.dataset.i;AR.duel.confirm=false;renderArena();}break;
   case 'dugo':arDuelGo(+a.dataset.i);break;case 'duprev':arDuelGo(AR.duel?AR.duel.i-1:-1);break;case 'dunext':arDuelGo(AR.duel?AR.duel.i+1:-1);break;case 'dusub':arDuelSubmit(false);break;
   case 'duelgiveup':arDuelFinish();break;
   case 'duelquit':AR.duel=null;clearInterval(AR.dt);renderArena();break;
   case 'evopen':if(teacherAllowed()){var md=el('ev-mode').value;arOpenEvent({min:+el('ev-min').value,sec:+el('ev-sec').value,mode:md==='solo'?'solo':'team',teams:md==='solo'?0:+md.slice(4),bots:+el('ev-bots').value,openAll:el('ev-all').checked});}break;
   case 'evmore':if(arHosting())arSetEnd(AR.cls.cfg.end+300000);break;
   case 'evstop':if(arHosting()){if(AR.confirmStop){AR.confirmStop=false;arSetEnd(Date.now());arHostTick();}else{AR.confirmStop=true;renderArena();}}break;
   case 'replay':var nd=P.node;stopTimer();P=null;if(nd.kind==='stage')startStage(nd);else if(nd.kind==='boss')bossIntro(nd);else startMission(nd);break;
   case 'mc':if(!P.busy){P.ans[P.i]=+a.dataset.i;P.confirm=false;renderStage();}break;
   case 'tf':if(!P.busy){P.ans[P.i][+a.dataset.i]=a.dataset.v==='true';P.confirm=false;renderStage();}break;
   case 'stgo':stageGo(+a.dataset.i);break;case 'stprev':stageGo(P.i-1);break;case 'stnext':stageGo(P.i+1);break;case 'stsub':stageSubmit();break;
   case 'hint':useHint();break;
   case 'npcagain':npcAgain();break;
   case 'npcgiveup':npcGiveUp();break;
   case 'bossgo':startBoss(P.node,!!a.dataset.t);break;
   case 'bossans':if(!P.busy&&!P.res){P.ans[P.i]=+a.dataset.i;P.confirm=false;renderBoss();}break;
   case 'bsgo':bossGo(+a.dataset.i);break;case 'bsprev':bossGo(P.i-1);break;case 'bsnext':bossGo(P.i+1);break;case 'bssub':bossSubmit(false);break;
   case 'dx':P.x=Math.max(P.m.min,Math.min(P.m.max,P.x+(+a.dataset.d)));renderDecide();break;
   case 'dtry':dTry();break;
   case 'dfinish':dFinish();break;
   case 'rnd':playRound(a.dataset.v);break;
   case 'closeframe':closeCafe();break;
   case 'chinv':chInvite(a.dataset.id);break;
   case 'tmpick':AR.tpick=AR.tpick||{};AR.tpick[a.dataset.id]=a.checked;renderArena();break;
   case 'tminv':tmInvite();break;
   case 'tmcancel':tmCancel();break;
   case 'tmstart':tmStart();break;
   case 'tmyes':tmAnswer(true);break;
   case 'tmno':tmAnswer(false);break;
   case 'tmopt':if(AR.tm&&!AR.tm.sub&&tmMine(+a.dataset.i)){[].slice.call(document.querySelectorAll('#play-body input.cin')).forEach(function(inp){AR.tm.draft[inp.dataset.i]=inp.value;});AR.tm.ans[+a.dataset.i]=+a.dataset.k;AR.tm.confirm=false;renderArena();}break;
   case 'tmnote':tmNote();break;
   case 'tmsubmit':tmSubmit(false);break;
   case 'tmend':tmCheckEnd(true);break;
   case 'tmquit':if(AR.tm&&!AR.tm.done&&AR.tm.lead===cloud.uid&&AR.tm.pub)tmCheckEnd(true);else{var m1=chMy();m1.play=null;chSend();AR.tm=null;renderArena();}break;
   case 'dbsol':dbSol(+a.dataset.k);break;
   case 'chcancel':chCancel();break;
   case 'chyes':chAnswer(true);break;
   case 'chno':chAnswer(false);break;
   case 'chopen':openArena();AR.tab='chal';renderArena();break;
   case 'cgopt':if(AR.cg&&!AR.cg.done&&!AR.cg.busy){[].slice.call(document.querySelectorAll('#play-body input.cin')).forEach(function(inp){AR.cg.draft[inp.dataset.i]=inp.value;});AR.cg.ans[+a.dataset.i]=+a.dataset.k;AR.cg.confirm=false;renderArena();}break;
   case 'cgsubmit':chSubmit(false);break;
   case 'cgquit':if(AR.cg&&!AR.cg.done&&AR.cg.pub)chFinish();else{if(AR.cg&&!AR.cg.done){var m0=chMy();m0.play=null;chSend();}AR.cg=null;renderArena();}break;
   case 'trials':renderTrials();openSheet('trials');break;
   case 'ach':renderAch();openSheet('ach');break;
   case 'clo':renderClo();openSheet('clo');break;
   case 'dtab':if(P&&P.kind==='dash'){P.dtab=a.dataset.t;if(P.dtab==='clo')cloSrvLoad();if(P.dtab==='fin'){cloud.finSrv=null;if(SHEETS)sheetsDash().then(finSrvLoad,finSrvLoad);else finSrvLoad();}renderDash();}break;
   case 'clocsv':if(teacherAllowed())exportClo();break;
   case 'trialgo':startTrial(+a.dataset.c);break;
   case 'trialans':if(P&&P.kind==='trial'&&!P.busy&&!P.res){P.ans[P.i]=+a.dataset.i;P.confirm=false;renderTrial();}break;
   case 'trgo':trialGo(+a.dataset.i);break;case 'trprev':trialGo(P.i-1);break;case 'trnext':trialGo(P.i+1);break;case 'trsub':trialSubmit(false);break;
   case 'mggo':mgGo();break;
   case 'mzmove':mazeMove(a.dataset.d);break;
   case 'mgstop':mgStop();break;
   case 'mgpick':mgRace(+a.dataset.i);break;
   case 'mgx':if(P&&P.kind==='mini'&&MG_EXTRA[P.g.t]&&MG_EXTRA[P.g.t].act)MG_EXTRA[P.g.t].act(a);break;
  }
});
document.addEventListener('change',function(e){if(e.target.id==='hide-me'){S.hide=e.target.checked;persist();}
  if(/^fin-F[12]$/.test(e.target.id)&&teacherAllowed())finToggle(e.target.id.slice(4),e.target.checked);
  if(e.target.id==='showboard'&&teacherAllowed()&&cloud.db)writeConfig({showBoard:e.target.checked}).then(function(){panel();});});
function arSlide(did,v){arDecide(did,v);var x=arX(),b=el('arv'),pv=el('arpv');if(b)b.textContent=v;if(pv)pv.innerHTML=arPreviewText(did,MK.preview(x.state,x.cfg,did,arMe(),v,arMine()));}
document.addEventListener('input',function(e){if(e.target.classList&&e.target.classList.contains('fnum')&&P&&P.kind==='final'&&!P.res){var v=e.target.value.trim(),k=+e.target.dataset.i;P.ans[k]=v===''?null:v;P.confirm=false;
    e.target.closest('.f2plate').classList.toggle('fill',v!=='');var bn=el('play-body').querySelector('.finban');if(bn)bn.outerHTML=finBanner();var sb=el('play-bar').querySelector('[data-act="fnsub"]');if(sb)sb.textContent=L('Nộp bài','Submit');return;}if(e.target.id==='arr'&&P&&P.kind==='arena'){arSlide(e.target.dataset.d,+e.target.value);return;}if(e.target.id==='dr'&&P&&P.kind==='decide'){P.x=+e.target.value;el('dv').innerHTML=P.x+' <small>'+tx(P.m.unit)+'</small>';var b=el('play-bar').querySelector('[data-act="dtry"]');if(b)b.textContent=L('Thử với ','Try ')+P.x;}});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target&&e.target.classList&&e.target.classList.contains('cin')){var bt=e.target.parentNode.querySelector('button');if(bt&&!bt.disabled)bt.click();return;}
  if(e.key==='Escape'){if(sheetMode)closeSheet();}
  if(P&&P.kind==='mini'&&P.mz&&P.phase==='play'){var dk={ArrowUp:'n',ArrowDown:'s',ArrowLeft:'w',ArrowRight:'e'}[e.key];if(dk){e.preventDefault();mazeMove(dk);return;}}
  if((e.key==='Enter'||e.key===' ')&&e.target.closest&&e.target.closest('[data-npc],[data-node],[data-hex],[data-mg],[data-final],.qsdots i')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}
});
el('ov').addEventListener('click',function(e){if(e.target===el('ov'))closeSheet();});
window.addEventListener('pageshow',function(){syncCafe();if(!P)renderMap();});

if(!S.npcs.length&&S.pos===0&&!Object.keys(S.best).length)S.npcs.push({id:S.nid++,type:'customer',t:0.6,dx:roadW(1)/2+16});
syncCafe();renderMap();requestAnimationFrame(function(){follow(S.pos);});
if(SHEETS){sheetsInit();el('lg-form').addEventListener('submit',function(e){e.preventDefault();doLogin();});
  document.addEventListener('visibilitychange',function(){if(!document.hidden)sheetsHello();});}
else initCloud();
})();
</script>
