function normalize(x){var f=fresh();if(!x||typeof x!=='object'||typeof x.pos!=='number'||x.pos>=N||x.pos<0)return f;
  Object.keys(f).forEach(function(k){if(x[k]===undefined||x[k]===null)x[k]=f[k];});if(!x.inv.hint)x.inv.hint=x.inv.hint||0;if(!x.inv.retry)x.inv.retry=x.inv.retry||0;return x;}

function logAttempt(id,score,stars){var a=S.att[id]||{n:0,best:0,last:0,stars:0};a.n++;a.last=score;a.best=Math.max(a.best,score);a.stars=Math.max(a.stars,stars);S.att[id]=a;
  S.hist.unshift({id:id,s:score,st:stars,t:Date.now()});if(S.hist.length>60)S.hist.length=60;}

        if(sheetMode==='board')renderBoard();if(P&&P.kind==='dash')renderDash();hud();},function(){});
      db.collection('board').onSnapshot(function(snap){cloud.board=snap.docs.map(function(d){var x=d.data()||{};return {id:d.id,xp:x.xp||0,stars:x.stars||0,cleared:x.cleared||0,hide:!!x.hide,teacher:!!x.teacher,test:!!x.test,label:typeof x.label==='string'?x.label:''};});
        if(sheetMode==='board')renderBoard();},function(){});
      try{db.doc('class/config').onSnapshot(function(snap){cloud.cfg=snap.exists?(snap.data()||{}):{};applyConfig();panel();if(sheetMode==='board')renderBoard();if(P&&P.kind==='dash')renderDash();},function(){});}catch(e){}
      return db.doc('class/config').get().then(function(c){cloud.cfg=c.exists?(c.data()||{}):{};applyConfig();return cloud.ref.get();}).then(function(mine){
        if(mine.exists){var d=mine.data();cloud.mode='on';
          if(d.state&&(d.state.updated||0)>(S.updated||0)){S=normalize(JSON.parse(JSON.stringify(d.state)));localSave();toast(L('Đã tải tiến độ của bạn từ lớp.','Loaded your progress from the class.'));}

}
// RESET: the owner writes class/config {epoch, resets:{uid:time}} and deletes the player docs.
// Every device compares it with its own save, so old local progress cannot come back.

function applyConfig(){if(!needsReset())return;if(P){cloud.pendingReset=true;return;}doReset();}
function doReset(){var c=cloud.cfg||{};S=fresh();S.epoch=c.epoch||0;S.resetSeen=(c.resets||{})[cloud.uid]||0;S.updated=Date.now();localSave();cloud.pendingReset=false;
  if(cloud.mode==='on')cloudPush();renderMap();follow(0);toast(L('Giáo viên đã đặt lại tiến độ. Bắt đầu lại từ xe đẩy cà phê!','Your teacher reset the progress. Back to the coffee cart!'));}

/* ================= SHEETS BACKEND (free web release): name + code login against the class Google Sheet =================
   Active when config.js sets window.ARENA_API to the Apps Script /exec URL; otherwise the claude.ai runtime is used. */
var API=String(window.ARENA_API||'').trim(),SHEETS=!!API;

function takeWt(res){if(sess&&res&&res.wt&&res.wt!==sess.wt){sess.wt=res.wt;saveSess();}}

function sheetsStart(res){
  takeWt(res);cloud.owner=sess.role==='teacher';cloud.uid=sess.id;cloud.db={sheets:true};cloud.bankInfo=res.bankInfo||cloud.bankInfo||null;cloud.cfg=res.cfg||{};cloud.seats=res.seats;cloud.mode='on';cloud.nameMap[sess.id]=sess.name;
  if(S.uid&&S.uid!==sess.id)S=fresh();          // a different person's save on this device
  var st=res.state;

function doLogin(){

function logout(expired){
  sess=null;try{localStorage.removeItem('arena-session');localStorage.removeItem(KEY);}catch(e){}

function saveFile(name,text){
  var go=function(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);};

    dl.save({filename:name,data:text}).catch(function(e){if(e&&e.code!=='declined')toast(L('Không lưu được tệp.','Could not save the file.'));});});
}

/* ================= BANK HELPERS ================= */
/* ================= QUESTION SOURCE =================
   Local: bank.js + bankcore.js in the page (claude.ai build); answer keys kept in this closure.
   Remote: the web release — no bank in the page; the Google server picks questions and checks answers.

function fastCall(action,data,again){
  return fetch(FAST,{method:'POST',body:JSON.stringify(Object.assign({action:action,wt:sess&&sess.wt},data||{}))}).then(function(r){return r.json();}).then(function(res){
    // pass expired or position out of date (a save still in flight) → fetch a fresh pass from the Sheet once, then retry
    if(!again&&sess&&(res.error==='wauth'||res.error==='locked'))return api('hello').then(function(h){
      if(h.ok&&h.wt){takeWt(h);return fastCall(action,data,true);}return h.error==='auth'?{ok:false,error:'auth'}:res;},function(){return res;});

var Bank=(function(){

    var byId={};items.forEach(function(q){byId[q.id]=q;});

      boss:function(node){var s=BankCore.boss(items,node);return done({play:put(s.key),qs:s.pub});},

    if(S.npcs.length>=max)break;if(Math.random()>p)continue;
    var type,r=Math.random();
    if(S.review.length&&r<0.35)type='professor';
    else if(w>=NPC.investor.from&&r>=0.94)type='investor';
    else{var ts=Object.keys(NPC).filter(function(k){return NPC[k].from<=w&&!NPC[k].rare;});type=ts[Math.floor(Math.random()*ts.length)];}
    var t=Math.min(N-1,S.pos+0.2+Math.random()*1.8),Ln=lanesAt(t),rw=roadW(Ln),lane=Math.floor(Math.random()*Ln),dx=-rw/2+rw*(lane+0.5)/Ln;
    if(Ln===1)dx=(Math.random()<0.5?-1:1)*(rw/2+16);
    S.npcs.push({id:S.nid++,type:type,t:t,dx:dx});
  }
}

  function step(ts){if(start===null)start=ts;var k=Math.min(1,(ts-start)/dur),t=from+(to-from)*(k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2);

    if(k<1)requestAnimationFrame(step);else{S.pos=to;walking=false;S.npcs=S.npcs.filter(function(n){return n.t>=S.pos-0.5;});spawnAhead();persist();renderMap();}}
  requestAnimationFrame(step);

  var t=P.tasks[P.i],s=P.t,locked=s.phase==='done',rv=s.reveal||{},h='';
  el('play-title').innerHTML=esc(P.node.id+' · '+tx(P.node.name));playHud();
  h+='<div class="dots" aria-hidden="true">';P.tasks.forEach(function(_,i){h+='<i class="'+(i<P.i||(i===P.i&&locked)?'done':i===P.i?'cur':'')+'"></i>';});h+='</div>';

    h+='<h3 class="q">'+esc(t.q)+'</h3>';
    t.opts.forEach(function(o,i){var c='';
      if(s.removed.indexOf(i)>=0)c=' gone';

      h+='<button class="opt'+c+'" data-act="mc" data-i="'+i+'"'+(s.phase!=='answer'||P.busy?' disabled':'')+'>'+esc(o)+'</button>';});
  }else if(t.type==='tf'){
    h+='<h3 class="q">'+L('Mỗi nhận định dưới đây đúng hay sai?','Is each statement true or false?')+'</h3>';
    t.items.forEach(function(it,i){var a=s.ans[i],wrongHere=s.wrong.indexOf(i)>=0;

function ready(){var t=P.tasks[P.i],s=P.t;
  if(t.type==='mc')return s.sel!==null;if(t.type==='tf')return s.ans.every(function(v){return v!==null;});
  return Object.keys(s.link).length===t.vi.length;}
function answerOf(){var t=P.tasks[P.i],s=P.t;
  if(t.type==='mc')return s.sel;if(t.type==='tf')return s.ans.slice();
  return t.vi.map(function(_,i){return s.link[i]===undefined?-1:s.link[i];});}
function check(){
  if(P.busy)return;var s=P.t,hc=s.hinted?5:0,me=P;P.busy=true;s.err='';renderStage();
  Bank.check(P.play,P.i,answerOf()).then(function(res){
    if(P!==me)return;P.busy=false;
    if(!res.ok){s.err=bankError(res);renderStage();return;}
    s.wrong=res.wrong;
    if(res.final){s.reveal=res.reveal;s.e=res.e||'';var ok=!res.wrong.length;
      s.final=ok?{ok:true,attempt:res.attempt,score:res.attempt===1?100:60,xp:Math.max(0,res.right*(res.attempt===1?15:10)-hc)}
                :{ok:false,attempt:res.attempt,score:Math.round(40*res.right/res.n),xp:Math.max(0,res.right*5-hc)};
      finishTask();}
    else{s.attempt=2;s.phase='wrong';renderStage();}
  },function(){if(P!==me)return;P.busy=false;s.err=bankError(netFail());renderStage();});
}
function finishTask(){var s=P.t,t=P.tasks[P.i];s.phase='done';P.xp+=s.final.xp;P.results[P.i]=s.final;
  if(t.type==='mc'&&!s.final.ok&&S.review.indexOf(t.qid)<0)S.review.push(t.qid);
  renderStage();}
function retry(){var t=P.tasks[P.i],s=P.t;s.phase='answer';
  if(t.type==='mc')s.sel=null;else if(t.type==='tf')s.wrong.forEach(function(i){s.ans[i]=null;});else{s.wrong.forEach(function(i){delete s.link[i];});s.pickL=null;}
  s.wrong=[];renderStage();}
function useHint(){
  var s=P.t,me=P;if(s.hinted||P.busy)return;P.busy=true;renderStage();
  Bank.hint(P.play,P.i).then(function(res){if(P!==me)return;P.busy=false;if(res.ok){s.removed=res.remove;s.hinted=true;if(s.sel!==null&&s.removed.indexOf(s.sel)>=0)s.sel=null;}renderStage();},function(){if(P===me){P.busy=false;renderStage();}});
}
function nextTask(){if(P.i<4){P.i++;startTask();renderStage();el('play').scrollTop=0;}else stageResult();}

function startMission(node){
  var m=MISSIONS[node.id];

  if(m.kind==='rounds'){P={node:node,kind:'rounds',m:m,hist:[],xp:0};openPlay();renderRounds();return;}
  P={node:node,kind:'decide',m:m,x:m.start,tries:[],xp:0,done:false,best:bestOf(m)};openPlay();renderDecide();

function decideChart(m,tries,showBest){
  var W=320,Hh=180,x0=46,y0=150,top=28,vals=[],b=P.best;
  for(var x=m.min;x<=m.max;x++)vals.push(m.f(x));
  var lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals);if(m.lower)hi=Math.min(hi,b.v*2.2);lo=Math.min(lo,0);if(hi===lo)hi=lo+1;
  var X=function(x){return x0+(x-m.min)/(m.max-m.min)*(W-x0-10);},Y=function(v){return y0-(Math.max(lo,Math.min(hi,v))-lo)/(hi-lo)*(y0-top);};
  var s='<svg class="chart" viewBox="0 0 '+W+' '+(Hh+10)+'" role="img" aria-label="'+tx(m.vlabel)+'">';
  [lo,(lo+hi)/2,hi].forEach(function(v){s+='<line x1="'+x0+'" x2="'+(W-10)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)"/><text x="'+(x0-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+fmt(v)+'</text>';});
  if(lo<0)s+='<line x1="'+x0+'" x2="'+(W-10)+'" y1="'+Y(0)+'" y2="'+Y(0)+'" stroke="var(--muted)" stroke-dasharray="3 3"/>';
  [m.min,Math.round((m.min+m.max)/2),m.max].forEach(function(x){s+='<text x="'+X(x)+'" y="'+(y0+16)+'" text-anchor="middle">'+x+'</text>';});
  s+='<text x="'+(W-10)+'" y="'+(y0+32)+'" text-anchor="end">'+esc(tx(m.label))+'</text>';
  if(showBest){var d='';for(var x2=m.min;x2<=m.max;x2++)d+=(x2===m.min?'M':'L')+X(x2).toFixed(1)+' '+Y(m.f(x2)).toFixed(1);s+='<path d="'+d+'" fill="none" stroke="var(--teal)" stroke-width="2.5"/>';
    s+='<circle cx="'+X(b.x)+'" cy="'+Y(b.v)+'" r="6" fill="var(--teal)"/><text x="'+X(b.x)+'" y="'+(Y(b.v)-10)+'" text-anchor="middle" class="strong">'+L('Tốt nhất','Best')+' '+b.x+'</text>';}
  tries.forEach(function(tr,i){s+='<circle cx="'+X(tr.x)+'" cy="'+Y(tr.v)+'" r="6" fill="var(--coffee)" stroke="var(--card)" stroke-width="2"/><text x="'+X(tr.x)+'" y="'+(Y(tr.v)+20)+'" text-anchor="middle">'+(i+1)+'</text>';});
  return s+'</svg>';
}

  el('play-body').innerHTML=h;

    :'<button class="btn ghost" data-act="quit">'+L('Thoát','Quit')+'</button>'+(P.tries.length?'<button class="btn ghost" data-act="dfinish">'+L('Chốt kết quả','Lock in')+'</button>':'')+'<button class="btn" data-act="dtry">'+L('Thử với ','Try ')+x+'</button>';

function dTry(){var m=P.m;P.tries.push({x:P.x,v:m.f(P.x)});if(P.tries.length>=4)dFinish();else renderDecide();}
function dFinish(){var m=P.m,b=P.best;P.bestTry=P.tries.reduce(function(a,t){return a===null||(m.lower?t.v<a.v:t.v>a.v)?t:a;},null);
  P.ratio=m.lower?b.v/P.bestTry.v:Math.max(0,P.bestTry.v)/b.v;var st=starsRatio(P.ratio);P.xp=st?20+st*10:5;S.xp+=P.xp;award(P.node,st,200,Math.round(P.ratio*100));P.done=true;renderDecide();el('play').scrollTop=0;}
function renderRounds(){
  var m=P.m,h='',tot=P.hist.reduce(function(a,r){return a+r.me;},0),done=P.hist.length>=5;
  el('play-title').innerHTML=esc(P.node.id+' · '+tx(m.name));playHud();
  h+='<div class="card"><span class="tag">'+L('Nhiệm vụ nhập vai','Role-play mission')+'</span><div class="scene">'+tx(m.story)+'</div>';
  h+='<div class="tbl-wrap"><table><thead><tr><th>'+L('Tuần','Week')+'</th><th>'+L('Bạn','You')+'</th><th>'+L('Đối thủ','Rival')+'</th><th>'+L('Lãi của bạn','Your profit')+'</th></tr></thead><tbody>';
  P.hist.forEach(function(r,i){h+='<tr><td>'+(i+1)+'</td><td>'+(r.a==='H'?L('Cao','High'):L('Thấp','Low'))+'</td><td>'+(r.b==='H'?L('Cao','High'):L('Thấp','Low'))+'</td><td>'+r.me+'</td></tr>';});
  h+='<tr><td colspan="3"><b>'+L('Tổng','Total')+'</b></td><td><b>'+tot+'</b></td></tr></tbody></table></div></div>';
  if(done){var ratio=tot/550,st=starsRatio(ratio);
    h+='<div class="card center"><h1>'+L('Kết thúc 5 tuần','Five weeks done')+'</h1>'+starRow(st)+'<div class="kpis"><div class="kpi"><span>'+L('Tổng lãi','Total')+'</span><b>'+tot+'</b></div><div class="kpi"><span>'+L('so với tối đa 550','of the 550 best')+'</span><b>'+Math.round(ratio*100)+'%</b></div><div class="kpi"><span>XP</span><b>'+P.xp+'</b></div></div><p style="text-align:left;margin-top:12px">'+
      L('Trong một tuần đơn lẻ, giá Thấp là chiến lược trội (150 > 100, 60 > 40), nên cân bằng Nash là cả hai Thấp. Nhưng trò chơi lặp lại với đối thủ “ăn miếng trả miếng”: giữ giá Cao được 100 mỗi tuần, phá giá chỉ lãi một lần rồi bị trả đũa. Tốt nhất: Cao 4 tuần đầu, Thấp ở tuần cuối (đối thủ không còn tuần nào để trả đũa) = 550.',
        'In a single week Low is the dominant strategy (150 > 100, 60 > 40), so the Nash equilibrium is both Low. But this game repeats against tit-for-tat: staying High earns 100 a week, while undercutting pays once and then gets punished. Best: High for four weeks, Low in the last week (the rival has no week left to retaliate) = 550.')+'</p></div>';}
  el('play-body').innerHTML=h;
  el('play-bar').innerHTML=done?'<button class="btn ghost" data-act="replay">'+L('Chơi lại','Replay')+'</button><button class="btn" data-act="quit">'+L('Về con đường','Back to the road')+'</button>'
    :'<button class="btn ghost" data-act="quit">'+L('Thoát','Quit')+'</button><button class="btn" data-act="rnd" data-v="H">'+L('Giá Cao','High price')+'</button><button class="btn" data-act="rnd" data-v="L">'+L('Giá Thấp','Low price')+'</button>';
}
function playRound(a){var b=P.hist.length?P.hist[P.hist.length-1].a:'H',p=PAY[a+b];P.hist.push({a:a,b:b,me:p[0]});
  if(P.hist.length>=5){var tot=P.hist.reduce(function(s,r){return s+r.me;},0),st=starsRatio(tot/550);P.xp=st?20+st*10:5;S.xp+=P.xp;award(P.node,st,200,Math.round(tot/550*100));}
  renderRounds();}

/* ---------- cafe (same artifact, shared storage) ---------- */
function openCafe(){el('frame-title').textContent=tx(MISSIONS['2.5'].name);el('frame-close').textContent=L('Về con đường','Back to the road');el('frame-if').src='cafe.html';el('frame').hidden=false;document.body.classList.add('locked');}
function closeCafe(){el('frame').hidden=true;el('frame-if').src='about:blank';document.body.classList.remove('locked');syncCafe();renderMap();}

/* ================= EVENTS ================= */
function playNode(){var nd=NODES[S.pos];if(nd.kind==='stage')startStage(nd);else if(nd.kind==='boss')bossIntro(nd);else startMission(nd);}
document.addEventListener('click',function(e){
  var lb=e.target.closest('[data-lang]');
  if(lb){lang=lb.dataset.lang;try{localStorage.setItem('arena-lang',lang);}catch(_){}renderMap();
    if(sheetMode==='talk')renderTalk();else if(sheetMode==='shop')renderShop();else if(sheetMode==='menu')renderMenu();else if(sheetMode==='board')renderBoard();
    if(P){if(P.kind==='stage')(P.res?renderStageResult:renderStage)();else if(P.kind==='boss')(P.res?renderBossResult:renderBoss)();else if(P.kind==='decide')renderDecide();else if(P.kind==='rounds')renderRounds();else if(P.kind==='bossintro')bossIntro(P.node);else if(P.kind==='dash')renderDash();}
    return;}
  var npc=e.target.closest('[data-npc]');if(npc&&!walking&&!P){openNpc(+npc.dataset.npc);return;}
  var node=e.target.closest('[data-node]');
  if(node&&!P){var i=+node.dataset.node;if(i===S.pos)return;
    if(S.teacher&&teacherAllowed()){S.pos=i;S.npcs=[];spawnAhead();persist();renderMap();follow(i);}
    else toast((i<S.pos?L('Đã đi qua','Already passed'):L('Chưa mở','Locked'))+': '+NODES[i].id+' · '+tx(NODES[i].name));return;}
  var a=e.target.closest('[data-act]');if(!a||a.disabled)return;var act=a.dataset.act;
  switch(act){
   case 'play':if(!walking)playNode();break;
   case 'walk':walk();break;
   case 'shop':shopMsg='';renderShop();openSheet('shop');break;
   case 'menu':renderMenu();openSheet('menu');break;
   case 'buy':buy(a.dataset.id);break;
   case 'closesheet':closeSheet();break;
   case 'teacher':if(teacherAllowed()){S.teacher=!S.teacher;persist();renderMenu();renderMap();}break;
   case 'board':if(boardOpen()){if(SHEETS)sheetsBoard();else{renderBoard();openSheet('board');}}break;
   case 'drefresh':if(SHEETS)sheetsDash();break;
   case 'logout':logout(false);break;
   case 'teacherboard':case 'dash':if(teacherAllowed())openDash();break;
   case 'asstudent':if(canPreview()){asStudent=!asStudent;try{localStorage.setItem('arena-as-student',asStudent?'1':'0');}catch(_){}if(asStudent)S.teacher=false;renderMenu();renderMap();}break;
   case 'dsel':P.sel=P.sel===a.dataset.id?null:a.dataset.id;P.confirm=null;renderDash();break;
   case 'dreset':if(P.confirm===a.dataset.id){P.confirm=null;if(P.sel===a.dataset.id)P.sel=null;resetPlayer(a.dataset.id);}else{P.confirm=a.dataset.id;renderDash();}break;
   case 'dresetall':if(P.confirm==='all'){P.confirm=null;P.sel=null;resetAll();}else{P.confirm='all';renderDash();}break;
   case 'csv':if(teacherAllowed())exportCsv();break;
   case 'reset':if(a.dataset.c){S=fresh();persist();closeSheet();renderMap();follow(0);}else{a.dataset.c='1';renderMenu(true);el('sheet').querySelector('[data-act="reset"]').dataset.c='1';}break;
   case 'npcans':npcAnswer(+a.dataset.i);break;
   case 'usehint':npcHint();break;
   case 'quit':closePlay();break;
   case 'replay':var nd=P.node;stopTimer();P=null;if(nd.kind==='stage')startStage(nd);else if(nd.kind==='boss')bossIntro(nd);else startMission(nd);break;
   case 'mc':if(!P.busy){P.t.sel=+a.dataset.i;renderStage();}break;
   case 'tf':P.t.ans[+a.dataset.i]=a.dataset.v==='true';renderStage();break;
   case 'ml':P.t.pickL=P.t.pickL===+a.dataset.i?null:+a.dataset.i;renderStage();break;
   case 'mr':if(P.t.pickL!==null){var j=+a.dataset.j;Object.keys(P.t.link).forEach(function(k){if(P.t.link[k]===j)delete P.t.link[k];});P.t.link[P.t.pickL]=j;P.t.pickL=null;renderStage();}break;
   case 'hint':useHint();break;
   case 'check':check();break;
   case 'retry':retry();break;
   case 'next':nextTask();break;
   case 'bossgo':startBoss(P.node,!!a.dataset.t);break;
   case 'bossans':bossAnswer(+a.dataset.i);break;
   case 'bossnext':bossNext();break;
   case 'dx':P.x=Math.max(P.m.min,Math.min(P.m.max,P.x+(+a.dataset.d)));renderDecide();break;
   case 'dtry':dTry();break;
   case 'dfinish':dFinish();break;
   case 'rnd':playRound(a.dataset.v);break;
   case 'closeframe':closeCafe();break;
  }
});
document.addEventListener('change',function(e){if(e.target.id==='hide-me'){S.hide=e.target.checked;persist();}
  if(e.target.id==='showboard'&&teacherAllowed()&&cloud.db)writeConfig({showBoard:e.target.checked}).then(function(){panel();});});
document.addEventListener('input',function(e){if(e.target.id==='dr'&&P&&P.kind==='decide'){P.x=+e.target.value;el('dv').innerHTML=P.x+' <small>'+tx(P.m.unit)+'</small>';var b=el('play-bar').querySelector('[data-act="dtry"]');if(b)b.textContent=L('Thử với ','Try ')+P.x;}});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if(sheetMode)closeSheet();}
  if((e.key==='Enter'||e.key===' ')&&e.target.closest&&e.target.closest('[data-npc],[data-node]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}
});
el('ov').addEventListener('click',function(e){if(e.target===el('ov'))closeSheet();});
window.addEventListener('pageshow',function(){syncCafe();if(!P)renderMap();});

if(!S.npcs.length&&S.pos===0&&!Object.keys(S.best).length)S.npcs.push({id:S.nid++,type:'customer',t:0.6,dx:roadW(1)/2+16});
syncCafe();renderMap();requestAnimationFrame(function(){follow(S.pos);});
if(SHEETS){sheetsInit();el('lg-form').addEventListener('submit',function(e){e.preventDefault();doLogin();});
  document.addEventListener('visibilitychange',function(){if(!document.hidden)sheetsHello();});}
else initCloud();
})();
</script>

</body></html>
