<style>
/* Layout: phone-width column. Map view = sticky HUD + tall road SVG + sticky landmark bar. Play view = full-screen sheet with its own header and action bar. */
:root{
  --bg:#eef2f1; --card:#ffffff; --ink:#14292b; --muted:#566c6e; --line:#d3dedc;
  --teal:#0f766e; --teal-soft:#d5efeb; --gold:#e8a317; --gold-soft:#fbefcf;
  --good:#1f8a4c; --good-soft:#d9f2e3; --bad:#c2410c; --bad-soft:#fde4d6;
  --coffee:#7a4a2a; --coffee-soft:#f1e4d8;
  --road:#4a5658; --road-edge:#2f3a3c; --lane:#f4f1e4; --ground-a:#e2ebe4; --ground-b:#d8e5dc; --bldg:#c3d3cf; --bldg-2:#adc2bd;
  --zr-ink:#3b3e43; --zr-muted:#7a7f85;
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1b1c; --card:#152a2c; --ink:#e6f1ef; --muted:#9bb3b1; --line:#27403f;
  --teal:#3cc4b4; --teal-soft:#16413f; --gold:#f2b83a; --gold-soft:#463816;
  --good:#52c985; --good-soft:#173d28; --bad:#f08a55; --bad-soft:#44241a; --coffee:#d9a77e; --coffee-soft:#3a2a1f; --zr-ink:#e3e5e8; --zr-muted:#a3a8ae;
  --road:#2b3638; --road-edge:#1b2425; --lane:#c9c4ae; --ground-a:#12282a; --ground-b:#163033; --bldg:#24403f; --bldg-2:#2c4d4b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1b1c; --card:#152a2c; --ink:#e6f1ef; --muted:#9bb3b1; --line:#27403f;
  --teal:#3cc4b4; --teal-soft:#16413f; --gold:#f2b83a; --gold-soft:#463816;
  --good:#52c985; --good-soft:#173d28; --bad:#f08a55; --bad-soft:#44241a; --coffee:#d9a77e; --coffee-soft:#3a2a1f; --zr-ink:#e3e5e8; --zr-muted:#a3a8ae;
  --road:#2b3638; --road-edge:#1b2425; --lane:#c9c4ae; --ground-a:#12282a; --ground-b:#163033; --bldg:#24403f; --bldg-2:#2c4d4b; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;
  padding-block:0 170px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.locked{overflow:hidden}
.wrap{max-width:560px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;border-bottom:1.5px solid var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:800;font-size:17px;letter-spacing:-.01em}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.brandbox{display:flex;align-items:center;gap:9px;min-width:0}
.zr-logo{flex:0 0 auto;display:block;border-radius:10px;box-shadow:0 0 0 1px var(--line)}
.zr{color:var(--zr-ink);font-weight:800;letter-spacing:.02em} .zr-by{color:var(--zr-muted);font-weight:600}
.looknow{display:flex;gap:12px;align-items:center}
.ladder{display:flex;gap:2px;justify-content:space-between;margin:6px 0 4px;padding:6px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg)}
.ladder div{flex:1;min-width:0;display:flex;justify-content:center;border-radius:8px} .ladder svg{width:100%;height:auto} .ladder .on{background:var(--gold-soft);outline:2px solid var(--gold)}
.promo-av{display:flex;justify-content:center;margin:6px 0 -4px}
svg .av-spark{transform-box:fill-box;transform-origin:center}
#avatar .av-fig,#avatar .av-l1,#avatar .av-l2,#avatar .av-body,#avatar .av-head{transform-box:fill-box;transform-origin:50% 100%}
@media (prefers-reduced-motion:no-preference){
 #avatar .av-body,#avatar .av-head{animation:breathe 2.6s ease-in-out infinite}
 #avatar.walking .av-fig{animation:hop .32s ease-in-out infinite}
 #avatar.walking .av-l1{transform-origin:50% 0;animation:legA .32s ease-in-out infinite}
 #avatar.walking .av-l2{transform-origin:50% 0;animation:legA .32s ease-in-out infinite reverse}
 .av-aura{animation:pulse 2.2s ease-in-out infinite}
 .av-spark{animation:tw 1.6s ease-in-out infinite}
 #avatar.promo .av-fig{animation:pop 1.3s ease-out}
 #avatar .av-burst{transform-box:fill-box;transform-origin:center;animation:burst 1.1s ease-out forwards}
 .promo-av svg{animation:pop 1.3s ease-out}}
@keyframes breathe{50%{transform:translateY(-.8px)}} @keyframes hop{50%{transform:translateY(-3px)}}
@keyframes legA{0%,100%{transform:rotate(16deg)}50%{transform:rotate(-16deg)}}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.55)}55%{transform:scale(.92)}75%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes burst{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(2.6)}}
.lang{display:flex;border:1.5px solid var(--line);border-radius:99px;overflow:hidden;background:var(--card);flex:0 0 auto}
.lang button{border:0;background:none;color:var(--muted);font:700 13px var(--font);padding:6px 11px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--teal);color:#fff}
.hud{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:3px 11px;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.xp{border-color:var(--gold);background:var(--gold-soft)} .pill.cap{border-color:var(--good);background:var(--good-soft)} .pill.rank{border-color:var(--teal);background:var(--teal-soft)}
.pill.lives{border-color:var(--bad);background:var(--bad-soft)}
.map{margin-top:10px;border-radius:18px;overflow:hidden;border:1.5px solid var(--line);background:var(--ground-b)}
svg#road{display:block;width:100%;height:auto}
svg text{font-family:var(--font)}
.node,.npc{cursor:pointer}
@media (prefers-reduced-motion:no-preference){.npc .bob{animation:bob 1.6s ease-in-out infinite}.cur-ring{animation:pulse 1.4s ease-in-out infinite}}
@keyframes bob{50%{transform:translateY(-4px)}} @keyframes pulse{50%{opacity:.35}}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1.5px solid var(--line);
  padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.bar h2{font-size:18px;margin:2px 0 8px;line-height:1.3;text-wrap:balance}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-width:0;font:700 15px var(--font);border-radius:12px;border:2px solid var(--teal);background:var(--teal);color:#fff;padding:11px 14px;cursor:pointer;text-align:center}
.btn.ghost{background:none;color:var(--teal);flex:0 0 auto}
.acts .btn{min-width:max-content}
.btn:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:13px}
/* play view */
.play{position:fixed;inset:0;z-index:8;background:var(--bg);overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.play header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.stack{display:grid;gap:12px}
h1{font-size:24px;line-height:1.2;margin:4px 0 8px;letter-spacing:-.02em;text-wrap:balance}
h3.q{font-size:18px;line-height:1.4;margin:0 0 14px;text-wrap:pretty}
p{margin:0 0 10px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:2px 9px;background:var(--teal-soft);color:var(--teal);margin-bottom:10px}
.tag.vi{background:var(--gold-soft);color:var(--ink);margin-left:6px}
.dots{display:flex;gap:6px;margin:0 0 12px} .dots i{flex:1;height:7px;border-radius:4px;background:var(--line)}
.dots i.done{background:var(--teal)} .dots i.cur{background:var(--gold)}
.opt{display:block;width:100%;text-align:left;font:600 15px/1.45 var(--font);color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px;cursor:pointer}
.opt:hover{border-color:var(--teal)} .opt.sel{border-color:var(--teal);background:var(--teal-soft)}
.opt.ok{border-color:var(--good);background:var(--good-soft)} .opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.gone{opacity:.3;text-decoration:line-through;pointer-events:none}
.tfrow{border-top:1px solid var(--line);padding:12px 0;display:grid;gap:8px} .tfrow:first-of-type{border-top:0;padding-top:0}
.tfbtns{display:flex;gap:8px} .tfbtns .opt{margin:0;text-align:center;padding:8px}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pairs .opt{margin:0;font-size:14px;padding:10px}
.pairs .opt.paired{border-style:dashed}
.fb{border-radius:12px;padding:12px 14px;margin-top:12px;font-size:15px}
.fb.good{background:var(--good-soft);border:1.5px solid var(--good)} .fb.bad{background:var(--bad-soft);border:1.5px solid var(--bad)} .fb.hint{background:var(--gold-soft);border:1.5px solid var(--gold)}
.fb b{display:block;margin-bottom:2px}
.stars{display:flex;justify-content:center;gap:8px;margin:6px 0 10px} .stars svg{width:48px;height:48px}
.stars .on{fill:var(--gold);stroke:var(--gold)} .stars .off{fill:none;stroke:var(--line)}
.center{text-align:center}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.kpi{border:1.5px solid var(--line);border-radius:12px;padding:8px;text-align:center;min-width:0} .kpi span{display:block;font-size:12px;color:var(--muted)} .kpi b{font-size:20px;font-variant-numeric:tabular-nums}
.rows{display:grid;gap:6px;margin-top:10px} .rowline{display:flex;justify-content:space-between;gap:10px;font-size:14px;border-top:1px solid var(--line);padding-top:6px}
.scene{background:var(--coffee-soft);border:1.5px solid var(--coffee);border-radius:14px;padding:14px;margin-bottom:12px}
.picker{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin:8px 0 4px}
.step{width:48px;height:48px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:800 22px var(--font);cursor:pointer}
.big{text-align:center;font-size:36px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.big small{font-size:15px;font-weight:600;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--teal)}
.tbl-wrap{overflow-x:auto} table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap} th{font-size:12px;color:var(--muted);text-transform:uppercase} th:first-child,td:first-child{text-align:left}
tr.best td{font-weight:800;color:var(--good)}
svg.chart{width:100%;height:auto;display:block} svg.chart text{fill:var(--muted);font:600 11px var(--font)} svg.chart text.strong{fill:var(--ink);font-weight:800}
.timer{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:-4px 0 12px} .timer i{display:block;height:100%;background:var(--gold);transition:width 1s linear}
/* sheets */
.overlay{position:fixed;inset:0;z-index:10;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:18px;width:100%;max-width:528px;max-height:85vh;overflow:auto}
.who{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.who .face{font-size:32px;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--gold-soft);border:2px solid var(--gold);flex:0 0 auto}
.who b{display:block}
.frame{position:fixed;inset:0;z-index:9;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.frame .fbar{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px max(16px,env(safe-area-inset-left,0px));border-bottom:1.5px solid var(--line)}
.frame iframe{flex:1;border:0;width:100%;background:var(--bg)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 110px);transform:translateX(-50%);z-index:12;background:var(--ink);color:var(--bg);font-weight:700;border-radius:12px;padding:10px 16px;max-width:calc(100% - 32px);text-align:center;font-size:15px}
.loading{padding:40px 0;text-align:center}
.login{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.lg-card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:22px;width:100%;max-width:400px;display:grid;gap:8px}
.lg-card label{font-size:13px;font-weight:700;color:var(--muted);margin-top:6px}
.lg-card input{font:600 17px var(--font);color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
.lg-card input:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.lg-card .btn{margin-top:8px}
/* Version 3: battle map */
.hexwrap{background:var(--ground-a);padding:4px}
svg.hexmap{display:block;width:100%;height:auto;max-width:520px;margin:0 auto}
svg.hexmap .hex{cursor:pointer} svg.hexmap .hex.locked{opacity:.45}
svg.hexmap .hex:focus-visible path{stroke:var(--gold);stroke-width:4}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin:6px 2px 0;color:var(--muted)}
.tabs{display:flex;gap:6px;margin:4px 0 8px} .tabs button{flex:1;font:700 14px var(--font);border:1.5px solid var(--line);background:var(--card);color:var(--muted);border-radius:10px;padding:8px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.mini{padding:3px 9px;font-size:13px;border-width:1.5px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px} .form label{display:grid;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
.form select{font:600 15px var(--font);color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:8px}
.evbanner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--gold-soft);border:1.5px solid var(--gold);border-radius:12px;padding:8px 10px;margin:0 0 8px;font-size:14px;font-weight:600}
.evbanner .btn{flex:0 0 auto;padding:7px 12px;font-size:14px}
.rowline.me{font-weight:800;color:var(--good)}
td.who-cell{white-space:nowrap;line-height:1.25} .card td,.card th{padding:6px 4px} .arcard{padding:14px}
@media (max-width:370px){.arcard{padding:10px} .arcard td,.arcard th{padding:5px 2px} td.who-cell .nm{max-width:5.6em} .btn.mini{padding:3px 6px}} td.who-cell .nm{display:inline-block;max-width:8em;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom} .lv{font-size:11px;color:var(--gold);font-weight:800}
</style>

(function(){

function fresh(){return {pos:0,best:{},xp:0,cap:500,inv:{hint:0,retry:0},owned:[],review:[],seen:[],npcs:[],nid:1,teacher:false,att:{},hist:[],updated:0,hide:false,epoch:0,resetSeen:0,badges:[],evDone:{}};}
function normalize(x){var f=fresh();if(!x||typeof x!=='object'||typeof x.pos!=='number'||x.pos>=N||x.pos<0)return f;
  Object.keys(f).forEach(function(k){if(x[k]===undefined||x[k]===null)x[k]=f[k];});if(!x.inv.hint)x.inv.hint=x.inv.hint||0;if(!x.inv.retry)x.inv.retry=x.inv.retry||0;return x;}
try{S=normalize(JSON.parse(localStorage.getItem(KEY)||'null'));}catch(e){S=fresh();}
function localSave(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function persist(){S.updated=Date.now();localSave();cloudSoon();}
// attempt log: every finished play of a landmark, replays included (best never goes down)
function logAttempt(id,score,stars){var a=S.att[id]||{n:0,best:0,last:0,stars:0};a.n++;a.last=score;a.best=Math.max(a.best,score);a.stars=Math.max(a.stars,stars);S.att[id]=a;
  S.hist.unshift({id:id,s:score,st:stars,t:Date.now()});if(S.hist.length>60)S.hist.length=60;}
function cleared(id){return (S.best[id]||0)>=1;}
function rankIndex(){var r=-1;WORLDS.forEach(function(_,i){if(cleared((i+1)+'.★'))r=i;});return r;}
function cafeStars(){try{var c=JSON.parse(localStorage.getItem('arena-cafe')||'{}')||{};if(c.r1>=1&&c.r2>=1)return Math.min(c.r1,c.r2);}catch(e){}return 0;}
function syncCafe(){var s=cafeStars();if(s>(S.best['2.5']||0)){var first=!cleared('2.5');S.best['2.5']=s;logAttempt('2.5',Math.round(s/3*100),s);if(first){S.xp+=20;S.cap+=200;toast(L('Qua mini game Chủ quán cà phê! +200k vốn','Cafe Owner cleared! +200k capital'));}persist();}}

function boardOpen(){return teacherAllowed()||!!(cloud.cfg&&cloud.cfg.showBoard);}
function summary(){var stars=0,cl=0;Object.keys(S.best).forEach(function(k){stars+=S.best[k];if(S.best[k]>=1)cl++;});return {stars:stars,cleared:cl};}
function cloudSoon(){if(cloud.mode!=='on')return;clearTimeout(cloud.timer);cloud.timer=setTimeout(cloudPush,1200);}
function cloudPush(){
  if(cloud.mode!=='on')return;if(cloud.saving){cloud.again=true;return;}cloud.saving=true;
  var sm=summary(),body={xp:S.xp,cap:S.cap,stars:sm.stars,cleared:sm.cleared,pos:S.pos,rank:rankIndex(),updated:S.updated,hide:!!S.hide,teacher:cloud.owner,
    missed:S.review.slice(-60),state:JSON.parse(JSON.stringify(S))};
  if(SHEETS){sheetsPush(body);return;}
  cloud.ref.set(body).then(function(){return cloud.db.doc('board/'+cloud.uid).set({xp:body.xp,stars:body.stars,cleared:body.cleared,hide:body.hide,teacher:body.teacher,updated:body.updated});}).then(function(){cloud.saving=false;cloud.last=Date.now();hud();if(cloud.again){cloud.again=false;cloudPush();}},
    function(e){cloud.saving=false;if(e&&e.code==='invalid_argument'){cloud.mode='readonly';}else if(e&&e.code==='quota_exceeded'){cloud.mode='readonly';toast(L('Bộ nhớ lớp đã đầy. Tiến độ chỉ lưu trên máy này.','The class storage is full. Progress is saved on this device only.'));}
      else if(e&&e.code==='unavailable'){setTimeout(cloudPush,2500+Math.random()*2000);}hud();});
}
function initCloud(){
  if(!window.claude||typeof window.claude.use!=='function')return;
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    var db=r[0],user=r[1];cloud.user=user;if(!user){hud();return;}
    return Promise.all([user.isOwner(),user.id()]).then(function(v){
      cloud.owner=v[0];cloud.uid=v[1];if(!db||!cloud.uid){hud();panel();return;}
      cloud.db=db;cloud.ref=db.doc('players/'+cloud.uid);EVDB=db;arSubscribe(db);
      db.collection('players').onSnapshot(function(snap){cloud.players=snap.docs.map(function(d){var x=d.data()||{};return {id:d.id,xp:x.xp||0,stars:x.stars||0,cleared:x.cleared||0,pos:x.pos||0,rank:x.rank,updated:x.updated||0,hide:!!x.hide,teacher:!!x.teacher,test:!!x.test,label:typeof x.label==='string'?x.label:'',missed:x.missed||[],att:(x.state&&x.state.att)||{},hist:(x.state&&x.state.hist)||[],best:(x.state&&x.state.best)||{}};});
        if(sheetMode==='board')renderBoard();if(P&&P.kind==='dash')renderDash();hud();},function(){});
      db.collection('board').onSnapshot(function(snap){cloud.board=snap.docs.map(function(d){var x=d.data()||{};return {id:d.id,xp:x.xp||0,stars:x.stars||0,cleared:x.cleared||0,hide:!!x.hide,teacher:!!x.teacher,test:!!x.test,label:typeof x.label==='string'?x.label:''};});
        if(sheetMode==='board')renderBoard();},function(){});
      try{db.doc('class/config').onSnapshot(function(snap){cloud.cfg=snap.exists?(snap.data()||{}):{};applyConfig();panel();if(sheetMode==='board')renderBoard();if(P&&P.kind==='dash')renderDash();},function(){});}catch(e){}
      return db.doc('class/config').get().then(function(c){cloud.cfg=c.exists?(c.data()||{}):{};applyConfig();return cloud.ref.get();}).then(function(mine){
        if(mine.exists){var d=mine.data();cloud.mode='on';
          if(d.state&&(d.state.updated||0)>(S.updated||0)){S=normalize(JSON.parse(JSON.stringify(d.state)));localSave();toast(L('Đã tải tiến độ của bạn từ lớp.','Loaded your progress from the class.'));}
          else cloudPush();
        }else{
          return db.collection('board').get().then(function(all){
            var seats=all.docs.filter(function(x){var b=x.data()||{};return !b.teacher&&!b.test;}).length;
            if(!cloud.owner&&seats>=SEATS){cloud.mode='full';toast(L('Lớp demo đã đủ '+SEATS+' chỗ. Bạn vẫn chơi được, tiến độ lưu trên máy này.','The demo class is full ('+SEATS+' seats). You can still play; progress stays on this device.'));}
            else{cloud.mode='on';cloudPush();}
          });
        }
      }).then(function(){renderMap();});
    });
  }).catch(function(){hud();});
}
// RESET: the owner writes class/config {epoch, resets:{uid:time}} and deletes the player docs.
// Every device compares it with its own save, so old local progress cannot come back.
function needsReset(){var c=cloud.cfg||{},mine=(c.resets||{})[cloud.uid]||0;return !cloud.owner&&((c.epoch||0)>(S.epoch||0)||mine>(S.resetSeen||0));}
function applyConfig(){if(!needsReset())return;if(P){cloud.pendingReset=true;return;}doReset();}
function doReset(){var c=cloud.cfg||{};S=fresh();S.epoch=c.epoch||0;S.resetSeen=(c.resets||{})[cloud.uid]||0;S.updated=Date.now();localSave();cloud.pendingReset=false;
  if(cloud.mode==='on')cloudPush();renderMap();follow(0);toast(L('Giáo viên đã đặt lại tiến độ. Bắt đầu lại từ xe đẩy cà phê!','Your teacher reset the progress. Back to the coffee cart!'));}
function writeConfig(patch){if(SHEETS)return api('setConfig',{patch:patch}).then(function(res){if(res.ok)cloud.cfg=res.cfg;});var cfg=Object.assign({},cloud.cfg||{},patch);cloud.cfg=cfg;return cloud.db.doc('class/config').set(cfg);}
function deleteSeq(ids){return ids.reduce(function(pr,id){return pr.then(function(){return cloud.db.doc('players/'+id).delete();}).then(function(){return cloud.db.doc('board/'+id).delete();});},Promise.resolve());}
function resetPlayer(uid){if(SHEETS)return api('reset',{id:uid}).then(function(res){if(res.ok){cloud.cfg=res.cfg;toast(L('Đã đặt lại người chơi.','Player reset.'));}return sheetsDash();});var c=cloud.cfg||{},r=Object.assign({},c.resets||{});r[uid]=Date.now();
  return writeConfig({resets:r}).then(function(){return deleteSeq([uid]);}).then(function(){toast(L('Đã đặt lại người chơi.','Player reset.'));},function(){toast(L('Không đặt lại được. Thử lại sau.','Could not reset. Try again later.'));});}
function resetAll(){if(SHEETS)return api('reset',{all:true}).then(function(res){if(res.ok){cloud.cfg=res.cfg;toast(L('Đã đặt lại toàn bộ lớp.','The whole class was reset.'));}return sheetsDash();});var c=cloud.cfg||{},ids=cloud.players.concat(cloud.board).filter(function(p){return !p.teacher;}).map(function(p){return p.id;}).filter(function(id,i,a){return a.indexOf(id)===i;});
  return writeConfig({epoch:(c.epoch||0)+1,resets:{}}).then(function(){return deleteSeq(ids);}).then(function(){toast(L('Đã đặt lại toàn bộ lớp.','The whole class was reset.'));},function(){toast(L('Không đặt lại được. Thử lại sau.','Could not reset. Try again later.'));});}
function pname(p,ps){return p.label||(ps[p.id]&&ps[p.id].name)||L('Học viên','Student');}
function openDash(){if(!teacherAllowed())return;closeSheet();P={kind:'dash',sel:null,confirm:null,xp:0,node:{id:'',name:V('','')}};openPlay();renderDash();if(SHEETS)sheetsDash();}
function renderDash(){
  var list=cloud.players.filter(function(p){return !p.teacher;}).sort(function(a,b){return b.xp-a.xp;}),ids=list.map(function(p){return p.id;});
  el('play-title').innerHTML=L('Bảng điều khiển lớp','Class dashboard');el('play-hud').innerHTML='';
  names(ids,function(ps){
    if(!P||P.kind!=='dash')return;
    var real=list.filter(function(p){return !p.test&&!p.waiting;}),day=Date.now()-864e5,h='';
    var avg=function(f){return real.length?Math.round(real.reduce(function(a,p){return a+f(p);},0)/real.length):0;};
    h+='<div class="kpis" style="grid-template-columns:repeat(4,1fr)"><div class="kpi"><span>'+L('Học viên','Students')+'</span><b>'+real.length+'/'+(cloud.seats||SEATS)+'</b></div><div class="kpi"><span>'+L('XP TB','Avg XP')+'</span><b>'+avg(function(p){return p.xp;})+'</b></div><div class="kpi"><span>'+L('Mốc TB','Avg stops')+'</span><b>'+avg(function(p){return p.cleared;})+'</b></div><div class="kpi"><span>'+L('Chơi 24h','Active 24h')+'</span><b>'+real.filter(function(p){return p.updated>day;}).length+'</b></div></div>';
    if(cloud.db)h+='<label class="small" style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" id="showboard"'+(cloud.cfg&&cloud.cfg.showBoard?' checked':'')+'> '+L('Cho học viên xem bảng xếp hạng lớp (XP, sao; tên ẩn được)','Let students see the class leaderboard (XP and stars; names can be hidden)')+'</label>';
    if(!cloud.db)h+='<p class="fb hint">'+L('Bảng điều khiển cần mở game trong claude.ai.','The dashboard needs the game opened in claude.ai.')+'</p>';
    if(!list.length)h+='<div class="card" style="margin-top:12px"><p class="muted">'+L('Chưa có người chơi nào. Mời học viên làm Biên tập viên (Editor) qua email; họ sẽ xuất hiện ở đây sau khi mở game.','No players yet. Invite students by email as Editors; they appear here once they open the game.')+'</p></div>';
    else{
      h+='<div class="card" style="margin-top:12px;padding:12px"><div class="tbl-wrap"><table><thead><tr><th>'+L('Người chơi','Player')+'</th><th>XP</th><th>★</th><th>'+L('Mốc','Stops')+'</th><th>'+L('Đang ở','At')+'</th><th>'+L('Lượt','Plays')+'</th><th>'+L('Hoạt động','Active')+'</th><th></th></tr></thead><tbody>';
      list.forEach(function(p){var plays=0;Object.keys(p.att).forEach(function(k){plays+=p.att[k].n||0;});
        h+='<tr'+(P.sel===p.id?' class="best"':'')+'><td><button class="btn ghost" style="padding:4px 8px;font-size:13px" data-act="dsel" data-id="'+esc(p.id)+'">'+esc(pname(p,ps))+(p.test?' · TEST':'')+(p.waiting?' · '+L('chưa chơi','not started'):'')+'</button></td><td>'+p.xp+'</td><td>'+p.stars+'</td><td>'+p.cleared+'/'+N+'</td><td>'+(NODES[p.pos]?NODES[p.pos].id:'—')+'</td><td>'+plays+'</td><td>'+ago(p.updated)+'</td><td>'+(p.waiting?'':'<button class="btn ghost" style="padding:4px 8px;font-size:13px" data-act="dreset" data-id="'+esc(p.id)+'">'+(P.confirm===p.id?L('Chắc chắn?','Sure?'):L('Đặt lại','Reset'))+'</button>')+'</td></tr>';});
      h+='</tbody></table></div></div>';
      var sp=list.filter(function(p){return p.id===P.sel;})[0];
      if(sp){h+='<div class="card" style="margin-top:12px"><span class="tag">'+esc(pname(sp,ps))+'</span><p class="small muted">'+L('Số sao ở từng mốc (hàng = chương; 0 = đã chơi chưa qua)','Stars at each stop (row = chapter; 0 = played, not cleared)')+'</p><div class="tbl-wrap"><table><thead><tr><th>Ch.</th><th>.1</th><th>.2</th><th>.3</th><th>.4</th><th>'+L('NV','Msn')+'</th><th>★</th></tr></thead><tbody>';
        WORLDS.forEach(function(_,wi){h+='<tr><td>C'+(wi+1)+'</td>';[1,2,3,4,5,'★'].forEach(function(k){var id=(wi+1)+'.'+k,b=sp.best[id]||0,a=sp.att[id];h+='<td title="'+id+'">'+(b?'★'.repeat(b):(a?'0':'·'))+'</td>';});h+='</tr>';});
        h+='</tbody></table></div>';
        if(sp.hist.length){h+='<p class="eyebrow" style="margin:12px 0 4px">'+L('Lượt chơi gần đây','Recent plays')+'</p>';sp.hist.slice(0,10).forEach(function(x){var nd=NODES.filter(function(n){return n.id===x.id;})[0];h+='<div class="rowline"><span>'+esc(x.id)+' · '+esc(nd?tx(nd.name):'')+' · '+ago(x.t)+'</span><b>'+x.s+'% '+'★'.repeat(x.st)+'</b></div>';});}
        h+='</div>';}
      var miss={};real.forEach(function(p){p.missed.forEach(function(id){miss[id]=(miss[id]||0)+1;});});
      var top=Object.keys(miss).sort(function(a,b){return miss[b]-miss[a];}).slice(0,10);
      if(top.length){h+='<div class="card" style="margin-top:12px"><p class="eyebrow" style="margin:0 0 6px">'+L('Câu nhiều học viên đang sai','Questions most students are missing')+'</p>';
        top.forEach(function(id){var q=Bank&&Bank.text(id);if(q)h+='<div class="rowline"><span>'+q.st+' · '+esc(q.q.length>120?q.q.slice(0,120)+'…':q.q)+'</span><b>'+miss[id]+'</b></div>';});h+='</div>';}
    }
    el('play-body').innerHTML=h;
    el('play-bar').innerHTML='<button class="btn ghost" data-act="quit">'+L('Đóng','Close')+'</button>'+(SHEETS?'<button class="btn ghost" data-act="drefresh">↻</button>':'')+(list.length?'<button class="btn ghost" data-act="csv">CSV</button><button class="btn" style="background:var(--bad);border-color:var(--bad)" data-act="dresetall">'+(P.confirm==='all'?L('Bấm lần nữa để xóa hết','Tap again to reset all'):L('Đặt lại tất cả','Reset all'))+'</button>':'');
  });
}

function cloudPill(){
  if(cloud.mode==='on')return '☁ '+L('Đã lưu vào lớp','Saved to class');
  if(cloud.mode==='offline')return L('Mất kết nối · lưu trên máy','Offline · saved on device');
  if(cloud.mode==='full')return L('Lớp đủ chỗ · lưu trên máy','Class full · saved on device');
  if(cloud.mode==='readonly'||(cloud.user&&!cloud.db))return L('Chỉ xem · lưu trên máy','View only · saved on device');
  return L('Lưu trên máy này','Saved on this device');
}
function ago(t){if(!t)return '—';var m=Math.round((Date.now()-t)/60000);return m<1?L('vừa xong','just now'):m<60?m+L(' phút trước',' min ago'):m<1440?Math.round(m/60)+L(' giờ trước',' h ago'):Math.round(m/1440)+L(' ngày trước',' d ago');}
function names(ids,cb){if(SHEETS){var m={};ids.forEach(function(id){m[id]={name:cloud.nameMap[id]||''};});cb(m);return;}if(!cloud.user||!ids.length){cb({});return;}cloud.user.profiles(ids).then(cb,function(){cb({});});}
function renderBoard(){
  if(!boardOpen()){el('sheet').innerHTML='<div class="who"><div class="face" aria-hidden="true">🏆</div><div><b>'+L('Bảng xếp hạng lớp','Class leaderboard')+'</b></div></div><p class="muted">'+L('Giáo viên chưa mở bảng xếp hạng.','Your teacher has not opened the leaderboard.')+'</p><div class="acts"><button class="btn" data-act="closesheet">'+L('Đóng','Close')+'</button></div>';return;}
  var list=cloud.board.filter(function(p){return !p.teacher;}).sort(function(a,b){return b.xp-a.xp;}),me=cloud.uid,h='';
  h+='<div class="who"><div class="face" aria-hidden="true">🏆</div><div><b>'+L('Bảng xếp hạng lớp','Class leaderboard')+'</b><span class="muted small">'+list.filter(function(p){return !p.test;}).length+'/'+(cloud.seats||SEATS)+L(' chỗ đã dùng',' seats used')+' · '+cloudPill()+'</span></div></div>';
  if(!cloud.db)h+='<p class="fb hint">'+L('Bảng xếp hạng cần mở game trong claude.ai bằng tài khoản được mời.','The leaderboard needs the game opened in claude.ai with an invited account.')+'</p>';
  else if(!list.length)h+='<p class="muted">'+L('Chưa có ai trong lớp. Qua một chặng để lên bảng.','Nobody has joined yet. Clear a stage to appear here.')+'</p>';
  else{h+='<div class="tbl-wrap"><table><thead><tr><th>#</th><th>'+L('Người chơi','Player')+'</th><th>XP</th><th>★</th><th>'+L('Mốc','Stops')+'</th></tr></thead><tbody>';
    list.forEach(function(p,i){h+='<tr'+(p.id===me?' class="best"':'')+'><td>'+(i+1)+'</td><td data-name="'+esc(p.id)+'" data-hide="'+(p.hide&&p.id!==me?1:0)+'">'+(p.id===me?L('Bạn','You'):'…')+'</td><td>'+p.xp+'</td><td>'+p.stars+'</td><td>'+p.cleared+'/'+N+'</td></tr>';});
    h+='</tbody></table></div>';}
  if(cloud.mode==='on')h+='<label class="small" style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" id="hide-me"'+(S.hide?' checked':'')+'> '+L('Ẩn tên tôi với các bạn khác','Hide my name from other students')+'</label>';
  h+='<div class="acts" style="margin-top:12px">'+(teacherAllowed()?'<button class="btn ghost" data-act="teacherboard">📊 '+L('Bảng điều khiển','Dashboard')+'</button>':'')+'<button class="btn" data-act="closesheet">'+L('Đóng','Close')+'</button></div>';
  el('sheet').innerHTML=h;fillNames();
}
function fillNames(){var cells=[].slice.call(el('sheet').querySelectorAll('[data-name]')),ids=cells.map(function(c){return c.dataset.name;});
  names(ids,function(ps){cells.forEach(function(c){var id=c.dataset.name;if(id===cloud.uid&&!teacherAllowed()){c.textContent=L('Bạn','You');return;}
    var pl=cloud.board.concat(cloud.players).filter(function(p){return p.id===id;})[0];
    c.textContent=c.dataset.hide==='1'?L('Ẩn danh','Anonymous'):((pl&&pl.label)||(ps[id]&&ps[id].name)||L('Học viên','Student'))+(pl&&pl.test?' · TEST':'');});});}
function exportCsv(){
  var list=cloud.players.filter(function(p){return !p.teacher;}),ids=list.map(function(p){return p.id;});
  names(ids,function(ps){
    var cols=['student','xp','stars','stops_cleared','current_stop'].concat(NODES.map(function(n){return 'stars_'+n.id;})),rows=[cols.join(',')];
    list.forEach(function(p){var r=[pname(p,ps)+(p.test?' (TEST)':''),p.xp,p.stars,p.cleared,NODES[p.pos]?NODES[p.pos].id:''];
      NODES.forEach(function(n){r.push(p.att[n.id]?p.att[n.id].stars:0);});
      rows.push(r.map(function(v){v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(','));});
    saveFile('economics-arena-class.csv','\ufeff'+rows.join('\n'));
  });
}

/* ================= SHEETS BACKEND (free web release): name + code login against the class Google Sheet =================
   Active when config.js sets window.ARENA_API to the Apps Script /exec URL; otherwise the claude.ai runtime is used. */
var API=String(window.ARENA_API||'').trim(),SHEETS=!!API;
if(SHEETS)cloud.runtime=true;
cloud.nameMap={};
var sess=null;try{sess=JSON.parse(localStorage.getItem('arena-session')||'null');}catch(e){}
function saveSess(){try{localStorage.setItem('arena-session',JSON.stringify(sess));}catch(e){}}
function takeWt(res){if(sess&&res&&res.wt&&res.wt!==sess.wt){sess.wt=res.wt;saveSess();}}
function api(action,data){return fetch(API,{method:'POST',body:JSON.stringify(Object.assign({action:action,token:sess&&sess.token},data||{}))}).then(function(r){return r.json();});}
function sheetsStart(res){
  takeWt(res);cloud.owner=sess.role==='teacher';cloud.uid=sess.id;cloud.db={sheets:true};arWebStart();cloud.bankInfo=res.bankInfo||cloud.bankInfo||null;cloud.cfg=res.cfg||{};cloud.seats=res.seats;cloud.mode='on';cloud.nameMap[sess.id]=sess.name;
  if(S.uid&&S.uid!==sess.id)S=fresh();          // a different person's save on this device
  var st=res.state;
  if(st&&(st.updated||0)>(S.updated||0))S=normalize(st);
  S.uid=sess.id;localSave();
  if(needsReset())doReset();else cloudPush();
  renderMap();
}
function sheetsInit(){
  if(!sess){showLogin();return;}
  api('hello').then(function(res){
    if(!res.ok){if(res.error==='auth')logout(true);else{cloud.mode='offline';hud();}return;}
    sheetsStart(res);
  },function(){cloud.mode='offline';hud();toast(L('Không kết nối được máy chủ lớp. Tiến độ lưu tạm trên máy này.','Cannot reach the class server. Progress is kept on this device for now.'));});
}
function showLogin(msg){
  var o=el('login');o.hidden=false;document.body.classList.add('locked');
  el('lg-err').textContent=msg||'';el('lg-err').hidden=!msg;
  el('lg-title').textContent=L('Đăng nhập vào lớp','Sign in to your class');
  el('lg-sub').textContent=L('Nhập tên và mã giáo viên đã cấp cho bạn.','Enter the name and code your teacher gave you.');
  el('lg-name-l').textContent=L('Họ và tên','Full name');el('lg-code-l').textContent=L('Mã đăng nhập','Login code');
  el('lg-go').textContent=L('Vào lớp','Enter class');
  setTimeout(function(){try{el('lg-name').focus();}catch(e){}},50);
}
function doLogin(){
  var name=el('lg-name').value.trim(),code=el('lg-code').value.trim(),btn=el('lg-go');
  if(!name||!code){showLogin(L('Hãy nhập cả tên và mã.','Enter both your name and code.'));return;}
  btn.disabled=true;btn.textContent=L('Đang kiểm tra…','Checking…');
  api('login',{name:name,code:code}).then(function(res){
    btn.disabled=false;
    if(!res.ok){showLogin(res.error==='locked'?L('Sai quá nhiều lần. Thử lại sau 10 phút.','Too many wrong tries. Try again in 10 minutes.'):L('Tên hoặc mã chưa đúng. Kiểm tra lại với giáo viên.','That name or code is not right. Check with your teacher.'));return;}
    sess={token:res.token,id:res.me.id,name:res.me.name,role:res.me.role,wt:res.wt||''};saveSess();
    el('lg-code').value='';el('login').hidden=true;document.body.classList.remove('locked');
    sheetsStart(res);toast(L('Xin chào, ','Welcome, ')+res.me.name+'!');
  },function(){btn.disabled=false;showLogin(L('Không kết nối được máy chủ. Kiểm tra mạng và thử lại.','Cannot reach the server. Check your connection and try again.'));});
}
function logout(expired){
  sess=null;try{localStorage.removeItem('arena-session');localStorage.removeItem(KEY);}catch(e){}
  arWebStop();

/* ================= BANK HELPERS ================= */
/* ================= QUESTION SOURCE =================
   Local: bank.js + bankcore.js in the page (claude.ai build); answer keys kept in this closure.
   Remote: the web release — no bank in the page; the Google server picks questions and checks answers.
   Fast (Release 2): config.js also sets window.ARENA_FAST to a Cloudflare Worker that picks and checks in ~0.2 s.
   The Worker returns each answer key sealed (unreadable here); this closure keeps the sealed keys per play. */
var FAST=SHEETS?String(window.ARENA_FAST||'').trim():'';
function fastCall(action,data,again){
  return fetch(FAST,{method:'POST',body:JSON.stringify(Object.assign({action:action,wt:sess&&sess.wt},data||{}))}).then(function(r){return r.json();}).then(function(res){
    // pass expired or position out of date (a save still in flight) → fetch a fresh pass from the Sheet once, then retry
    if(!again&&sess&&(res.error==='wauth'||res.error==='locked'))return api('hello').then(function(h){
      if(h.ok&&h.wt){takeWt(h);return fastCall(action,data,true);}return h.error==='auth'?{ok:false,error:'auth'}:res;},function(){return res;});
    if(res.error==='wauth')res.error='auth';return res;});
}
var Bank=(function(){
  if(window.ARENA_BANK&&window.BankCore&&!SHEETS){
    var keys={},seq=0,items=window.ARENA_BANK.items,vocab=window.ARENA_BANK.vocab;
    var put=function(k){var id='p'+(++seq);keys[id]=k;return id;};
    var done=function(x){return Promise.resolve(x.error?{ok:false,error:x.error}:Object.assign({ok:true},x));};
    var byId={};items.forEach(function(q){byId[q.id]=q;});
    return {local:true,
      stage:function(node){var s=BankCore.stage(items,vocab,node);return done({play:put(s.key),tasks:s.pub});},
      check:function(play,i,ans){return done(keys[play]&&keys[play][i]?BankCore.check(keys[play][i],ans):{error:'expired'});},
      hint:function(play,i){return done(keys[play]&&keys[play][i]?BankCore.hint(keys[play][i],2):{error:'expired'});},
      boss:function(node){var s=BankCore.boss(items,node);return done({play:put(s.key),qs:s.pub});},
      bossCheck:function(play,i,ans){return done(keys[play]&&keys[play][i]?BankCore.single(keys[play][i],ans):{error:'expired'});},
      npc:function(o){var s=BankCore.npc(items,o);return done({play:put(s.key),q:s.pub});},
      duel:function(maxCh){var s=BankCore.duel(items,{maxCh:maxCh,n:5});return done({play:put(s.key),qs:s.pub});},
      npcHint:function(play){return done(keys[play]?BankCore.hint(keys[play],1):{error:'expired'});},
      npcCheck:function(play,ans){return done(keys[play]?BankCore.single(keys[play],ans):{error:'expired'});},
      info:function(){return {n:items.length,news:items.filter(function(q){return q.src==='v1_new';}).length,vocab:vocab.length};},
      text:function(id){return byId[id]||null;}};
  }
  if(FAST){
    var fk={},fseq=0,fput=function(ks){var id='f'+(++fseq);fk[id]=ks;return id;};
    var start=function(action,data,one){return fastCall(action,data).then(function(res){if(res.ok){res.play=fput(one?[res.key]:res.keys);delete res.keys;delete res.key;}return res;});};
    var use=function(play,i,action,data){var ks=fk[play];if(!ks||!ks[i])return Promise.resolve({ok:false,error:'expired'});
      return fastCall(action,Object.assign({key:ks[i]},data)).then(function(res){if(res.key){ks[i]=res.key;delete res.key;}return res;});};
    return {local:false,fast:true,
      stage:function(node){return start('stage',{node:node});},
      check:function(play,i,ans){return use(play,i,'check',{answer:ans});},
      hint:function(play,i){return use(play,i,'hint',{});},
      boss:function(node){return start('boss',{node:node});},
      bossCheck:function(play,i,ans){return fk[play]?use(play,i,'bossCheck',{answer:ans}):api('bossCheck',{play:play,i:i,answer:ans});},   // not ours = a duel the Sheet dealt
      npc:function(o){return start('npc',o,true);},
      // a Worker still on Release 2 has no duel → ask the Sheet instead
      duel:function(maxCh){return start('duel',{maxCh:maxCh}).then(function(res){return res.error==='bad_request'?api('duel',{maxCh:maxCh}):res;});},
      npcHint:function(play){return use(play,0,'npcHint',{});},
      npcCheck:function(play,ans){return use(play,0,'npcCheck',{answer:ans});},
      info:function(){return cloud.bankInfo||null;},
      text:function(id){return (cloud.missedText||{})[id]||null;}};
  }
  if(SHEETS)return {local:false,
    stage:function(node){return api('stage',{node:node});},
    check:function(play,i,ans){return api('check',{play:play,task:i,answer:ans});},
    hint:function(play,i){return api('hint',{play:play,task:i});},
    boss:function(node){return api('boss',{node:node});},
    bossCheck:function(play,i,ans){return api('bossCheck',{play:play,i:i,answer:ans});},
    npc:function(o){return api('npc',o);},
    duel:function(maxCh){return api('duel',{maxCh:maxCh});},
    npcHint:function(play){return api('npcHint',{play:play});},
    npcCheck:function(play,ans){return api('npcCheck',{play:play,answer:ans});},
    info:function(){return cloud.bankInfo||null;},
    text:function(id){return (cloud.missedText||{})[id]||null;}};
  return null;
})();

var VW=360,GAP=118,PADB=90,PADT=205,AVY=42,H=PADT+PADB+(N-1)*GAP;

function cy(t){return H-PADB-t*GAP;}
function lanesAt(t){return WORLDS[Math.max(0,Math.min(WORLDS.length-1,Math.floor((t+0.5)/6)))].lanes;}
function roadW(n){return 30+16*n;}
function rng(s){var x=Math.sin(s*999.13)*43758.5453;return x-Math.floor(x);}
function worldNow(){return NODES[S.pos].w;}
var lastLook=null;
function draw(){
  var svg=el('road'),s='',W=VW;
  svg.setAttribute('viewBox','0 0 '+W+' '+H);svg.setAttribute('aria-label',L('Bản đồ con đường kinh doanh','Business road map'));
  WORLDS.forEach(function(w,wi){var y1=cy(wi*6-0.5),y2=wi===WORLDS.length-1?0:cy(wi*6+5.5);s+='<rect x="0" y="'+Math.min(y1,y2)+'" width="'+W+'" height="'+Math.abs(y1-y2)+'" fill="'+(wi%2?'var(--ground-b)':'var(--ground-a)')+'"/>';});
  for(var i=0;i<N;i++){var w=NODES[i].w,count=1+Math.floor(w/2);
    for(var b=0;b<count;b++){var side=(i+b)%2?1:-1,t=i+rng(i*7+b)*0.9-0.45,bh=14+w*8+rng(i*3+b)*18,bw=16+rng(i+b*5)*14;
      var edge=cx(t)+side*(roadW(lanesAt(t))/2+12+b*4),x=side>0?edge+rng(i*11+b)*20:edge-bw-rng(i*11+b)*20;
      if(x<2||x+bw>W-2)continue;s+='<rect x="'+x.toFixed(1)+'" y="'+(cy(t)-bh).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="2" fill="'+(b%2?'var(--bldg-2)':'var(--bldg)')+'"/>';}}
  WORLDS.forEach(function(wd,wi){
    var t0=Math.max(-0.6,wi*6-0.5),t1=wi===WORLDS.length-1?N-1+1.6:wi*6+5.5,d='',rw=roadW(wd.lanes);

function spawnAhead(){
  var w=worldNow(),lanes=WORLDS[w].lanes,max=lanes+1+(has('sign')?1:0),p=0.35+0.04*w+(has('sign')?0.15:0);
  for(var k=0;k<lanes+(has('sign')?1:0);k++){
    if(S.npcs.length>=max)break;if(Math.random()>p)continue;
    var type,r=Math.random();
    if(S.review.length&&r<0.35)type='professor';
    else if(w>=NPC.investor.from&&r>=0.94)type='investor';
    else{var ts=Object.keys(NPC).filter(function(k){return NPC[k].from<=w&&!NPC[k].rare;});type=ts[Math.floor(Math.random()*ts.length)];}
    var t=Math.min(N-1,S.pos+0.2+Math.random()*1.8),Ln=lanesAt(t),rw=roadW(Ln),lane=Math.floor(Math.random()*Ln),dx=-rw/2+rw*(lane+0.5)/Ln;
    if(Ln===1)dx=(Math.random()<0.5?-1:1)*(rw/2+16);
    S.npcs.push({id:S.nid++,type:type,t:t,dx:dx});
  }
}

function openNpc(id){

  var T=NPC[talk.npc.type],q=talk.q,done=talk.correct!==null,h='<div class="who"><div class="face" aria-hidden="true">'+T.face+'</div><div><b>'+tx(T.name)+'</b><span class="muted small">'+tx(T.line)+'</span></div></div>';

    h+='<div class="acts">'+(S.inv.hint>0&&talk.removed===null&&!talk.busy?'<button class="btn ghost" data-act="usehint">💡 '+L('Dùng thẻ gợi ý','Use a hint card')+' ('+S.inv.hint+')</button>':'')+'<button class="btn ghost" data-act="closesheet">'+L('Để sau','Later')+'</button></div>';}
  el('sheet').innerHTML=h;

function npcAnswer(i){
  if(!talk||!talk.q||talk.busy||talk.correct!==null)return;var me=talk,q=talk.q,T=NPC[talk.npc.type];talk.pick=i;talk.busy=true;talk.err='';renderTalk();
  Bank.npcCheck(talk.play,i).then(function(res){
    if(talk!==me)return;talk.busy=false;if(!res.ok){talk.err=bankError(res);talk.pick=null;renderTalk();return;}
    talk.correct=res.correct;talk.e=res.e||'';if(S.seen.indexOf(q.qid)<0)S.seen.push(q.qid);if(S.seen.length>400)S.seen=S.seen.slice(-400);

    S.npcs=S.npcs.filter(function(x){return x.id!==talk.npc.id;});persist();renderTalk();hud();draw();
  },function(){if(talk!==me)return;talk.busy=false;talk.pick=null;talk.err=bankError(netFail());renderTalk();});
}
function npcHint(){
  if(!talk||!talk.q||talk.busy||S.inv.hint<=0||talk.removed!==null)return;var me=talk;talk.busy=true;renderTalk();
  Bank.npcHint(talk.play).then(function(res){if(talk!==me)return;talk.busy=false;if(res.ok&&res.remove.length){talk.removed=res.remove[0];S.inv.hint--;persist();}renderTalk();},function(){if(talk===me){talk.busy=false;renderTalk();}});
}

var walking=false;
function walk(){
  if(walking||S.pos>=N-1||!cleared(NODES[S.pos].id))return;walking=true;
  var from=S.pos,to=S.pos+1,start=null,dur=matchMedia('(prefers-reduced-motion: reduce)').matches?1:900,av=el('avatar');av.classList.add('walking');
  function step(ts){if(start===null)start=ts;var k=Math.min(1,(ts-start)/dur),t=from+(to-from)*(k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2);
    av.setAttribute('transform','translate('+cx(t).toFixed(1)+' '+(cy(t)-AVY).toFixed(1)+')');follow(t);
    if(k<1)requestAnimationFrame(step);else{S.pos=to;walking=false;S.npcs=S.npcs.filter(function(n){return n.t>=S.pos-0.5;});spawnAhead();persist();renderMap();}}
  requestAnimationFrame(step);
}
function follow(t){var r=el('road').getBoundingClientRect(),sc=r.width/VW;window.scrollTo(0,Math.max(0,r.top+window.scrollY+cy(t)*sc-window.innerHeight*0.55));}

function openPlay(){document.body.classList.add('locked');el('play').hidden=false;el('play').scrollTop=0;}
function closePlay(){stopTimer();P=null;el('play').hidden=true;document.body.classList.remove('locked');if(cloud.pendingReset&&needsReset())doReset();else renderMap();}
function playHud(extra){el('play-hud').innerHTML='<span class="pill xp">'+(P?P.xp:0)+' XP</span>'+(extra||'');}
function starSvg(on){return '<svg viewBox="0 0 24 24" class="'+(on?'on':'off')+'" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/></svg>';}
function starRow(n){return '<div class="stars" role="img" aria-label="'+n+'/3">'+starSvg(n>=1)+starSvg(n>=2)+starSvg(n>=3)+'</div>';}
function starsPct(p){return p>=95?3:p>=80?2:p>=60?1:0;}
function starsRatio(r){return r>=0.95?3:r>=0.85?2:r>=0.70?1:0;}
function award(node,stars,cap,score){
  var first=!cleared(node.id);logAttempt(node.id,score,stars);
  if(stars>(S.best[node.id]||0))S.best[node.id]=stars;
  if(stars>=1&&first){S.cap+=has('solar')?Math.round(cap*1.25):cap;}
  persist();return first&&stars>=1;
}

/* ---------- stage ---------- */
function startStage(node){
  P={node:node,kind:'stage',tasks:null,i:0,xp:0,results:[],busy:false};openPlay();playLoading(node.id+' · '+tx(node.name));
  var me=P;Bank.stage(node.id).then(function(res){if(P!==me)return;if(!res.ok){playFail(res);return;}P.play=res.play;P.tasks=res.tasks;startTask();renderStage();},function(){if(P===me)playFail(netFail());});
}
function startTask(){var t=P.tasks[P.i];P.t={attempt:1,phase:'answer',hinted:false,removed:[],sel:null,ans:t.items?t.items.map(function(){return null;}):null,link:{},pickL:null,wrong:[],final:null,reveal:null,e:''};}
function taskTag(t){return t.type==='mc'?L('Trắc nghiệm','Multiple choice'):t.type==='tf'?L('Đúng hay sai','True or false'):L('Ghép thuật ngữ Việt ↔ Anh','Term match VI ↔ EN');}
function renderStage(){
  var t=P.tasks[P.i],s=P.t,locked=s.phase==='done',rv=s.reveal||{},h='';
  el('play-title').innerHTML=esc(P.node.id+' · '+tx(P.node.name));playHud();
  h+='<div class="dots" aria-hidden="true">';P.tasks.forEach(function(_,i){h+='<i class="'+(i<P.i||(i===P.i&&locked)?'done':i===P.i?'cur':'')+'"></i>';});h+='</div>';
  h+='<div class="card"><span class="tag">'+L('Nhiệm vụ ','Task ')+(P.i+1)+'/5 · '+taskTag(t)+'</span>'+(t.type!=='match'?viBadge():'');
  if(t.type==='mc'){
    h+='<h3 class="q">'+esc(t.q)+'</h3>';
    t.opts.forEach(function(o,i){var c='';
      if(s.removed.indexOf(i)>=0)c=' gone';
      else if(s.phase==='answer'){if(s.sel===i)c=' sel';}
      else if(s.phase==='wrong'){if(s.sel===i)c=' no';}
      else{if(i===rv.correct)c=' ok';else if(s.sel===i)c=' no';}
      h+='<button class="opt'+c+'" data-act="mc" data-i="'+i+'"'+(s.phase!=='answer'||P.busy?' disabled':'')+'>'+esc(o)+'</button>';});
  }else if(t.type==='tf'){
    h+='<h3 class="q">'+L('Mỗi nhận định dưới đây đúng hay sai?','Is each statement true or false?')+'</h3>';
    t.items.forEach(function(it,i){var a=s.ans[i],wrongHere=s.wrong.indexOf(i)>=0;
      h+='<div class="tfrow"><div>'+esc(it.stem.replace(/:\s*$/,''))+': <b>'+esc(it.opt)+'</b></div><div class="tfbtns">'+[true,false].map(function(v){
        var c='';if(a===v)c=s.phase==='answer'?' sel':(wrongHere?' no':' ok');if(locked&&rv.truth&&v===rv.truth[i])c=' ok';
        return '<button class="opt'+c+'" data-act="tf" data-i="'+i+'" data-v="'+v+'"'+(s.phase!=='answer'||P.busy?' disabled':'')+'>'+(v?L('Đúng','True'):L('Sai','False'))+'</button>';}).join('')+'</div>'+
        (locked&&rv.truth&&!rv.truth[i]?'<div class="small muted">'+L('Đáp án đúng: ','Correct answer: ')+esc(rv.right[i])+'</div>':'')+'</div>';});
  }else{
    h+='<h3 class="q">'+L('Chạm một thuật ngữ tiếng Việt, rồi chạm nghĩa tiếng Anh của nó.','Tap a Vietnamese term, then its English match.')+'</h3><div class="pairs"><div>';
    t.vi.forEach(function(vi,i){var linked=s.link[i]!==undefined,c='';
      if(s.phase==='answer'){if(s.pickL===i)c=' sel';else if(linked)c=' paired';}else c=s.wrong.indexOf(i)>=0?' no':' ok';
      h+='<button class="opt'+c+'" style="margin-bottom:8px" data-act="ml" data-i="'+i+'"'+(s.phase!=='answer'||P.busy?' disabled':'')+'>'+esc(vi)+(linked&&s.phase==='answer'?' ↔ '+(Object.keys(s.link).indexOf(String(i))+1):'')+'</button>';});
    h+='</div><div>';
    t.en.forEach(function(en,j){var by=null;Object.keys(s.link).forEach(function(k){if(s.link[k]===j)by=+k;});var c=by!==null?(s.phase==='answer'?' paired':(s.wrong.indexOf(by)>=0?' no':' ok')):'';
      if(locked)c=' ok';
      h+='<button class="opt'+c+'" style="margin-bottom:8px" data-act="mr" data-j="'+j+'"'+(s.phase!=='answer'||P.busy?' disabled':'')+'>'+esc(en)+'</button>';});
    h+='</div></div>';
    if(locked&&rv.pairs)h+='<div class="small muted">'+rv.pairs.map(function(p){return esc(p[0])+' = '+esc(p[1]);}).join(' · ')+'</div>';
  }
  if(s.hinted&&t.type==='mc')h+='<div class="fb hint"><b>'+L('Gợi ý 50:50','50:50 hint')+'</b>'+L('Đã loại hai đáp án sai.','Two wrong answers removed.')+'</div>';
  if(s.phase==='wrong')h+='<div class="fb bad">'+L('Chưa đúng. Mục sai đã được đánh dấu. Bạn được thử lại một lần.','Not quite. Wrong items are marked. You can try once more.')+'</div>';
  if(s.err)h+='<div class="fb bad">'+s.err+'</div>';
  if(locked){var f=s.final,e=t.type==='mc'&&s.e?'<br>'+L('Giải thích: ','Why: ')+esc(s.e):'';
    h+='<div class="fb '+(f.ok?'good':'bad')+'"><b>'+(f.ok?(f.attempt===1?L('Chính xác!','Correct!'):L('Đúng rồi, ở lần thử thứ hai.','Right, on your second try.')):L('Chưa đúng. Đáp án đúng đã được tô xanh.','Not quite. The right answers are shown in green.'))+'</b>+'+f.xp+' XP'+e+'</div>';}
  h+='</div>';
  el('play-body').innerHTML=h;
  var a='<button class="btn ghost" data-act="quit">'+L('Thoát','Quit')+'</button>';
  if(s.phase==='answer')a+=(t.type==='mc'?'<button class="btn ghost" data-act="hint"'+(s.hinted||P.busy?' disabled':'')+'>'+L('50:50 (−5 XP)','50:50 (−5 XP)')+'</button>':'')+'<button class="btn" data-act="check"'+(ready()&&!P.busy?'':' disabled')+'>'+(P.busy?L('Đang kiểm tra…','Checking…'):L('Kiểm tra','Check'))+'</button>';
  else if(s.phase==='wrong')a+='<button class="btn" data-act="retry">'+L('Thử lại','Try again')+'</button>';
  else a+='<button class="btn" data-act="next">'+(P.i===4?L('Xem kết quả','See results'):L('Tiếp tục','Next'))+'</button>';
  el('play-bar').innerHTML=a;
}
function ready(){var t=P.tasks[P.i],s=P.t;
  if(t.type==='mc')return s.sel!==null;if(t.type==='tf')return s.ans.every(function(v){return v!==null;});
  return Object.keys(s.link).length===t.vi.length;}
function answerOf(){var t=P.tasks[P.i],s=P.t;
  if(t.type==='mc')return s.sel;if(t.type==='tf')return s.ans.slice();
  return t.vi.map(function(_,i){return s.link[i]===undefined?-1:s.link[i];});}
function check(){
  if(P.busy)return;var s=P.t,hc=s.hinted?5:0,me=P;P.busy=true;s.err='';renderStage();
  Bank.check(P.play,P.i,answerOf()).then(function(res){
    if(P!==me)return;P.busy=false;
    if(!res.ok){s.err=bankError(res);renderStage();return;}
    s.wrong=res.wrong;
    if(res.final){s.reveal=res.reveal;s.e=res.e||'';var ok=!res.wrong.length;
      s.final=ok?{ok:true,attempt:res.attempt,score:res.attempt===1?100:60,xp:Math.max(0,res.right*(res.attempt===1?15:10)-hc)}
                :{ok:false,attempt:res.attempt,score:Math.round(40*res.right/res.n),xp:Math.max(0,res.right*5-hc)};
      finishTask();}
    else{s.attempt=2;s.phase='wrong';renderStage();}
  },function(){if(P!==me)return;P.busy=false;s.err=bankError(netFail());renderStage();});
}
function finishTask(){var s=P.t,t=P.tasks[P.i];s.phase='done';P.xp+=s.final.xp;P.results[P.i]=s.final;
  if(t.type==='mc'&&!s.final.ok&&S.review.indexOf(t.qid)<0)S.review.push(t.qid);
  renderStage();}
function retry(){var t=P.tasks[P.i],s=P.t;s.phase='answer';
  if(t.type==='mc')s.sel=null;else if(t.type==='tf')s.wrong.forEach(function(i){s.ans[i]=null;});else{s.wrong.forEach(function(i){delete s.link[i];});s.pickL=null;}
  s.wrong=[];renderStage();}
function useHint(){
  var s=P.t,me=P;if(s.hinted||P.busy)return;P.busy=true;renderStage();
  Bank.hint(P.play,P.i).then(function(res){if(P!==me)return;P.busy=false;if(res.ok){s.removed=res.remove;s.hinted=true;if(s.sel!==null&&s.removed.indexOf(s.sel)>=0)s.sel=null;}renderStage();},function(){if(P===me){P.busy=false;renderStage();}});
}
function nextTask(){if(P.i<4){P.i++;startTask();renderStage();el('play').scrollTop=0;}else stageResult();}
function stageResult(){
  var avg=Math.round(P.results.reduce(function(a,r){return a+r.score;},0)/5),st=starsPct(avg),bonus=st>=1?20:0;
  P.xp+=bonus;var raw=P.xp;P.xp=xpBoost(P.xp);P.boost=P.xp-raw;S.xp+=P.xp;P.res={avg:avg,st:st,first:award(P.node,st,50,avg)};renderStageResult();
}
function renderStageResult(){
  var avg=P.res.avg,st=P.res.st,first=P.res.first;
  var h='<div class="card center"><div class="eyebrow">'+esc(P.node.id+' · '+tx(P.node.name))+'</div><h1>'+(st?L('Qua chặng!','Stage cleared!'):L('Chưa qua chặng','Not cleared yet'))+'</h1>'+starRow(st)+
    (st?'':'<p class="muted">'+L('Cần ít nhất 60%. Chơi lại để có bộ câu hỏi mới.','You need at least 60%. Replay for a fresh set of questions.')+'</p>')+
    '<div class="kpis"><div class="kpi"><span>'+L('Điểm','Score')+'</span><b>'+avg+'%</b></div><div class="kpi"><span>XP</span><b>'+P.xp+'</b></div><div class="kpi"><span>'+L('Vốn','Capital')+'</span><b>'+(first?'+'+(has('solar')?63:50)+'k':'—')+'</b></div></div><div class="rows">';
  P.results.forEach(function(r,i){h+='<div class="rowline"><span>'+(i+1)+' · '+taskTag(P.tasks[i])+'</span><b>'+r.score+'% · +'+r.xp+' XP</b></div>';});
  if(P.boost)h+='<div class="rowline"><span>☕ '+L('Máy pha espresso','Espresso machine')+' +10%</span><b>+'+P.boost+' XP</b></div>';
  el('play-body').innerHTML=h+'</div></div>';playHud();
  el('play-bar').innerHTML='<button class="btn ghost" data-act="replay">'+L('Chơi lại','Replay')+'</button><button class="btn" data-act="quit">'+L('Về con đường','Back to the road')+'</button>';
}

/* ---------- boss ---------- */
var timerH=null;
function stopTimer(){if(timerH){clearInterval(timerH);timerH=null;}}
function startBoss(node,useTicket){
  var lives=3;if(useTicket&&S.inv.retry>0){S.inv.retry--;lives=4;persist();}
  P={node:node,kind:'boss',qs:null,i:0,lives:lives,right:0,xp:0,pick:null,left:45,busy:false};
  openPlay();playLoading(node.id+' · '+tx(node.name));
  var me=P;Bank.boss(node.id).then(function(res){if(P!==me)return;if(!res.ok){playFail(res);return;}P.play=res.play;P.qs=res.qs;bossQ();},function(){if(P===me)playFail(netFail());});
}
function bossQ(){P.pick=null;P.correct=null;P.e='';P.left=bossSec();stopTimer();
  timerH=setInterval(function(){P.left--;var bar=el('tbar');if(bar)bar.style.width=(P.left/bossSec()*100)+'%';if(P.left<=0){stopTimer();bossAnswer(-1);}},1000);renderBoss();}
function renderBoss(){
  var q=P.qs[P.i],done=P.correct!==null,h='';
  el('play-title').innerHTML=esc(P.node.id+' · '+tx(P.node.name));playHud('<span class="pill lives">'+'❤'.repeat(Math.max(0,P.lives))+'</span>');
  h+='<div class="dots" aria-hidden="true">';P.qs.forEach(function(_,i){h+='<i class="'+(i<P.i||(i===P.i&&done)?'done':i===P.i?'cur':'')+'"></i>';});h+='</div>';
  h+='<div class="timer" aria-hidden="true"><i id="tbar" style="width:'+(P.left/bossSec()*100)+'%"></i></div>';
  h+='<div class="card"><span class="tag">'+L('Câu ','Question ')+(P.i+1)+'/'+P.qs.length+' · '+L('Chương ','Chapter ')+q.ch+'</span>'+viBadge()+'<h3 class="q">'+esc(q.q)+'</h3>';
  q.opts.forEach(function(o,i){var c='';if(done){if(i===P.correct)c=' ok';else if(i===P.pick)c=' no';}else if(P.pick===i)c=' sel';
    h+='<button class="opt'+c+'" data-act="bossans" data-i="'+i+'"'+(done||P.busy?' disabled':'')+'>'+esc(o)+'</button>';});
  if(done){var ok=P.pick===P.correct;h+='<div class="fb '+(ok?'good':'bad')+'"><b>'+(ok?L('Chính xác! +10 XP','Correct! +10 XP'):P.pick===-1?L('Hết giờ! −1 mạng','Time is up! −1 life'):L('Sai rồi! −1 mạng','Wrong! −1 life'))+'</b>'+(P.e?esc(P.e):'')+'</div>';}
  else if(P.err)h+='<div class="fb bad">'+P.err+'</div>';
  h+='</div>';el('play-body').innerHTML=h;
  el('play-bar').innerHTML='<button class="btn ghost" data-act="quit">'+L('Bỏ cuộc','Give up')+'</button>'+(done?'<button class="btn" data-act="bossnext">'+(P.lives<=0||P.i===P.qs.length-1?L('Xem kết quả','See results'):L('Câu tiếp','Next question'))+'</button>':(P.busy?'<button class="btn" disabled>'+L('Đang kiểm tra…','Checking…')+'</button>':''));
}
function bossAnswer(i){
  if(P.correct!==null||P.busy)return;stopTimer();P.pick=i;P.busy=true;P.err='';renderBoss();var me=P,q=P.qs[P.i];
  Bank.bossCheck(P.play,P.i,i).then(function(res){
    if(P!==me)return;P.busy=false;
    if(!res.ok){P.err=bankError(res);P.pick=null;renderBoss();return;}
    P.correct=res.correct;P.e=res.e||'';
    if(i===res.correct){P.right++;P.xp+=10;}else{P.lives--;if(S.review.indexOf(q.qid)<0)S.review.push(q.qid);}
    renderBoss();
  },function(){if(P!==me)return;P.busy=false;P.pick=null;P.err=bankError(netFail());renderBoss();});
}
function bossNext(){if(P.lives<=0||P.i===P.qs.length-1)bossResult();else{P.i++;bossQ();el('play').scrollTop=0;}}
function bossResult(){
  stopTimer();var pct=Math.round(P.right/P.qs.length*100),won=P.lives>0&&pct>=60,st=won?starsPct(pct):0;
  if(won)P.xp+=100;S.xp+=P.xp;P.res={pct:pct,won:won,st:st,first:award(P.node,st,500,pct)};renderBossResult();
}
function renderBossResult(){
  var won=P.res.won,st=P.res.st,first=P.res.first,w=WORLDS[P.node.w],nx=WORLDS[P.node.w+1];
  var h='<div class="card center"><div class="eyebrow">'+esc(tx(P.node.name))+'</div><h1>'+(won?L('Chốt thương vụ lớn!','Big deal closed!'):L('Thương vụ thất bại','The deal fell through'))+'</h1>'+starRow(st);
  if(won&&first)h+='<div class="promo-av">'+avatarBig(P.node.w+1,120)+'</div><p><b>'+L('Thăng cấp: ','Promoted: ')+tx(w.rank)+'</b><br>'+L('Nhân vật mới: ','New look: ')+tx(LOOKS[P.node.w+1].n)+(nx?'<br>'+L('Đường mở rộng: ','The road widens: ')+tx(nx.road)+' · '+nx.lanes+L(' làn',' lanes'):'')+'</p>';
  if(!won)h+='<p class="muted">'+(P.lives<=0?L('Hết mạng. ','Out of lives. '):'')+L('Cần đúng ít nhất 60% và còn mạng. Mua vé đấu lại ở cửa hàng để có thêm mạng.','You need at least 60% with a life left. Buy a retry ticket in the shop for an extra life.')+'</p>';
  h+='<div class="kpis"><div class="kpi"><span>'+L('Đúng','Correct')+'</span><b>'+P.right+'/'+P.qs.length+'</b></div><div class="kpi"><span>XP</span><b>'+P.xp+'</b></div><div class="kpi"><span>'+L('Vốn','Capital')+'</span><b>'+(won&&first?'+'+(has('solar')?625:500)+'k':'—')+'</b></div></div></div>';
  el('play-body').innerHTML=h;playHud();
  el('play-bar').innerHTML='<button class="btn ghost" data-act="replay">'+L('Đánh lại','Fight again')+'</button><button class="btn" data-act="quit">'+L('Về con đường','Back to the road')+'</button>';
}
function bossIntro(node){
  P={node:node,kind:'bossintro',xp:0};openPlay();
  el('play-title').innerHTML=esc(node.id+' · '+tx(node.name));playHud();
  var n=node.w===6?15:12;
  el('play-body').innerHTML='<div class="card"><span class="tag">'+L('Trùm cuối chương','Chapter boss')+'</span><h1>'+esc(tx(node.name))+'</h1><p>'+L(n+' câu trộn từ mọi chặng'+(node.w===6?' của cả 7 chương':' của chương')+'. Mỗi câu '+bossSec()+' giây'+(has('van')?' (🚐 +10 giây)':'')+'. Bạn có 3 mạng: sai hoặc hết giờ mất 1 mạng. Đúng từ 60% và còn mạng là thắng.',
    n+' mixed questions from '+(node.w===6?'all 7 chapters':'every stage of the chapter')+'. '+bossSec()+' seconds each'+(has('van')?' (🚐 +10 s)':'')+'. You have 3 lives; a wrong answer or a timeout costs one. Win with 60% correct and a life left.')+'</p><p class="muted small">'+L('Vé đấu lại trong túi: ','Retry tickets you hold: ')+S.inv.retry+'</p></div>';
  el('play-bar').innerHTML='<button class="btn ghost" data-act="quit">'+L('Thoát','Quit')+'</button>'+(S.inv.retry>0?'<button class="btn ghost" data-act="bossgo" data-t="1">❤️ '+L('Dùng vé (+1 mạng)','Use a ticket (+1 life)')+'</button>':'')+'<button class="btn" data-act="bossgo">'+L('Bắt đầu','Start')+'</button>';
}

/* ---------- decision missions ---------- */
function startMission(node){
  var m=MISSIONS[node.id];
  if(m.kind==='cafe'){openCafe();return;}
  if(m.kind==='rounds'){P={node:node,kind:'rounds',m:m,hist:[],xp:0};openPlay();renderRounds();return;}
  P={node:node,kind:'decide',m:m,x:m.start,tries:[],xp:0,done:false,best:bestOf(m)};openPlay();renderDecide();
}
function decideChart(m,tries,showBest){
  var W=320,Hh=180,x0=46,y0=150,top=28,vals=[],b=P.best;
  for(var x=m.min;x<=m.max;x++)vals.push(m.f(x));
  var lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals);if(m.lower)hi=Math.min(hi,b.v*2.2);lo=Math.min(lo,0);if(hi===lo)hi=lo+1;
  var X=function(x){return x0+(x-m.min)/(m.max-m.min)*(W-x0-10);},Y=function(v){return y0-(Math.max(lo,Math.min(hi,v))-lo)/(hi-lo)*(y0-top);};
  var s='<svg class="chart" viewBox="0 0 '+W+' '+(Hh+10)+'" role="img" aria-label="'+tx(m.vlabel)+'">';
  [lo,(lo+hi)/2,hi].forEach(function(v){s+='<line x1="'+x0+'" x2="'+(W-10)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)"/><text x="'+(x0-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+fmt(v)+'</text>';});
  if(lo<0)s+='<line x1="'+x0+'" x2="'+(W-10)+'" y1="'+Y(0)+'" y2="'+Y(0)+'" stroke="var(--muted)" stroke-dasharray="3 3"/>';
  [m.min,Math.round((m.min+m.max)/2),m.max].forEach(function(x){s+='<text x="'+X(x)+'" y="'+(y0+16)+'" text-anchor="middle">'+x+'</text>';});
  s+='<text x="'+(W-10)+'" y="'+(y0+32)+'" text-anchor="end">'+esc(tx(m.label))+'</text>';
  if(showBest){var d='';for(var x2=m.min;x2<=m.max;x2++)d+=(x2===m.min?'M':'L')+X(x2).toFixed(1)+' '+Y(m.f(x2)).toFixed(1);s+='<path d="'+d+'" fill="none" stroke="var(--teal)" stroke-width="2.5"/>';

/* ---------- website: live-event documents in the Worker's D1 store (same calls as the claude.ai db) ----------
   One poll carries every subscribed document with the version this page has; the Worker returns only what changed.
   Poll every 1.5 s while hosting, 2.5 s in the arena during an event, 6 s on the road during an event, 10 s otherwise. */
function WebEv(){
  var subs={},ver={},msubs=[],mver=0,timer=null,stopped=false,busy=false,again=false;
  function soon(ms){if(stopped)return;if(busy){again=true;return;}clearTimeout(timer);timer=setTimeout(poll,ms);}
  function snap(body){return {exists:body!==null&&body!==undefined,data:function(){return body;}};}
  function delay(){var live=arClassLive();return !live?10000:arHosting()?1500:(P&&P.kind==='arena')?2500:6000;}
  function poll(){
    if(stopped||busy)return;busy=true;clearTimeout(timer);
    var want={};Object.keys(subs).forEach(function(p){want[p]=ver[p]||0;});
    var req={docs:want};if(msubs.length)req.moves=mver;
    fastCall('evpoll',req).then(function(res){
      if(!res||!res.ok){if(res&&(res.error==='no_db'||res.error==='bad_request')){EVDB=null;stopped=true;if(P&&P.kind==='arena')renderArena();}return;}
      if(!EVDB){EVDB=api0;if(P&&P.kind==='arena')renderArena();panel();}
      Object.keys(res.docs||{}).forEach(function(p){var d=res.docs[p];ver[p]=d.t;(subs[p]||[]).forEach(function(fn){fn(snap(d.body));});});

    },function(){}).then(function(){busy=false;if(!stopped)timer=setTimeout(poll,again?300:delay());again=false;});
  }
  var api0={
    doc:function(path){return {
