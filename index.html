    '<label>'+L('Thời lượng','Duration')+'<select id="ev-min">'+[5,10,15,20,30,45].map(function(v){return '<option value="'+v+'"'+(v===15?' selected':'')+'>'+v+L(' phút',' min')+'</option>';}).join('')+'</select></label>'+
    '<label>'+L('Mỗi vòng thị trường','Each market round')+'<select id="ev-sec">'+[30,45,60,90,120].map(function(v){return '<option value="'+v+'"'+(v===60?' selected':'')+'>'+v+L(' giây',' s')+'</option>';}).join('')+'</select></label>'+
    '<label>'+L('Hình thức','Format')+'<select id="ev-mode"><option value="solo">'+L('Cá nhân','Individual')+'</option>'+[2,3,4,5,6].map(function(v){return '<option value="team'+v+'">'+v+L(' đội',' teams')+'</option>';}).join('')+'</select></label>'+
    '<label>'+L('Bot mỗi quận','Bots per district')+'<select id="ev-bots">'+[0,1,2,3].map(function(v){return '<option value="'+v+'"'+(v===2?' selected':'')+'>'+v+'</option>';}).join('')+'</select></label></div>'+
    '<label class="small" style="display:flex;gap:8px;align-items:center;margin-top:8px"><input type="checkbox" id="ev-all"> '+L('Mở mọi quận (bỏ điều kiện chương)','Open every district (ignore the chapter rule)')+'</label>'+
    '<p class="small muted" style="margin-top:6px">'+L('Máy của bạn là máy chủ: giữ trang này mở đến khi hết giờ. Học viên vào bằng nút ⚔️ trên con đường.','Your device is the host: keep this page open until time runs out. Students join with the ⚔️ button on the road.')+'</p>'+
    '<div class="acts"><button class="btn" data-act="evopen">⚔️ '+L('Mở thi đấu','Open the event')+'</button></div></div>';
  else if(EVDB||!SHEETS||!teacherAllowed())h+='<p class="fb hint" style="margin-top:10px">'+L('Chưa có cuộc thi nào đang mở. Giáo viên sẽ mở trong giờ học; trong lúc chờ, hãy luyện tập với bot.','No event is open now. Your teacher opens one in class; meanwhile, practise against bots.')+'</p>';
  else h+='<p class="fb hint" style="margin-top:10px">'+L('Thi đấu trực tiếp cả lớp cần Cloudflare Worker có cơ sở dữ liệu D1 (gắn tên DB). Xem Bước 2 trong hướng dẫn Release 3. Trong lúc chờ, vẫn luyện tập được với bot.','Live class events need the Cloudflare Worker with a D1 database bound as DB (Release 3 guide, step 2). Practice against bots works meanwhile.')+'</p>';
  return h;
}
function renderArena(){
  if(!P||P.kind!=='arena')return;
  var x=arX(),st=x.state,cfg=x.cfg,host=arHosting(),h='',bar='';
  el('play-title').innerHTML='<span style="white-space:nowrap">⚔️ TP.HCM</span>'+(AR.view==='practice'?'<small>'+L('Luyện tập','Practice')+'</small>':'');
  if(AR.duel){renderDuel();return;}
  var live=cfg&&st&&st.eid===cfg.eid&&(cfg.status==='live'||cfg.status==='ended')&&(AR.view==='practice'||arClassLive()||host);
  if(!live||(AR.view!=='practice'&&!arClassLive())){
    AR.view='class';el('play-hud').innerHTML='';
    h=arClassLive()&&!(AR.cls.state&&AR.cls.state.eid===AR.cls.cfg.eid)?'<p class="loading muted">'+L('Đang tải bản đồ thi đấu…','Loading the battle map…')+'</p>':arLobby();
    bar='<button class="btn ghost" data-act="quit">'+L('Về con đường','Back to the road')+'</button><button class="btn" data-act="arpractice">'+L('Luyện tập với bot (5 phút)','Practise vs bots (5 min)')+'</button>';
    el('play-body').innerHTML=h;el('play-bar').innerHTML=bar;return;
  }
  AR.seenRound=st.round;AR.seenLog=st.log.length;
  var m=arMine(),me=arMe(),myPr=st.sc[me]?st.sc[me].pr:0;
  el('play-hud').innerHTML='<span class="pill">'+L('Vòng ','Round ')+st.round+' · ⏱ <b id="ar-next">'+mmss(st.nextAt-Date.now())+'</b></span><span class="pill lives">'+L('Còn ','Left ')+'<b id="ar-left">'+mmss(cfg.end-Date.now())+'</b></span>'+(host?'':'<span class="pill cap">'+L('Lãi ','Profit ')+fmt(myPr)+'k</span>');
  if(host)h+='<div class="fb hint" style="margin-top:0">'+L('Bạn là máy chủ của cuộc thi: giữ trang này mở. ','You are hosting this event: keep this page open. ')+Object.keys(st.sc).length+L(' người đang chơi · ',' players selling · ')+(cfg.mode==='team'?cfg.teams+L(' đội',' teams'):L('cá nhân','individual'))+'</div>';
  else if(cfg.mode==='team'&&st.sc[me]&&st.sc[me].team>=0){var tm=MK.TEAMS[st.sc[me].team];h+='<p class="small" style="margin:0 0 6px"><span class="dot" style="background:'+tm.color+'"></span>'+L('Bạn ở ','You are in ')+'<b>'+esc(tx(V(tm.vi,tm.en)))+'</b></p>';}
  h+='<div class="tabs" role="tablist"><button role="tab" data-act="artab" data-t="map" aria-selected="'+(AR.tab==='map')+'">'+L('Bản đồ','Map')+'</button><button role="tab" data-act="artab" data-t="rank" aria-selected="'+(AR.tab==='rank')+'">'+L('Xếp hạng','Ranking')+'</button></div>';
  if(cfg.status==='ended'){h+=arResults();}
  else if(AR.tab==='rank')h+=arRanking();
  else{
    h+='<div class="map hexwrap">'+arMapSVG()+'</div><div class="legend small"><span><span class="dot" style="background:var(--gold)"></span>'+L('Bạn dẫn đầu','You lead')+'</span><span><span class="dot" style="background:#9aa7ad"></span>'+L('Bot dẫn đầu','A bot leads')+'</span><span><span class="dot" style="background:#2f6fd6"></span>'+(cfg.mode==='team'?L('Màu đội dẫn đầu','Leading team colour'):L('Người khác dẫn đầu','Another player leads'))+'</span><span>'+L('Viền vàng = quán của bạn','Gold border = your shops')+'</span></div>';
    if(!host&&!m.act.length&&!AR.sel)h+='<p class="fb hint">'+L('Chạm một quận để xem thị trường và mở quán (tối đa 3 quận).','Tap a district to see its market and open a shop (up to 3 districts).')+'</p>';
    if(AR.sel)h+=arCard(AR.sel);
    else if(m.act.length)h+='<div class="card" style="margin-top:10px"><p class="eyebrow" style="margin:0 0 6px">'+L('Quán của bạn','Your shops')+'</p>'+m.act.map(function(d){var r=st.d[d].last[me];return '<div class="rowline"><button class="btn ghost mini" data-hex="'+d+'">'+esc(lang==='vi'?MK.BY[d].vi:MK.BY[d].en)+'</button><b>'+(r?Math.round(r.sh*100)+'% · '+fmt(r.pr)+'k':L('bán từ vòng tới','sells next round'))+'</b></div>';}).join('')+'</div>';
  }
  el('play-body').innerHTML=h;
  bar='<button class="btn ghost" data-act="quit">'+L('Về con đường','Back to the road')+'</button>';
  if(host&&cfg.status==='live')bar+='<button class="btn ghost" data-act="evmore">+5 '+L('phút','min')+'</button><button class="btn" style="background:var(--bad);border-color:var(--bad)" data-act="evstop">'+(AR.confirmStop?L('Bấm lần nữa để kết thúc','Tap again to end'):L('Kết thúc ngay','End now'))+'</button>';
  if(AR.view==='practice'&&cfg.status==='ended')bar+='<button class="btn" data-act="arpractice">'+L('Luyện tập lại','Practise again')+'</button>';
  el('play-bar').innerHTML=bar;
}
function renderDuel(){
  var D=AR.duel,h='',dd=MK.BY[D.d];el('play-hud').innerHTML='<span class="pill xp">'+D.pts+L(' điểm',' pts')+'</span><span class="pill">🛡 '+Math.round(D.def)+'</span>';
  h+='<div class="scene"><b>⚔️ '+L('Thách đấu ','Duel vs ')+esc(arName(D.tgt))+'</b> · '+esc(lang==='vi'?dd.vi:dd.en)+'<br><span class="small">'+L('5 câu, mỗi câu 20 giây. Đúng được 12 điểm + thưởng nhanh tới 8 điểm. Vượt điểm phòng thủ ','5 questions, 20 seconds each. A right answer earns 12 points + up to 8 for speed. Beat the defence of ')+'<b>'+Math.round(D.def)+'</b>'+L(' để thắng.',' to win.')+'</span></div>';
  if(D.err){el('play-body').innerHTML=h+'<div class="fb bad">'+D.err+'</div>';el('play-bar').innerHTML='<button class="btn" data-act="duelquit">'+L('Về bản đồ','Back to the map')+'</button>';return;}
  if(!D.qs){el('play-body').innerHTML=h+'<p class="loading muted">'+L('Đang lấy câu hỏi…','Fetching questions…')+'</p>';el('play-bar').innerHTML='';return;}
  if(D.done){var dfx=dd.type==='mono'?L('Bạn giành giấy phép độc quyền!','You take the monopoly licence!'):dd.type==='comp'?L('MC của bạn ở quận này giảm 1.','Your MC in this district falls by 1.'):L('Thương hiệu của bạn +1, đối thủ −1.','Your brand +1, the rival −1.');
    h+='<div class="card center"><h1>'+(D.win?L('Thắng!','You win!'):L('Thua rồi','You lost'))+'</h1><div class="kpis"><div class="kpi"><span>'+L('Điểm của bạn','Your score')+'</span><b>'+D.pts+'</b></div><div class="kpi"><span>'+L('Phòng thủ','Defence')+'</span><b>'+Math.round(D.def)+'</b></div><div class="kpi"><span>'+L('Đúng','Right')+'</span><b>'+D.right+'/'+D.qs.length+'</b></div></div><p style="margin-top:10px">'+(D.win?dfx+' '+L('Điểm '+D.pts+' thành điểm phòng thủ mới của bạn ở quận này.','Your '+D.pts+' becomes your new defence here.'):L('Thử lại sau 30 giây, hoặc thách đấu đối thủ khác.','Try again in 30 seconds, or duel another rival.'))+'</p><p class="small muted">'+L('Bản đồ cập nhật trong vài giây.','The map updates in a few seconds.')+'</p></div>';
    el('play-body').innerHTML=h;el('play-bar').innerHTML='<button class="btn" data-act="duelquit">'+L('Về bản đồ','Back to the map')+'</button>';return;}
  var q=D.qs[D.i],done=D.correct!==null;
  h+='<div class="dots" aria-hidden="true">';D.qs.forEach(function(_,i){h+='<i class="'+(i<D.i||(i===D.i&&done)?'done':i===D.i?'cur':'')+'"></i>';});h+='</div>';
  h+='<div class="timer" aria-hidden="true"><i id="dbar" style="width:'+(D.left/DUEL_SEC*100)+'%"></i></div><div class="card"><span class="tag">'+L('Câu ','Question ')+(D.i+1)+'/'+D.qs.length+' · '+L('Chương ','Chapter ')+q.ch+'</span>'+viBadge()+'<h3 class="q">'+esc(q.q)+'</h3>';
  q.opts.forEach(function(o,i){var c='';if(done){if(i===D.correct)c=' ok';else if(i===D.pick)c=' no';}else if(D.pick===i)c=' sel';h+='<button class="opt'+c+'" data-act="duelans" data-i="'+i+'"'+(done||D.busy?' disabled':'')+'>'+esc(o)+'</button>';});
  if(done)h+='<div class="fb '+(D.pick===D.correct?'good':'bad')+'"><b>'+(D.pick===D.correct?L('Chính xác!','Correct!'):D.pick===-1?L('Hết giờ!','Time is up!'):L('Sai rồi!','Wrong!'))+'</b>'+(D.e?esc(D.e):'')+'</div>';
  el('play-body').innerHTML=h+'</div>';
  el('play-bar').innerHTML='<button class="btn ghost" data-act="duelgiveup">'+L('Bỏ cuộc','Give up')+'</button>'+(done?'<button class="btn" data-act="duelnext">'+(D.i===D.qs.length-1?L('Xem kết quả','See the result'):L('Câu tiếp','Next question'))+'</button>':'');
}
function openArena(){closeSheet();P={kind:'arena',xp:0,node:{id:'',name:V('','')}};if(AR.view==='practice'&&!(AR.prac&&AR.prac.cfg.status==='live'))AR.view='class';AR.duel=null;openPlay();renderArena();}
function arBanner(){
  var c=AR.cls.cfg;if(!c||c.status!=='live')return '';
  return '<div class="evbanner"><span>⚔️ '+(cloud.owner?L('Bạn đang chủ trì thi đấu','You are hosting an event'):L('Đang thi đấu trên bản đồ TP.HCM','A market battle is on'))+' · '+L('còn ','left ')+'<b id="ev-left">'+mmss(c.end-Date.now())+'</b></span><button class="btn" data-act="arena">'+(cloud.owner?L('Mở','Open'):L('Vào thi đấu','Join'))+'</button></div>';
}
function arClock(){
  arHostTick();arPracTick();
  var c=AR.cls.cfg,e=el('ev-left');if(e&&c)e.textContent=mmss(c.end-Date.now());
  var x=arX(),st=x.state,cf=x.cfg;
  if(P&&P.kind==='arena'&&st&&cf){var a=el('ar-next'),b=el('ar-left'),k=el('ar-cool');if(a)a.textContent=mmss(st.nextAt-Date.now());if(b)b.textContent=mmss(cf.end-Date.now());
    if(k){var cool=Math.max(0,(x===AR.prac?10000:DUEL_COOL)-(Date.now()-AR.lastDuel));k.textContent=mmss(cool);if(!cool&&!AR.duel)renderArena();}}
}
setInterval(arClock,1000);

/* ================= EVENTS ================= */
function playNode(){var nd=NODES[S.pos];if(nd.kind==='stage')startStage(nd);else if(nd.kind==='boss')bossIntro(nd);else startMission(nd);}
document.addEventListener('click',function(e){
  var lb=e.target.closest('[data-lang]');
  if(lb){lang=lb.dataset.lang;try{localStorage.setItem('arena-lang',lang);}catch(_){}renderMap();
    if(sheetMode==='talk')renderTalk();else if(sheetMode==='shop')renderShop();else if(sheetMode==='menu')renderMenu();else if(sheetMode==='board')renderBoard();
    if(P){if(P.kind==='stage')(P.res?renderStageResult:renderStage)();else if(P.kind==='boss')(P.res?renderBossResult:renderBoss)();else if(P.kind==='decide')renderDecide();else if(P.kind==='rounds')renderRounds();else if(P.kind==='bossintro')bossIntro(P.node);else if(P.kind==='dash')renderDash();else if(P.kind==='arena')renderArena();}
    return;}
  var hx=e.target.closest('[data-hex]');if(hx&&P&&P.kind==='arena'){AR.sel=AR.sel===hx.dataset.hex&&!hx.classList.contains('mini')?null:hx.dataset.hex;AR.tab='map';renderArena();return;}
  var npc=e.target.closest('[data-npc]');if(npc&&!walking&&!P){openNpc(+npc.dataset.npc);return;}
  var node=e.target.closest('[data-node]');
  if(node&&!P){var i=+node.dataset.node;if(i===S.pos)return;
    if(S.teacher&&teacherAllowed()){S.pos=i;S.npcs=[];spawnAhead();persist();renderMap();follow(i);}
    else toast((i<S.pos?L('Đã đi qua','Already passed'):L('Chưa mở','Locked'))+': '+NODES[i].id+' · '+tx(NODES[i].name));return;}
  var a=e.target.closest('[data-act]');if(!a||a.disabled)return;var act=a.dataset.act;
  switch(act){
   case 'play':if(!walking)playNode();break;
   case 'walk':walk();break;
   case 'shop':shopMsg='';renderShop();openSheet('shop');break;
   case 'menu':renderMenu();openSheet('menu');break;
   case 'buy':buy(a.dataset.id);break;
   case 'closesheet':closeSheet();break;
   case 'teacher':if(teacherAllowed()){S.teacher=!S.teacher;persist();renderMenu();renderMap();}break;
   case 'board':if(boardOpen()){if(SHEETS)sheetsBoard();else{renderBoard();openSheet('board');}}break;
   case 'drefresh':if(SHEETS)sheetsDash();break;
   case 'logout':logout(false);break;
   case 'teacherboard':case 'dash':if(teacherAllowed())openDash();break;
   case 'asstudent':if(canPreview()){asStudent=!asStudent;try{localStorage.setItem('arena-as-student',asStudent?'1':'0');}catch(_){}if(asStudent)S.teacher=false;renderMenu();renderMap();}break;
   case 'dsel':P.sel=P.sel===a.dataset.id?null:a.dataset.id;P.confirm=null;renderDash();break;
   case 'dreset':if(P.confirm===a.dataset.id){P.confirm=null;if(P.sel===a.dataset.id)P.sel=null;resetPlayer(a.dataset.id);}else{P.confirm=a.dataset.id;renderDash();}break;
   case 'dresetall':if(P.confirm==='all'){P.confirm=null;P.sel=null;resetAll();}else{P.confirm='all';renderDash();}break;
   case 'csv':if(teacherAllowed())exportCsv();break;
   case 'reset':if(a.dataset.c){S=fresh();persist();closeSheet();renderMap();follow(0);}else{a.dataset.c='1';renderMenu(true);el('sheet').querySelector('[data-act="reset"]').dataset.c='1';}break;
   case 'npcans':npcAnswer(+a.dataset.i);break;
   case 'usehint':npcHint();break;
   case 'quit':if(P&&P.kind==='arena'){AR.duel=null;clearInterval(AR.dt);AR.confirmStop=false;}closePlay();break;
   case 'arena':if(!walking)openArena();break;
   case 'arpractice':arStartPractice();break;
   case 'artab':AR.tab=a.dataset.t;renderArena();break;
   case 'arjoin':arJoin(a.dataset.d);break;
   case 'arleave':arLeave(a.dataset.d);break;
   case 'arstep':var sd=a.dataset.d,st0=MK.TYPES[MK.BY[sd].type],rg=el('arr'),nv=Math.max(st0.min,Math.min(st0.max,(+rg.value)+(+a.dataset.v)));rg.value=nv;arSlide(sd,nv);break;
   case 'arduel':arStartDuel(a.dataset.d,a.dataset.t);break;
   case 'duelans':arDuelAnswer(+a.dataset.i);break;
   case 'duelnext':arDuelNext();break;
   case 'duelgiveup':arDuelFinish();break;
   case 'duelquit':AR.duel=null;clearInterval(AR.dt);renderArena();break;
   case 'evopen':if(teacherAllowed()){var md=el('ev-mode').value;arOpenEvent({min:+el('ev-min').value,sec:+el('ev-sec').value,mode:md==='solo'?'solo':'team',teams:md==='solo'?0:+md.slice(4),bots:+el('ev-bots').value,openAll:el('ev-all').checked});}break;
   case 'evmore':if(arHosting())arSetEnd(AR.cls.cfg.end+300000);break;
   case 'evstop':if(arHosting()){if(AR.confirmStop){AR.confirmStop=false;arSetEnd(Date.now());arHostTick();}else{AR.confirmStop=true;renderArena();}}break;
   case 'replay':var nd=P.node;stopTimer();P=null;if(nd.kind==='stage')startStage(nd);else if(nd.kind==='boss')bossIntro(nd);else startMission(nd);break;
   case 'mc':if(!P.busy){P.t.sel=+a.dataset.i;renderStage();}break;
   case 'tf':P.t.ans[+a.dataset.i]=a.dataset.v==='true';renderStage();break;
   case 'ml':P.t.pickL=P.t.pickL===+a.dataset.i?null:+a.dataset.i;renderStage();break;
   case 'mr':if(P.t.pickL!==null){var j=+a.dataset.j;Object.keys(P.t.link).forEach(function(k){if(P.t.link[k]===j)delete P.t.link[k];});P.t.link[P.t.pickL]=j;P.t.pickL=null;renderStage();}break;
   case 'hint':useHint();break;
   case 'check':check();break;
   case 'retry':retry();break;
   case 'next':nextTask();break;
   case 'bossgo':startBoss(P.node,!!a.dataset.t);break;
   case 'bossans':bossAnswer(+a.dataset.i);break;
   case 'bossnext':bossNext();break;
   case 'dx':P.x=Math.max(P.m.min,Math.min(P.m.max,P.x+(+a.dataset.d)));renderDecide();break;
   case 'dtry':dTry();break;
   case 'dfinish':dFinish();break;
   case 'rnd':playRound(a.dataset.v);break;
   case 'closeframe':closeCafe();break;
  }
});
document.addEventListener('change',function(e){if(e.target.id==='hide-me'){S.hide=e.target.checked;persist();}
  if(e.target.id==='showboard'&&teacherAllowed()&&cloud.db)writeConfig({showBoard:e.target.checked}).then(function(){panel();});});
function arSlide(did,v){arDecide(did,v);var x=arX(),b=el('arv'),pv=el('arpv');if(b)b.textContent=v;if(pv)pv.innerHTML=arPreviewText(did,MK.preview(x.state,x.cfg,did,arMe(),v,arMine()));}
document.addEventListener('input',function(e){if(e.target.id==='arr'&&P&&P.kind==='arena'){arSlide(e.target.dataset.d,+e.target.value);return;}if(e.target.id==='dr'&&P&&P.kind==='decide'){P.x=+e.target.value;el('dv').innerHTML=P.x+' <small>'+tx(P.m.unit)+'</small>';var b=el('play-bar').querySelector('[data-act="dtry"]');if(b)b.textContent=L('Thử với ','Try ')+P.x;}});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if(sheetMode)closeSheet();}
  if((e.key==='Enter'||e.key===' ')&&e.target.closest&&e.target.closest('[data-npc],[data-node],[data-hex]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}
});
el('ov').addEventListener('click',function(e){if(e.target===el('ov'))closeSheet();});
window.addEventListener('pageshow',function(){syncCafe();if(!P)renderMap();});

if(!S.npcs.length&&S.pos===0&&!Object.keys(S.best).length)S.npcs.push({id:S.nid++,type:'customer',t:0.6,dx:roadW(1)/2+16});
syncCafe();renderMap();requestAnimationFrame(function(){follow(S.pos);});
if(SHEETS){sheetsInit();el('lg-form').addEventListener('submit',function(e){e.preventDefault();doLogin();});
  document.addEventListener('visibilitychange',function(){if(!document.hidden)sheetsHello();});}
else initCloud();
})();
</script>
